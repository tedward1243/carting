  MP.engine = new RaceEngine(cv, {
    tier: T, track, laps, racers, items: false, ers: false, difficulty: 'normal', sound: false, headless: true, mpHost: true, weather, stops: raceStops(MP.track),
    onCarEvent, onEnd: out => mpHostEnd(out)
  });
  renderMpHostRace();
};
// the host races too: its car is driven on this screen like a normal race, while the
// engine still runs every other car and streams the race to the phones
function mpHostPlayRace(T, track, laps, racers, weather, onCarEvent) {
  closeModal(); appEl.innerHTML = '';
  const rs = $('#race-screen');
  rs.classList.remove('hidden', 'race-quali');
  $('#pause-menu').classList.add('hidden'); $('#pit-menu').classList.add('hidden');
  document.querySelectorAll('[data-act="pit-open"]').forEach(b => b.classList.remove('on'));
  document.documentElement.classList.add('mp-hostplay');
  // pause menu: the race can't stop for everyone, so "End race for everyone" replaces Restart / Retire
  const card = $('#pause-menu .overlay-card');
  if (card && !card.querySelector('.mp-only')) card.insertAdjacentHTML('beforeend',
    `<button class="btn mp-only" data-act="mp-ov">📺 Race overview (O)</button><button class="btn danger mp-only" data-act="mp-end">End race for everyone</button><p class="muted small mp-only">The race keeps running for the phones while this menu is open.</p>`);
  if (!$('#mp-ov')) rs.insertAdjacentHTML('beforeend', `<button id="mp-ov-btn" class="mp-ov-btn" data-act="mp-ov">📺 OVERVIEW</button><div id="mp-ov" class="mp-host mp-ov hidden" data-act="mp-ov"><canvas id="mp-ov-canvas"></canvas><div class="mp-ov-hint">Tap or press O to go back to your car</div></div>`);
  MP.hostView = false; $('#mp-ov').classList.add('hidden');
  MP.hostCanvas = $('#mp-ov-canvas');
  startTilt(); phoneRaceMode();
  const hand = applyHand();
  if (UI.resetPedal) UI.resetPedal();
  MP.engine = UI.engine = new RaceEngine($('#race-canvas'), {
    tier: T, track, laps, racers, items: false, ers: false, weather, mpHost: true, onCarEvent, stops: raceStops(MP.track),
    onPit: cmd => {
      const pm = $('#pit-menu');
      if (cmd === 'choose') { pm.classList.remove('hidden'); pm.classList.add('choosing'); }
      else if (cmd === 'on' || cmd === 'off') document.querySelectorAll('[data-act="pit-open"]').forEach(b => b.classList.toggle('on', cmd === 'on'));
      else { pm.classList.add('hidden'); pm.classList.remove('choosing'); document.querySelectorAll('[data-act="pit-open"]').forEach(b => b.classList.remove('on')); }
    },
    hand: IS_TOUCH ? hand : 'right', haptics: IS_TOUCH && (!S || S.settings.haptics !== false), difficulty: 'normal',
    sound: !S || S.settings.sound !== false, tilt: TILT,
    view: getViewPref(), onView: v => { try { localStorage.setItem('k2c.view', v); } catch (e) { } },
    onPause: p => $('#pause-menu').classList.toggle('hidden', !p),
    onEnd: out => { mpHostPlayCleanup(); mpHostEnd(out); }
  });
  // stream the race to the phones, keep the pit log, draw the overview when it is open
  clearInterval(MP.sendT);
  MP.sendT = setInterval(() => {
    const e = MP.engine;
    if (!e || e.done) return;
    mpSendAll(e.snapshot());
    mpPitLog(e);
    if (MP.hostView) drawMpOverview();
  }, 50);
  window.removeEventListener('keydown', mpOvKey); window.addEventListener('keydown', mpOvKey);
}
function mpOvKey(ev) { if (ev.code === 'KeyO' && MP.engine && UI.engine === MP.engine) ACTIONS['mp-ov'](); }
ACTIONS['mp-ov'] = () => {
  const ov = $('#mp-ov'); if (!ov) return;
  MP.hostView = !MP.hostView; ov.classList.toggle('hidden', !MP.hostView);
  const e = UI.engine; if (e && e.paused && MP.hostView) e.togglePause();
  if (MP.hostView) drawMpOverview();
};
function mpHostPlayCleanup() {
  clearInterval(MP.sendT);
  window.removeEventListener('keydown', mpOvKey);
  UI.engine = null; MP.hostView = false;
  const ov = $('#mp-ov'); if (ov) ov.classList.add('hidden');
  document.documentElement.classList.remove('mp-hostplay');
  hideRace();
}
function mpPitLog(e) {
  for (const c of e.cars) {
    const before = MP.prevPits[c.id] || 0;
    if (c.pits > before) MP.log.unshift({ t: e.time, text: `${c.code} pits for ${TYRES[c.compound].name}s`, color: TYRES[c.compound].color });
    MP.prevPits[c.id] = c.pits;
  }
  if (MP.log.length > 6) MP.log.length = 6;
}
function renderMpHostRace() {
  appEl.innerHTML = `<div class="mp-host"><canvas id="mp-canvas"></canvas>
    <div class="mp-host-btns"><button class="btn sm" data-act="mp-end">End race</button></div></div>`;
  MP.hostCanvas = $('#mp-canvas');
  let last = performance.now(), acc = 0, sendAcc = 0;
  cancelAnimationFrame(MP.raf);
  const frame = now => {
    const e = MP.engine;
    if (!e || e.done) return;
    MP.raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt; let n = 0;
    while (acc >= 1 / 120 && n < 10 && !e.done) { e.update(1 / 120); acc -= 1 / 120; n++; }
    if (n >= 10) acc = 0;
    if (e.done) return;
    sendAcc += dt;
    if (sendAcc >= 0.05) { sendAcc = 0; mpSendAll(e.snapshot()); }
    mpPitLog(e);
    drawMpOverview();
  };
  MP.raf = requestAnimationFrame(frame);
}
function mpStopHostRace() {
  cancelAnimationFrame(MP.raf);
  const playing = MP.engine && UI.engine === MP.engine;
  if (MP.engine && !MP.engine.done) MP.engine.destroy();
  MP.engine = null;
  if (playing) mpHostPlayCleanup();
}
ACTIONS['mp-end'] = () => (UI.engine && UI.engine.mpHost && UI.engine.paused && UI.engine.togglePause(), confirmModal('End the race now?', 'Everyone is classified where they are right now.', 'End race', () => { if (MP.engine && !MP.engine.done) { MP.engine.endedEarly = true; MP.engine.finish(false); } }, true));
function mpHostEnd(out) {
  const e = MP.engine;
  cancelAnimationFrame(MP.raf);
  const by = {}; e.cars.forEach(c => by[c.id] = c);
  const rows = out.results.map(r => ({ pos: r.pos, id: r.id, name: by[r.id].name, code: by[r.id].code, color: by[r.id].color, human: !!by[r.id].human, finished: r.finished, time: r.time, best: r.best, pits: by[r.id].pits, pen: !!r.pen, fail: r.fail || null }));
  MP.results = rows; MP.engine = null;
  MP.players = MP.players.filter(p => !p.gone);
  mpSendAll({ t: 'end', rows });
  const win = rows[0];
  appEl.innerHTML = `<div class="page" style="max-width:820px">
    <div class="card result-hero"><div class="muted">${esc(MP.raceCfg.track)} • ${MP.raceCfg.laps} laps</div>
      <div class="pbig" style="color:${win.color}">${esc(win.name)}</div><div style="font-size:20px">wins the race! 🏆</div></div>
    <div class="card"><table><thead><tr><th>#</th><th>Driver</th><th>Time</th><th>Best lap</th><th>Stops</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="${r.human ? 'me' : ''}"><td class="pos">${r.pos}</td><td><i class="mp-dot" style="background:${r.color}"></i>${esc(r.name)}${r.id === 'host' ? ' 🎮' : r.human ? ' 📱' : ''}${r.pen ? ' <span class="tag">MISSED STOP</span>' : ''}${r.fail ? ' <span class="tag">ENGINE</span>' : ''}</td>
        <td>${r.finished ? fmtTime(r.time) : r.fail ? 'DNF' : '—'}</td><td class="muted">${r.best && isFinite(r.best) ? fmtTime(r.best) : '—'}</td><td>${r.pits}</td></tr>`).join('')}
    </tbody></table>
    <div class="btn-row" style="margin-top:16px"><button class="btn primary big" data-act="mp-again">Back to the lobby</button><button class="btn ghost" data-act="mp-quit">Close multiplayer</button></div></div></div>`;
}
ACTIONS['mp-again'] = () => { renderMpLobby(); mpLobbyUpdate(); };

/* ----- the overview the host shows during the race ----- */
function drawMpOverview() {
  const e = MP.engine, cv = MP.hostCanvas;
  if (!e || !cv || !cv.isConnected) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const tr = e.track, narrow = W < 900;
  const panelW = narrow ? 0 : Math.min(470, W * 0.42);
  const mapH = narrow ? H * 0.55 : H;
  ctx.fillStyle = '#16241a'; ctx.fillRect(0, 0, W, H);
  // map transform
  const b = tr.bounds, pad = tr.W + tr.runoff + 60, bw = b.maxX - b.minX + pad * 2, bh = b.maxY - b.minY + pad * 2;
  const top = 64, aw = W - panelW - 24, ah = mapH - top - 70;
  const sc = Math.min(aw / bw, ah / bh);
  const ox = 12 + (aw - bw * sc) / 2 - (b.minX - pad) * sc, oy = top + (ah - bh * sc) / 2 - (b.minY - pad) * sc;
  ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#2c3a2f'; ctx.lineWidth = tr.W + tr.runoff * 1.4; ctx.stroke(tr.path);
  ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = tr.W + 10; ctx.stroke(tr.path);
  ctx.strokeStyle = e.wet > 0.3 ? '#3b4250' : '#474b54'; ctx.lineWidth = tr.W; ctx.stroke(tr.path);
  // pit lane
  if (e.pit) {
    const P = e.pit; ctx.beginPath();
    for (let d = P.entryD; d <= P.exitD; d += 10) { const q = e.lanePoint(d, e.laneLat({ lat0: 0 }, d)); d === P.entryD ? ctx.moveTo(q.x, q.y) : ctx.lineTo(q.x, q.y); }
    ctx.strokeStyle = '#5a5f6b'; ctx.lineWidth = tr.W * 0.4; ctx.stroke();
    const bx = e.lanePoint(P.boxD, P.side * P.lat);
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(bx.x, bx.y, tr.W * 0.28, 0, TAU); ctx.fill();
  }
  // start line
  const s0 = tr.pts[0];
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.lineCap = 'butt'; ctx.beginPath();
  ctx.moveTo(s0.x + s0.nx * tr.W / 2, s0.y + s0.ny * tr.W / 2); ctx.lineTo(s0.x - s0.nx * tr.W / 2, s0.y - s0.ny * tr.W / 2); ctx.stroke();
  ctx.restore();
  // cars (leader drawn last, on top)
  const order = e.order.slice();
  const R = clamp(tr.W * sc * 0.42, 7, 15);
  for (let i = order.length - 1; i >= 0; i--) {
    const c = order[i], x = ox + c.x * sc, y = oy + c.y * sc;
    ctx.beginPath(); ctx.arc(x, y, c.human ? R * 1.25 : R, 0, TAU);
    ctx.fillStyle = c.color; ctx.fill();
    ctx.lineWidth = c.human ? 3 : 1.5; ctx.strokeStyle = c.human ? '#fff' : 'rgba(0,0,0,0.6)'; ctx.stroke();
    ctx.fillStyle = '#0b0f1a'; ctx.font = `700 ${Math.round(R * 0.95)}px Rajdhani, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.pos, x, y + 1);
    if (c.human || c.pos <= 3) {
      ctx.font = `700 ${c.human ? 15 : 12}px Rajdhani, sans-serif`; ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(c.code, x, y - R * 1.4); ctx.fillStyle = '#fff'; ctx.fillText(c.code, x, y - R * 1.4);
    }
  }
  ctx.textBaseline = 'alphabetic';
  // header
  const leader = order[0], lap = clamp(Math.floor(leader.total / tr.L) + 1, 1, e.laps);
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '700 30px Rajdhani, sans-serif';
  ctx.fillText(tr.name.toUpperCase(), 18, 40);
  ctx.font = '700 22px Rajdhani, sans-serif'; ctx.fillStyle = '#ffd166';
  const head = e.state === 'countdown' ? 'GET READY' : leader.finished ? 'CHEQUERED FLAG' : 'LAP ' + lap + ' / ' + e.laps;
  ctx.fillText(head, 18 + ctx.measureText(tr.name.toUpperCase()).width * 1.35 + 30, 40);
  ctx.textAlign = 'right'; ctx.fillStyle = e.rain > 0.15 ? '#8ecae6' : '#ddd'; ctx.font = '700 18px Rajdhani, sans-serif';
  ctx.fillText((e.rain > 0.15 ? 'RAIN' : e.wet > 0.15 ? 'DRYING' : 'DRY') + '  •  TRACK ' + Math.round(e.wet * 100) + '% WET  •  ' + (e.wx.temp || 20) + '°C', W - panelW - 18, 40);
  // countdown lights
  if (e.state === 'countdown' || e.time < 1) {
    const lw = 5 * 60 + 24, lx = (W - panelW) / 2 - lw / 2, ly = mapH / 2 - 40;
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(lx, ly, lw, 80);
    for (let i = 0; i < 5; i++) { ctx.fillStyle = e.state === 'countdown' && i < e.lights ? '#ff2d2d' : '#2a2a2a'; ctx.beginPath(); ctx.arc(lx + 42 + i * 60, ly + 40, 21, 0, TAU); ctx.fill(); }
  }
  // pit log (bottom-left of the map)
  ctx.textAlign = 'left'; ctx.font = '600 16px Rajdhani, sans-serif';
  MP.log.slice(0, narrow ? 2 : 4).forEach((l, i) => { ctx.fillStyle = l.color; ctx.fillText('● ' + l.text + '   (' + fmtTime(l.t).replace(/\.\d+$/, '') + ')', 18, mapH - 18 - i * 22); });
  // timing table
  const tx = narrow ? 0 : W - panelW, ty = narrow ? mapH : 0, tw = narrow ? W : panelW, th = narrow ? H - mapH : H;
  ctx.fillStyle = 'rgba(8,12,22,0.92)'; ctx.fillRect(tx, ty, tw, th);
  const rows = order.length, rh = clamp((th - 56) / rows, 18, 46), fs = Math.round(clamp(rh * 0.5, 11, 20));
  ctx.font = `700 ${Math.round(fs * 0.8)}px Rajdhani, sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.5)';
  const col = { pos: tx + 14, name: tx + 52, gap: tx + tw * 0.47, tyre: tx + tw * 0.66, stops: tx + tw * 0.88 };
  ctx.textAlign = 'left';
  ctx.fillText('POS   DRIVER', col.pos, ty + 30); ctx.fillText('GAP', col.gap, ty + 30); ctx.fillText('TYRE', col.tyre, ty + 30); ctx.fillText('STOPS', col.stops, ty + 30);
  order.forEach((c, i) => {
    const y = ty + 46 + i * rh, mid = y + rh * 0.62;
    if (c.human) { ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(tx + 4, y, tw - 8, rh - 2); }
    ctx.fillStyle = c.color; ctx.fillRect(tx + 40, y + 4, 5, rh - 10);
    ctx.font = `700 ${fs}px Rajdhani, sans-serif`; ctx.fillStyle = '#fff';
    ctx.fillText(c.pos, col.pos, mid);
    const nm = (c.isPlayer ? '\u{1F3AE} ' : c.human ? '\u{1F4F1} ' : '') + c.name;
    ctx.fillStyle = c.human ? '#fff' : 'rgba(255,255,255,0.75)';
    let nmFs = fs; ctx.font = `700 ${nmFs}px Rajdhani, sans-serif`;
    while (nmFs > 9 && ctx.measureText(nm).width > col.gap - col.name - 8) { nmFs--; ctx.font = `700 ${nmFs}px Rajdhani, sans-serif`; }
    ctx.fillText(nm, col.name, mid);
    ctx.font = `600 ${fs}px Rajdhani, sans-serif`;
    // gap / status
    let gap, gc = 'rgba(255,255,255,0.8)';
    if (c.retired) { gap = 'OUT - ENGINE'; gc = '#ff6b6b'; }
    else if (c.pitSeq) { gap = c.pitSeq.phase === 'stop' ? (c.pitSeq.comp ? 'PIT STOP' : 'CHOOSING') : 'PIT LANE'; gc = '#ffd166'; }
    else if (c.finished) { gap = i === 0 ? 'WINNER' : 'FINISHED'; gc = '#7bd88f'; }
    else if (i === 0) gap = 'LEADER';
    else { const d = (order[0].total - c.total); gap = d > tr.L ? '+' + Math.floor(d / tr.L) + ' LAP' : '+' + (d / (c.maxSpeed * 0.78)).toFixed(1); }
    if (c.puncture && !c.pitSeq && !c.retired) { gap = 'PUNCTURE'; gc = '#ff6b6b'; }
    else if (c.pitReq && !c.pitSeq && !c.retired) { gap += ' • BOX'; gc = '#ffd166'; }
    ctx.fillStyle = gc; let gFs = fs; while (gFs > 9 && ctx.measureText(gap).width > col.tyre - col.gap - 6) { gFs--; ctx.font = `600 ${gFs}px Rajdhani, sans-serif`; }
    ctx.fillText(gap, col.gap, mid);
    // tyre
    const TC = TYRES[c.compound], r = Math.min(rh * 0.32, 11), cx = col.tyre + r, cy = mid - fs * 0.32;
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx, cy, r + 2, 0, TAU); ctx.fill();
    ctx.strokeStyle = TC.color; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, r - 1, 0, TAU); ctx.stroke();
    ctx.fillStyle = TC.color; ctx.font = `700 ${Math.round(r * 1.2)}px Rajdhani, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(TC.key, cx, cy + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const left = Math.max(0, Math.ceil((c.lifeLaps || 1) * (1 - c.wear) - 0.05));
    ctx.font = `600 ${fs}px Rajdhani, sans-serif`;
    ctx.fillStyle = c.wear > 1 ? '#ff6b6b' : left <= 1 ? '#ffd166' : 'rgba(255,255,255,0.8)';
    ctx.fillText(c.wear > 1 ? 'WORN' : left + (left === 1 ? ' lap' : ' laps'), cx + r + 8, mid);
    ctx.fillStyle = c.pits < e.stopsReq && !c.finished ? '#ff9f1c' : '#fff';
    ctx.fillText(c.pits, col.stops + 14, mid);
  });
}

    <input id="mp-join-code" class="code-input" maxlength="5" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;font-size:28px;letter-spacing:.3em;text-align:center;width:100%">
    <div class="btn-row" style="margin-top:14px"><button class="btn primary" data-act="mp-join-go">Join</button><button class="btn ghost" data-act="modal-close">Cancel</button></div>`);
  setTimeout(() => { const i = $('#mp-join-code'); if (i) i.focus(); }, 50);
};
ACTIONS['mp-join-go'] = () => {
  const c = ($('#mp-join-code').value || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(c)) { toast('The code has 5 letters and numbers', 'bad'); return; }
  closeModal(); renderMpPhone(c);
};
function mpSavedName() { try { return localStorage.getItem('k2c.mpname') || (S && S.driver ? S.driver.name : ''); } catch (e) { return ''; } }
function renderMpPhone(code) {
  MP.role = 'phone'; MP.code = code;
  hideRace();
  appEl.innerHTML = `<div class="page" style="max-width:520px">
    <div class="card"><div class="round">MULTIPLAYER • RACE ${esc(code)}</div>
      <h2>Join the race</h2>
      <div class="field"><label>Your name</label><input id="mp-name" maxlength="16" value="${esc(mpSavedName())}" placeholder="Your name"></div>
      <button class="btn primary big" style="width:100%" data-act="mp-phone-join">Join</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" data-act="mp-phone-quit">Cancel</button>
    </div></div>`;
}
ACTIONS['mp-phone-join'] = () => {
  const name = ($('#mp-name').value || '').trim().slice(0, 16);
  if (!name) { toast('Type your name first', 'bad'); return; }
  try { localStorage.setItem('k2c.mpname', name); } catch (e) { }
  MP.myName = name;
  enableTilt(true); // this tap is the iPhone's chance to ask for motion access
  mpConnectPhone();
  renderMpWait('Connecting…');
};
async function mpConnectPhone() {
  try { await loadScriptOnce(PEERJS_URL); } catch (e) { renderMpWait('Could not load the connection library. Check your internet.'); return; }
  if (MP.peer) { try { MP.peer.destroy(); } catch (e) { } }
  const peer = new Peer(); MP.peer = peer;
  peer.on('open', () => {
    const conn = peer.connect(mpPeerId(MP.code), { serialization: 'json', reliable: false });
    MP.conn = conn;
    conn.on('open', () => { conn.send({ t: 'join', name: MP.myName }); if (navigator.vibrate) navigator.vibrate(40); });
    conn.on('data', mpPhoneData);
    conn.on('close', () => { if (MP.role !== 'phone') return; mpPhoneStopRace(); renderMpWait('Disconnected from the host.', true); });
  });
  peer.on('error', err => { if (MP.role !== 'phone') return; renderMpWait(err && err.type === 'peer-unavailable' ? 'No race with code ' + MP.code + '. Check the code on the host screen.' : 'Connection problem: ' + (err && err.type || 'unknown'), true); });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) { } });
}
function renderMpWait(msg, retry) {
  if (UI.engine) return;
  const L = MP.lobby;
  appEl.innerHTML = `<div class="page" style="max-width:560px"><div class="card">
    <div class="round">MULTIPLAYER • RACE ${esc(MP.code || '')}</div>
    <h2>${L ? esc(L.track) : 'Multiplayer'}</h2>
    <p class="${retry ? 'bad' : 'muted'}" id="mp-wait-msg">${esc(msg || (L ? 'You are in! Waiting for the host to start the race…' : 'Connecting…'))}</p>
    ${L ? `<p class="muted small">${esc(TIERS[L.tier].name)} • ${L.laps} laps • ${stopsText(L.stops || 1)}</p>
      <h3>Starting tyre</h3>
      <div class="tyre-pick">${['S', 'M', 'H', 'W'].map(k => `<button class="tyre-opt ${MP.myTyre === k ? 'on' : ''}" data-act="mp-tyre" data-arg="${k}">
        <span class="tyre-badge" style="border-color:${TYRES[k].color};color:${TYRES[k].color}">${k}</span><b>${TYRES[k].name}</b>
        <small>${TYRES[k].wet ? 'For rain' : 'Lasts ' + L.tl[k]}</small></button>`).join('')}</div>
      <h3>Drivers (${L.players.length}/${L.max})</h3>
      <div class="mp-players">${L.players.map(p => `<div class="mp-player"><i style="background:${p.color}"></i><b>${esc(p.name)}${p.name === MP.myName ? ' (you)' : ''}</b><span class="tyre-badge sm" style="border-color:${TYRES[p.tyre].color};color:${TYRES[p.tyre].color}">${p.tyre}</span></div>`).join('')}</div>
      <p class="muted small">Turn your phone sideways when the race starts. Tilt to steer, thumb slider for gas and brake, PIT to box.</p>` : ''}
    ${retry ? `<button class="btn primary" data-act="mp-phone-retry">Try again</button>` : ''}
    <button class="btn ghost" data-act="mp-phone-quit" style="margin-top:8px">Leave</button>
  </div></div>`;
}
ACTIONS['mp-tyre'] = k => { MP.myTyre = k; mpSend({ t: 'tyre', k }); renderMpWait(); };
ACTIONS['mp-phone-retry'] = () => { mpConnectPhone(); renderMpWait('Connecting…'); };
ACTIONS['mp-phone-quit'] = () => {
  mpSend({ t: 'leave' });
  mpPhoneStopRace();
  setTimeout(() => { try { if (MP.conn) MP.conn.close(); if (MP.peer) MP.peer.destroy(); } catch (e) { } MP.conn = MP.peer = null; }, 150);
  MP.role = null; MP.lobby = null;
  document.documentElement.classList.remove('mp-client');
  history.replaceState(null, '', location.pathname); renderTitle();
};
function mpPhoneData(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 's') { if (UI.engine && UI.engine.client) UI.engine.applySnapshot(m); return; }
  if (m.t === 'lobby') { MP.lobby = m; if (!UI.engine && !MP.results) renderMpWait(); return; }
  if (m.t === 'you') { MP.myColor = m.color; MP.myTyre = m.tyre; return; }
  if (m.t === 'full') { mpPhoneStopRace(); MP.role = 'phone'; renderMpWait(m.why || 'Could not join.', true); return; }
  if (m.t === 'start') { MP.results = null; mpPhoneRace(m.cfg); return; }
  if (m.t === 'ev') {
    const e = UI.engine; if (!e) return;
    if (m.t2 === 'pit') {
      if (m.cmd === 'choose') { mpPitLabels(); e.flash('PIT LANE', '#ffd166', 1.5, 34); e.o.onPit('choose'); }
      else if (m.cmd === 'chosen') { e.o.onPit(null); if (m.k) e.flash(TYRES[m.k].name.toUpperCase() + 'S ON', TYRES[m.k].color, 1.2, 30); }
      else if (m.cmd === 'in') e.flash('PIT LANE', '#ffd166', 1.5, 34);
      e.buzz(60);
    } else if (m.t2 === 'fail') {
      e.failMsg(m.part, m.canPit);
    } else if (m.t2 === 'box') {
      e.flash(m.on ? 'BOX THIS LAP - PICK TYRES IN THE PIT' : 'STAYING OUT', m.on ? '#ffd166' : '#ffffff', 2, 26);
      e.o.onPit(m.on ? 'on' : 'off');
    }
    return;
  }
  if (m.t === 'end') { MP.results = m.rows; mpPhoneStopRace(); renderMpPhoneResults(); }
}
function mpPitLabels() {
  const e = UI.engine; if (!e) return;
  const left = Math.max(1, Math.ceil(e.laps - e.player.total / e.track.L));
  document.querySelectorAll('[data-act="pit-req"]').forEach(b => {
    const k = b.dataset.arg, n = Math.floor(tyreLaps(k, e.track, e.tier));
    b.innerHTML = k + ' ' + TYRES[k].name + '<small style="display:block;opacity:.75;font-size:.75em">' + (TYRES[k].wet ? 'rain tyre' : tyreKm(k, e.tier) + ' km ≈ ' + n + ' laps' + (n >= left ? ' ✔ to the end' : '')) + '</small>';
  });
}
function mpPhoneRace(cfg) {
  mpPhoneStopRace();
  const T = TIERS[cfg.tier], track = buildTrack(cfg.track, T);
  closeModal(); appEl.innerHTML = '';
  document.documentElement.classList.add('mp-client');
  $('#race-screen').classList.remove('hidden', 'race-quali');
  $('#pause-menu').classList.add('hidden'); $('#pit-menu').classList.add('hidden');
  startTilt(); phoneRaceMode();
  const hand = applyHand();
  if (UI.resetPedal) UI.resetPedal();
  const racers = cfg.racers.map(r => Object.assign({}, r, { isPlayer: r.id === cfg.you, human: false, perf: 1 }));
  UI.engine = new RaceEngine($('#race-canvas'), {
    tier: T, track, laps: cfg.laps, racers, items: false, ers: false, weather: cfg.weather, client: true, send: mpSend, stops: raceStops(cfg.track),
    onPit: cmd => {
      const pm = $('#pit-menu');
      if (cmd === 'choose') { pm.classList.remove('hidden'); pm.classList.add('choosing'); }
      else if (cmd === 'on' || cmd === 'off') document.querySelectorAll('[data-act="pit-open"]').forEach(b => b.classList.toggle('on', cmd === 'on'));
      else { pm.classList.add('hidden'); pm.classList.remove('choosing'); document.querySelectorAll('[data-act="pit-open"]').forEach(b => b.classList.remove('on')); }
    },
    hand: IS_TOUCH ? hand : 'right', haptics: IS_TOUCH, difficulty: 'normal', sound: !S || S.settings.sound !== false, tilt: TILT,
    view: getViewPref(), onView: v => { try { localStorage.setItem('k2c.view', v); } catch (e) { } },
    onPause: p => $('#pause-menu').classList.toggle('hidden', !p),
    onEnd: () => { ACTIONS['mp-phone-quit'](); }
  });
  clearInterval(MP.sendT);
  MP.sendT = setInterval(() => { const e = UI.engine; if (e && e.client && !e.done) mpSend(e.clientInput()); }, 33);
}
function mpPhoneStopRace() {
  clearInterval(MP.sendT);
  if (UI.engine && UI.engine.client) { UI.engine.destroy(); UI.engine = null; hideRace(); }
  document.documentElement.classList.remove('mp-client');
}
function renderMpPhoneResults() {
  const rows = MP.results || [], me = rows.find(r => r.name === MP.myName && r.human);
  appEl.innerHTML = `<div class="page" style="max-width:560px">
    <div class="card result-hero"><div class="muted">RACE RESULT</div>
      <div class="pbig" style="color:${me && me.pos === 1 ? 'var(--accent2)' : '#fff'}">${me ? 'P' + me.pos : '—'}</div>
      <div>${me && me.pos === 1 ? 'You won! 🏆' : rows[0] ? esc(rows[0].name) + ' won the race' : ''}</div></div>
    <div class="card"><table><tbody>${rows.map(r => `<tr class="${me && r === me ? 'me' : ''}"><td class="pos">${r.pos}</td><td><i class="mp-dot" style="background:${r.color}"></i>${esc(r.name)}${r.human ? ' 📱' : ''}${r.pen ? ' <span class="tag">MISSED STOP</span>' : ''}</td><td class="muted">${r.best && isFinite(r.best) ? fmtTime(r.best) : '—'}</td></tr>`).join('')}</tbody></table>
    <p class="muted small" style="margin-top:12px">Stay here: when the host starts the next race, it starts on this phone too.</p>
    <button class="btn ghost" data-act="mp-phone-quit">Leave</button></div></div>`;
}

/* ---------------- boot: phone opened from the QR code ---------------- */
{
  const code = new URLSearchParams(location.search).get('mp');
  if (code && /^[A-Za-z0-9]{5}$/.test(code)) renderMpPhone(code.toUpperCase());
}

</script>
