const TYRES = {
  S: { key: 'S', name: 'Soft', color: '#ff3b3b', grip: 1.12, life: 0.5, warm: 0.13, desc: 'Most grip, warms up fast, but worn out about halfway.' },
  M: { key: 'M', name: 'Medium', color: '#ffd60a', grip: 1.0, life: 0.85, warm: 0.085, desc: 'Balanced. Starts to fade near the end of the race.' },
  H: { key: 'H', name: 'Hard', color: '#f1f1f1', grip: 0.93, life: 1.4, warm: 0.05, desc: 'Least grip and slow to warm up, but lasts the whole race.' },
  W: { key: 'W', name: 'Wet', color: '#3a86ff', grip: 0.9, life: 0.45, warm: 0.15, wet: true, desc: 'For rain. Grips on a wet track, but wears out fast once it dries.' }
};
// How often AI drivers make mistakes (per second spent in a corner, before modifiers)
const AI_MISTAKE_RATE = 0.006;
// Grip multiplier a compound gets from the track wetness (0 = dry, 1 = soaked)
function wetGrip(TC, w) { return TC.wet ? 0.93 + 0.17 * w : 1 - 0.42 * w; }

/* Weather for a race weekend: rain intensity over race distance + a steady wind. */
function genWeather(seed) {
  const rng = mulberry32(seed >>> 0);
  const x = rng();
  let start = 0, to = 0, at = 1;
  if (x < 0.55) { start = 0; to = 0; }                                   // dry
  else if (x < 0.72) { start = 0.6 + rng() * 0.4; to = rng() < 0.5 ? 0 : start; at = 0.4 + rng() * 0.3; } // wet start, may dry
  else { start = 0; to = 0.5 + rng() * 0.5; at = 0.25 + rng() * 0.35; } // rain arrives mid-race
  return { start, to, at, windDir: rng() * TAU, wind: 0.3 + rng() * 0.7 };
}
function weatherText(wx) {
  if (wx.start > 0 && wx.to > 0) return 'Rain all race';
  if (wx.start > 0) return 'Wet start, drying later';
  if (wx.to > 0) return 'Dry start, rain expected around ' + Math.round(wx.at * 100) + '% distance';
  return 'Dry';
}

/* ---------- tiny synth ---------- */
class Sfx {
  constructor(enabled) {
    this.enabled = enabled;
    this.ctx = null;
  }
  init() {
    if (!this.enabled || this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
      this.eng = this.ctx.createOscillator(); this.eng.type = 'sawtooth';
      this.eng2 = this.ctx.createOscillator(); this.eng2.type = 'square';
      this.engFilter = this.ctx.createBiquadFilter(); this.engFilter.type = 'lowpass'; this.engFilter.frequency.value = 700;
      this.engGain = this.ctx.createGain(); this.engGain.gain.value = 0;
      this.eng.connect(this.engFilter); this.eng2.connect(this.engFilter);
      this.engFilter.connect(this.engGain); this.engGain.connect(this.master);
      this.eng.start(); this.eng2.start();
    } catch (e) { this.ctx = null; }
  }
  engine(speedFrac, on) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const f = 55 + speedFrac * 170;
    this.eng.frequency.setTargetAtTime(f, t, 0.05);
    this.eng2.frequency.setTargetAtTime(f * 0.5, t, 0.05);
    this.engGain.gain.setTargetAtTime(on ? 0.05 + speedFrac * 0.05 : 0, t, 0.1);
  }
  beep(freq, dur, type = 'square', vol = 0.15) {
    if (!this.ctx) return;
    try {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.master);
      o.start(); o.stop(this.ctx.currentTime + dur);
    } catch (e) { }
  }
  whoosh() { this.beep(220, 0.35, 'sawtooth', 0.12); setTimeout(() => this.beep(440, 0.25, 'sawtooth', 0.08), 60); }
  hit() { this.beep(90, 0.3, 'square', 0.25); }
  pickup() { this.beep(880, 0.08, 'triangle', 0.15); setTimeout(() => this.beep(1320, 0.1, 'triangle', 0.12), 70); }
  stop() { if (this.ctx) { try { this.ctx.close(); } catch (e) { } this.ctx = null; } }
}

class RaceEngine {
  /* opts: { tier, track, laps, racers, items, ers, difficulty, sound, onEnd } */
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.o = opts;
    this.tier = opts.tier;
    this.track = opts.track;
    this.laps = opts.laps;
    this.isKart = this.tier.vehicle === 'kart';
    // Items, drift boosts and ERS are switched off: pure racing (slipstream + rocket starts remain).
    this.itemsOn = false;
    this.ersOn = false;
    this.driftOn = false;
    this.sfx = new Sfx(opts.sound);
    this.keys = {};
    this.touch = {};
    this.tilt = opts.tilt || null; // shared { on, steer } object updated by the UI
    this.time = 0;          // race clock (after green)
    this.clock = 0;         // total time since start
    this.state = 'countdown';
    this.lights = 0;
    this.goAt = 3.2 + Math.random() * 0.7;
    this.paused = false;
    this.particles = [];
    this.skids = [];
    this.hazards = [];
    this.shots = [];
    this.flashes = [];
    this.stormFlash = 0;
    this.shake = 0;
    this.endTimer = -1;
    this.done = false;
    this.messages = [];
    this.cam = { x: 0, y: 0, z: 1 };
    this.diffK = { easy: 0.8, normal: 0.88, hard: 0.95 }[opts.difficulty] || 0.88;
    this.cars = opts.racers.map((r, i) => this.makeCar(r, i));
    this.player = this.cars.find(c => c.isPlayer);
    this.computeOrder();
    this.boxes = [];
    if (this.itemsOn) {
      for (const idx of this.track.boxRows) {
        const p = this.track.pts[idx];
        for (const f of [-0.32, -0.11, 0.11, 0.32]) {
          this.boxes.push({ x: p.x + p.nx * f * this.track.W, y: p.y + p.ny * f * this.track.W, active: true, t: 0 });
        }
      }
    }
    this.grassPattern = this.makeGrass();
    this.cam.x = this.player.x; this.cam.y = this.player.y;
    this.cam.z = this.targetZoom(0);
    this.throttlePressAt = -10;
    this.steerVis = 0;
    this.viewMode = opts.view === 'top' ? 'top' : 'cockpit';
    this.v3 = null;
    this.quali = !!opts.qualifying;
    this.wx = opts.weather || { start: 0, to: 0, at: 1, windDir: 0, wind: 0 };
    this.pit = this.setupPitLane();    // null if there is no room for one
    this.rain = this.wx.start;          // current rain intensity
    this.wet = this.wx.start;           // current track wetness
    this.headless = !!opts.headless; // used to simulate AI qualifying laps instantly
    if (!this.headless) this.bindInput();
    this.resize();
    if (!this.headless) this.setView(this.viewMode);
    this.last = performance.now();
    this.acc = 0;
    this.loop = this.loop.bind(this);
    if (!this.headless) this.raf = requestAnimationFrame(this.loop);
  }

  makeGrass() {
    const c = document.createElement('canvas');
    c.width = 160; c.height = 160;
    const g = c.getContext('2d');
    const dark = this.isKart ? '#3f7a3a' : '#3b6f3f';
    const light = this.isKart ? '#468541' : '#427a45';
    g.fillStyle = dark; g.fillRect(0, 0, 160, 160);
    g.fillStyle = light; g.fillRect(0, 0, 160, 80);
    g.fillStyle = 'rgba(0,0,0,0.05)';
    for (let i = 0; i < 40; i++) g.fillRect(Math.random() * 160, Math.random() * 160, 2, 2);
    return this.ctx.createPattern(c, 'repeat');
  }

  makeCar(r, slot) {
    const T = this.tier, tr = this.track, s = r.stats, m = r.machine;
    const perf = r.perf || 1;
    const kart = this.isKart;
    const row = Math.floor(slot / 2), side = slot % 2 ? -1 : 1;
    const back = (kart ? 34 : 46) + row * (kart ? 40 : 56) + (slot % 2) * (kart ? 14 : 20);
    let idx = tr.n - Math.round(back / tr.spacing);
    idx = (idx + tr.n) % tr.n;
    const p = tr.pts[idx];
    const lat = side * tr.W * 0.22;
    const c = Object.assign({}, r, {
      maxSpeed: T.baseSpeed * (0.86 + 0.12 * s.spd / 100 + 0.07 * m.eng) * perf,
      accel: T.baseAcc * (0.75 + 0.35 * s.acc / 100 + 0.12 * m.chas) * perf,
      turn: T.baseTurn * (0.86 + 0.16 * s.hnd / 100 + 0.06 * m.tire),
      grip: 5.5 + 4 * s.hnd / 100 + 1.5 * m.tire,
      brake: T.baseAcc * 1.7,
      len: kart ? 28 : 40, wid: kart ? 18 : 18, rad: kart ? 13 : 15,
      x: p.x + p.nx * lat, y: p.y + p.ny * lat, h: p.a, vx: 0, vy: 0,
      idx, s: idx * tr.spacing, total: idx * tr.spacing - tr.L, maxLap: -1, lapStart: 0, lapTimes: [], best: Infinity,
      finished: false, finishTime: 0, pos: slot + 1, grid: slot + 1,
      item: null, itemRoll: 0, rollItem: null, boost: 0, shield: 0, spin: 0, spinDir: 1, slow: 0,
      drift: false, driftDir: 0, driftCharge: 0, ers: 1, ersActive: false, slip: 0, offroad: false, wear: 0,
      lat: 0, laneOff: (Math.random() - 0.5) * tr.W * 0.24, lanePref: (Math.random() - 0.5) * tr.W * 0.24,
      mistake: 0, mistakeSteer: 0, recover: 0, recoverDir: 1, itemHold: 0, startDelay: Math.random() < 0.08 ? 0.9 + Math.random() * 0.8 : 0.08 + Math.random() * 0.35, stuck: 0,
      aiK: clamp(this.diffK + (s.rc - 60) / 100 * 0.04 + (s.foc - 60) / 100 * 0.02, 0.7, 0.985),
      rubber: 1, prevItemKey: false, lastHitBy: null, wrongWay: 0, auto: false, bog: 0,
      compound: TYRES[r.compound] ? r.compound : 'M', temp: 0.3, tg: 0.85, tyreWarned: false,
      stint: 0, pitReq: null, pitTimer: 0, pits: 0, pitThresh: 0.4 + Math.random() * 0.3
    });
    return c;
  }

  /* ---------- input ---------- */
  bindInput() {
    this.onKeyDown = e => {
      const k = e.code;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(k)) e.preventDefault();
      if (!this.keys[k] && (k === 'ArrowUp' || k === 'KeyW')) this.throttlePressAt = this.clock;
      this.keys[k] = true;
      this.sfx.init();
      if ((k === 'Escape' || k === 'KeyP') && !this.done) this.togglePause();
      if (k === 'KeyR' && this.state === 'race' && !this.paused) this.resetToTrack(this.player);
      if (k === 'KeyC' && !this.paused) this.toggleView();
      if (k === 'KeyB' && !this.paused) this.requestPit('box');
      if (/^Digit[1-4]$/.test(k) && this.player && this.player.pitSeq) this.choosePitTyre('SMHW'[+k.slice(5) - 1]);
    };
    this.onKeyUp = e => { this.keys[e.code] = false; };
    this.onResize = () => this.resize();
    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('keyup', this.onKeyUp);
    window.addEventListener('resize', this.onResize);
  }
  setTouch(key, on) {
    if (key === 'thr' && on && !this.touch.thr) this.throttlePressAt = this.clock;
    this.touch[key] = on;
    this.sfx.init();
  }
  playerInput() {
    const k = this.keys, t = this.touch;
    let steer = 0;
    if (k.ArrowLeft || k.KeyA || t.left) steer -= 1;
    if (k.ArrowRight || k.KeyD || t.right) steer += 1;
    if (steer === 0 && this.tilt && this.tilt.on) steer = this.tilt.steer; // analog phone tilt
    return {
      thr: !!(k.ArrowUp || k.KeyW || t.thr),
      brk: !!(k.ArrowDown || k.KeyS || t.brk),
      steer,
      drift: !!(k.ShiftLeft || k.ShiftRight || k.KeyX || t.drift),
      item: !!(k.Space || k.KeyE || t.item)
    };
  }
  togglePause() {
    this.paused = !this.paused;
    if (this.o.onPause) this.o.onPause(this.paused);
    this.sfx.engine(0, false);
    if (!this.paused) this.last = performance.now();
  }
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.dpr = dpr;
    this.w = this.canvas.clientWidth; this.h = this.canvas.clientHeight;
    this.canvas.width = this.w * dpr; this.canvas.height = this.h * dpr;
    if (this.v3) this.v3.resize();
  }
  setView(mode) {
    this.viewMode = mode;
    if (mode === 'cockpit' && !this.v3 && typeof THREE !== 'undefined' && typeof document !== 'undefined' && document.body) {
      try { this.v3 = new View3D(this); } catch (err) { console.warn('3D view unavailable', err); this.v3 = null; this.viewMode = 'top'; }
    } else if (mode === 'cockpit' && !this.v3) this.viewMode = 'top';
    if (this.v3) this.v3.setVisible(this.viewMode === 'cockpit');
  }
  toggleView() {
    this.setView(this.viewMode === 'cockpit' ? 'top' : 'cockpit');
    if (this.o.onView) this.o.onView(this.viewMode);
  }
  destroy() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('keyup', this.onKeyUp);
    window.removeEventListener('resize', this.onResize);
    if (this.v3) { this.v3.destroy(); this.v3 = null; }
    this.sfx.stop();
    this.done = true;
  }

  /* ---------- main loop ---------- */
  loop(now) {
    if (this.done) return;
    this.raf = requestAnimationFrame(this.loop);
    let dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    if (!this.paused) {
      this.acc += dt;
      const step = 1 / 120;
      let n = 0;
      while (this.acc >= step && n < 10 && !this.done) { this.update(step); this.acc -= step; n++; }
      if (n >= 10) this.acc = 0;
    }
    if (!this.done) this.render();
  }

  update(dt) {
    this.clock += dt;
    const tr = this.track;
    if (this.state === 'countdown') {
      this.lights = Math.min(5, Math.floor(this.clock / 0.6));
      if (this.lights !== this.prevLights) { if (this.lights > 0) this.sfx.beep(440, 0.15); this.prevLights = this.lights; }
      if (this.clock >= this.goAt) {
        this.state = 'race';
        this.sfx.beep(880, 0.4);
        this.flash('GO!', '#7CFF6B', 1.2, 64);
        this.flash('COLD TYRES - build up temperature', '#4cc9f0', 3, 24);
        // rocket start
        const pi = this.playerInput();
        const since = this.clock - this.throttlePressAt;
        if (pi.thr && since < 0.45) { this.player.boost = 1.1; this.flash('ROCKET START!', '#ffd166', 1.5); this.sfx.whoosh(); }
        else if (pi.thr && since > 2.2) { this.player.bog = 0.6; this.flash('Bogged down…', '#ff6b6b', 1.2); }
      }
    } else if (this.state === 'race') {
      this.time += dt;
    }
    if (this.state === 'race' && this.time < 0.25 && this.throttlePressAt > this.goAt && this.throttlePressAt - this.goAt < 0.12 && !this.player.rocketChecked) {
      this.player.rocketChecked = true; this.player.boost = 0.9; this.flash('ROCKET START!', '#ffd166', 1.5); this.sfx.whoosh();
    }

    const racing = this.state === 'race';
    // weather: rain intensity follows the leader's race distance; the track soaks / dries with a lag
    if (racing && !this.quali) {
      const lead = this.order && this.order[0] ? clamp(this.order[0].total / (this.track.L * this.laps), 0, 1) : 0;
      const target = lead < this.wx.at ? this.wx.start : this.wx.to;
      this.rain += (target - this.rain) * Math.min(1, dt * 0.15);
      const wetRate = this.rain > this.wet ? 0.035 : 0.012;
      this.wet = clamp(this.wet + Math.sign(this.rain - this.wet) * Math.min(Math.abs(this.rain - this.wet), wetRate * dt), 0, 1);
      if (!this.rainAnnounced && this.rain > 0.25 && this.wx.start === 0) { this.rainAnnounced = true; this.flash('RAIN IS FALLING - consider wet tyres', '#8ecae6', 3, 26); }
    }
    // rubber banding & order
    this.computeOrder();
    for (const c of this.cars) {
      let inp;
      if (!racing) { c.vx = 0; c.vy = 0; continue; } // cars sit still on the grid until the lights go out
      if (c.pitSeq) { this.updatePitSeq(c, dt); continue; }
      if (c.pitReq && this.pit && !this.quali && c.maxLap >= 0 && c.maxLap < this.laps - 1) {
        const d = this.lineDist(c.s);
        if (d > this.pit.entryD && d < this.pit.entryD + 60) { this.startPitSeq(c); continue; }
      }
      if (c.pitTimer > 0) { // stationary in the pit box (fallback when a track has no pit lane)
        c.pitTimer -= dt; c.vx = 0; c.vy = 0;
        if (c.pitTimer <= 0) { c.inPit = false; if (c.isPlayer) this.flash('GO GO GO!', '#7CFF6B', 1, 30); }
        continue;
      }
      if (!c.isPlayer || c.auto) this.aiPitPlan(c);
      if (c.isPlayer && !c.auto) inp = this.playerInput();
      else inp = this.aiInput(c, dt);
      if (c.isPlayer) this.steerVis += ((inp.steer || 0) - this.steerVis) * Math.min(1, dt * 14);
      if (!c.isPlayer && racing && this.time < c.startDelay) inp.thr = false;
      if (c.bog > 0) { c.bog -= dt; inp.thr = false; }
      if (!c.isPlayer) this.updateRubber(c, dt);
      this.updateCar(c, dt, inp);
    }
    this.collideCars();
    this.updateSlipstream(dt);
    if (this.itemsOn) this.updateItems(dt);
    this.updateParticles(dt);

    // end of race
    if (this.player.finished) {
      if (this.endTimer < 0) this.endTimer = 0;
      this.endTimer += dt;
      if (this.quali ? this.endTimer > 2.5 : (this.endTimer > 7 || this.cars.every(c => c.finished))) this.finish(false);
    }
    // camera
    const p = this.player;
    const lead = 0.35;
    const tx = p.x + p.vx * lead, ty = p.y + p.vy * lead;
    this.cam.x += (tx - this.cam.x) * Math.min(1, dt * 6);
    this.cam.y += (ty - this.cam.y) * Math.min(1, dt * 6);
    const sp = Math.hypot(p.vx, p.vy);
    this.cam.z += (this.targetZoom(sp) - this.cam.z) * Math.min(1, dt * 2);
    this.shake = Math.max(0, this.shake - dt * 3);
    this.stormFlash = Math.max(0, this.stormFlash - dt * 2);
    for (const f of this.flashes) f.t -= dt;
    this.flashes = this.flashes.filter(f => f.t > 0);
    // engine sound
    this.sfx.engine(clamp(sp / (this.tier.baseSpeed * 1.1), 0, 1.2), !this.paused);
  }

  targetZoom(speed) {
    const base = Math.min(this.w || 1000, (this.h || 700) * 1.35) / this.tier.view;
    return base * (1 - 0.18 * clamp(speed / this.tier.baseSpeed, 0, 1.2));
  }

  flash(text, color = '#fff', t = 1.5, size = 40) { this.flashes.push({ text, color, t, max: t, size }); }

  computeOrder() {
    const ord = this.cars.slice().sort((a, b) => {
      if (a.finished && b.finished) return a.finishTime - b.finishTime;
      if (a.finished) return -1;
      if (b.finished) return 1;
      return b.total - a.total;
    });
    ord.forEach((c, i) => c.pos = i + 1);
    this.order = ord;
  }

  updateRubber(c, dt) {
    const gap = this.player.total - c.total; // positive: AI behind
    let target = 1;
    const strength = { easy: 1.3, normal: 1, hard: 0.6 }[this.o.difficulty] || 1;
    if (gap > 500) target = 1 + 0.035 * strength;
    else if (gap < -800) target = 1 - 0.03 * strength;
    c.rubber += (target - c.rubber) * Math.min(1, dt * 0.5);
  }

  /* ---------- physics ---------- */
  updateCar(c, dt, inp) {
    const tr = this.track, T = this.tier;
    const raceFrac = clamp(c.total / (tr.L * this.laps), 0, 1);
    const fade = (1 - c.stats.fit / 100) * (this.isKart ? 0.025 : 0.05) * raceFrac;
    let cs = Math.cos(c.h), sn = Math.sin(c.h);
    let vF = c.vx * cs + c.vy * sn;

    // tyres: compound grip x temperature x wear
    const TC = TYRES[c.compound];
    const spdF = clamp(Math.hypot(c.vx, c.vy) / T.baseSpeed, 0, 1.3);
    const tTarget = 0.22 + 0.55 * spdF + 0.5 * Math.abs(inp.steer || 0) * spdF + (inp.brk && spdF > 0.3 ? 0.2 : 0);
    c.temp += (tTarget - c.temp) * TC.warm * dt * (tTarget > c.temp ? 1 : 0.3);
    const life = TC.wet ? TC.life + 1.1 * this.wet : TC.life;
    c.wear = this.quali ? 0 : clamp(((c.total - c.stint) / (tr.L * this.laps)) / life, 0, 3);
    const tempGrip = 0.75 + 0.25 * clamp((c.temp - 0.3) / 0.45, 0, 1);
    const wearGrip = 1 - 0.06 * Math.min(c.wear, 1) - 0.35 * clamp(c.wear - 1, 0, 1);
    c.tg = TC.grip * tempGrip * wearGrip * wetGrip(TC, this.wet);
    if (c.isPlayer && !c.tyreWarned && c.wear > 1) { c.tyreWarned = true; this.flash('TYRES FADING', '#ff9f1c', 2, 34); }

    let maxS = c.maxSpeed * (1 - fade) * c.rubber * (0.9 + 0.1 * c.tg);
    // wind: a tailwind helps on the stretches where it is behind you, a headwind slows you
    c.windFx = this.wx.wind * Math.cos(c.h - this.wx.windDir);
    maxS *= 1 + 0.05 * c.windFx;
    maxS *= 1 - 0.07 * this.wet; // spray, standing water
    if (c.offroad) maxS *= 0.5 + 0.12 * c.stats.foc / 100;
    if (c.boost > 0) maxS *= 1.32;
    if (c.ersActive) maxS *= 1.1;
    if (c.slip > 0.35) maxS *= 1.04 + 0.04 * c.stats.rc / 100;
    if (c.slow > 0) maxS *= 0.62;

    // ERS
    c.ersActive = false;
    if (this.ersOn && !this.itemsOn) {
      if (inp.item && c.ers > 0.02 && c.spin <= 0) { c.ersActive = true; c.ers -= 0.2 * dt; }
      else c.ers += (inp.brk ? 0.16 : 0.025) * dt;
      c.ers = clamp(c.ers, 0, 1);
    }

    // drift (only player — AI doesn't drift)
    if (this.driftOn && c.isPlayer && !c.auto) {
      if (!c.drift && inp.drift && Math.abs(inp.steer) > 0.3 && vF > 130 && !c.offroad && c.spin <= 0) {
        c.drift = true; c.driftDir = Math.sign(inp.steer); c.driftCharge = 0;
      }
      if (c.drift) {
        if (!inp.drift || vF < 90 || c.spin > 0) {
          const lvl = c.driftCharge > 2.4 ? 3 : c.driftCharge > 1.5 ? 2 : c.driftCharge > 0.75 ? 1 : 0;
          if (lvl && !c.offroad && c.spin <= 0) {
            c.boost = Math.max(c.boost, [0, 0.45, 0.85, 1.3][lvl]);
            this.sfx.whoosh();
            if (lvl === 3) this.flash('ULTRA BOOST', '#d38cff', 0.8, 30);
          }
          c.drift = false;
        } else {
          if (c.offroad) c.driftCharge = Math.max(0, c.driftCharge - dt * 2);
          else c.driftCharge += dt * (0.7 + 0.7 * Math.max(0, inp.steer * c.driftDir));
        }
      }
    }

    // steering
    const spd = Math.abs(vF);
    if (c.spin > 0) {
      c.spin -= dt;
      c.h += c.spinDir * 9 * dt;
      inp = { thr: false, brk: false, steer: 0 };
    } else {
      let omega = c.turn * Math.min(1, spd / 50) * Math.max(0.35, 1 - 0.45 * spd / T.baseSpeed);
      omega *= c.tg;
      let steer = inp.steer;
      if (c.drift) { steer = clamp(c.driftDir * 0.6 + inp.steer * 0.55, -1.25, 1.25); omega *= 1.12; }
      c.h += steer * omega * dt * (vF < -5 ? -1 : 1);
      if (inp.pivot) c.h += clamp(inp.pivot, -3.2 * dt, 3.2 * dt);
    }

    cs = Math.cos(c.h); sn = Math.sin(c.h);
    vF = c.vx * cs + c.vy * sn;
    let vL = -c.vx * sn + c.vy * cs;

    // longitudinal
    let acc = c.accel * (c.boost > 0 ? 1.7 : 1) * (c.ersActive ? 1.25 : 1) * (0.8 + 0.2 * c.tg);
    if (inp.thr) {
      if (vF < maxS) {
        const f = Math.max(0, vF) / maxS;
        vF += acc * (1 - f * f) * dt;
      }
    } else if (inp.brk) {
      if (vF > 15) vF -= c.brake * dt;
      else vF = Math.max(vF - c.accel * 0.5 * dt, -80);
    } else {
      vF -= Math.sign(vF) * Math.min(Math.abs(vF), 80 * dt);
    }
    if (vF > maxS) vF -= (vF - maxS) * (c.offroad ? 3 : 1.4) * dt;

    // lateral grip
    let g = c.drift ? 2.3 : c.grip;
    if (c.spin > 0) g = 1.5;
    if (c.offroad) g *= 0.7;
    g *= c.tg;
    vL *= Math.exp(-g * dt);

    c.vx = cs * vF - sn * vL;
    c.vy = sn * vF + cs * vL;
    c.x += c.vx * dt;
    c.y += c.vy * dt;

    c.boost = Math.max(0, c.boost - dt);
    c.shield = Math.max(0, c.shield - dt);
    c.slow = Math.max(0, c.slow - dt);

    // effects
    if (c.boost > 0 && Math.random() < 0.7) this.addParticle(c.x - cs * c.len * 0.6, c.y - sn * c.len * 0.6, -cs * 80 + (Math.random() - 0.5) * 60, -sn * 80 + (Math.random() - 0.5) * 60, 0.3, Math.random() < 0.5 ? '#ffb703' : '#fb5607', 5);
    if (c.drift) {
      const lvl = c.driftCharge > 2.4 ? 3 : c.driftCharge > 1.5 ? 2 : c.driftCharge > 0.75 ? 1 : 0;
      const col = ['#cccccc', '#4cc9f0', '#ff9f1c', '#d38cff'][lvl];
      for (const sd of [-1, 1]) {
        if (Math.random() < 0.6) this.addParticle(c.x - cs * c.len * 0.45 + -sn * sd * c.wid * 0.5, c.y - sn * c.len * 0.45 + cs * sd * c.wid * 0.5, (Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80, 0.25, col, lvl ? 3.5 : 2.5);
      }
    }
    if (this.wet > 0.3 && Math.abs(vF) > 140 && Math.random() < this.wet * 0.5) {
      this.addParticle(c.x - cs * c.len * 0.6 + (Math.random() - 0.5) * c.wid, c.y - sn * c.len * 0.6 + (Math.random() - 0.5) * c.wid, c.vx * 0.25 + (Math.random() - 0.5) * 50, c.vy * 0.25 + (Math.random() - 0.5) * 50, 0.6, 'rgba(225,230,236,0.55)', 7);
    }
    if ((c.drift || Math.abs(vL) > 70) && this.skids.length < 900) {
      for (const sd of [-1, 1]) {
        const x = c.x - cs * c.len * 0.4 - sn * sd * c.wid * 0.45, y = c.y - sn * c.len * 0.4 + cs * sd * c.wid * 0.45;
        this.skids.push({ x, y, a: 0.35 });
      }
    }

    this.trackFollow(c, dt);
  }

  trackFollow(c, dt) {
    const tr = this.track, pts = tr.pts, n = tr.n;
    let best = c.idx, bd = Infinity;
    for (let j = -12; j <= 30; j++) {
      const i = (c.idx + j + n) % n;
      const dx = pts[i].x - c.x, dy = pts[i].y - c.y;
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    if (bd > (tr.W * 2) * (tr.W * 2)) { // lost: full search
      for (let i = 0; i < n; i++) {
        const dx = pts[i].x - c.x, dy = pts[i].y - c.y;
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
    }
    c.idx = best;
    const p = pts[best];
    const dx = c.x - p.x, dy = c.y - p.y;
    const lat = dx * p.nx + dy * p.ny;
    c.lat = lat;
    const half = tr.W / 2;
    c.offroad = !c.inPit && Math.abs(lat) > half + 4;
    const wall = half + tr.runoff;
    if (!c.inPit && Math.abs(lat) > wall) {
      const sd = Math.sign(lat);
      c.x -= p.nx * (Math.abs(lat) - wall) * sd;
      c.y -= p.ny * (Math.abs(lat) - wall) * sd;
      const vn = c.vx * p.nx + c.vy * p.ny;
      if (vn * sd > 0) {
        c.vx -= p.nx * vn * 1.3; c.vy -= p.ny * vn * 1.3;
        const impact = Math.abs(vn);
        c.vx *= 0.82; c.vy *= 0.82;
        if (c.isPlayer && impact > 60) { this.shake = Math.min(1, impact / 250); this.sfx.hit(); }
        if (c.drift) c.drift = false;
      }
    }
    if (c.offroad && Math.random() < 0.3 && Math.hypot(c.vx, c.vy) > 60) {
      this.addParticle(c.x, c.y, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, 0.5, this.isKart ? 'rgba(220,200,150,0.7)' : 'rgba(200,190,170,0.7)', 6);
    }
    // progress
    const along = clamp(dx * Math.cos(p.a) + dy * Math.sin(p.a), -tr.spacing, tr.spacing);
    let s = best * tr.spacing + along;
    s = (s + tr.L) % tr.L;
    let ds = s - c.s;
    if (ds < -tr.L / 2) ds += tr.L;
    if (ds > tr.L / 2) ds -= tr.L;
    c.s = s;
    if (c.finished) return;
    c.total += ds;
    // wrong way
    if (c.isPlayer && this.state === 'race') {
      const fwd = Math.cos(c.h) * Math.cos(p.a) + Math.sin(c.h) * Math.sin(p.a);
      c.wrongWay = (fwd < -0.4 && Math.hypot(c.vx, c.vy) > 30) ? c.wrongWay + dt : 0;
    }
    const lap = Math.floor(c.total / tr.L);
    if (lap > c.maxLap && this.state === 'race') {
      if (c.maxLap >= 0) {
        const lt = this.time - c.lapStart;
        c.lapTimes.push(lt);
        if (lt < c.best) c.best = lt;
        if (c.isPlayer && lap < this.laps) {
          if (lap === this.laps - 1) this.flash('FINAL LAP', '#ffd166', 2);
          else this.flash('LAP ' + (lap + 1), '#ffffff', 1.2);
        }
      }
      c.maxLap = lap;
      c.lapStart = this.time;
      if (c.pitReq && lap < this.laps && !this.quali && !this.pit) this.doPit(c);
      if (lap >= this.laps) {
        c.finished = true;
        c.finishTime = this.time;
        if (c.isPlayer) {
          this.computeOrder();
          const pos = c.pos;
          if (this.quali) this.flash('LAP ' + fmtTime(c.finishTime), '#ffd166', 6, 56);
          else this.flash(pos === 1 ? 'VICTORY!' : 'FINISHED P' + pos, pos === 1 ? '#ffd166' : '#ffffff', 6, 60);
          c.auto = true;
          this.sfx.beep(660, 0.2); setTimeout(() => this.sfx.beep(990, 0.4), 200);
        }
      }
    }
    // stuck detection (AI)
    if ((!c.isPlayer || c.auto) && !c.pitSeq) {
      if (this.state === 'race' && this.time > 2 && Math.hypot(c.vx, c.vy) < 25 && c.spin <= 0) c.stuck += dt; else c.stuck = 0;
      if (c.stuck > 3) this.resetToTrack(c);
    }
  }

  /* ---------- pit lane ---------- */
  setupPitLane() {
    const tr = this.track, half = tr.W / 2, sp = tr.spacing, n = tr.n;
    const lat = half + tr.runoff + 30;
    const entryD = -Math.round(280 / sp) * sp, exitD = Math.round(320 / sp) * sp, boxD = Math.round(30 / sp) * sp;
    for (const side of [1, -1]) {
      let ok = true;
      for (let d = entryD; d <= exitD && ok; d += sp * 2) {
        const q = this.lanePoint(d, side * lat);
        for (let i = 0; i < n; i += 2) {
          const t = tr.pts[i], dx = t.x - q.x, dy = t.y - q.y;
          if (dx * dx + dy * dy < (lat - 6) * (lat - 6)) { ok = false; break; }
        }
      }
      if (ok) return { side, lat, entryD, exitD, boxD, half };
    }
    return null;
  }
  // signed distance of arc-length s from the start line, in [-L/2, L/2)
  lineDist(s) { const L = this.track.L; let d = ((s % L) + L) % L; if (d >= L / 2) d -= L; return d; }
  // point at distance d from the line with a lateral offset
  lanePoint(d, lat) {
    const tr = this.track, n = tr.n, L = tr.L;
    const s = ((d % L) + L) % L, f = s / tr.spacing, i = Math.floor(f) % n, t = f - Math.floor(f);
    const a = tr.pts[i], b = tr.pts[(i + 1) % n];
    const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
    const nx = a.nx + (b.nx - a.nx) * t, ny = a.ny + (b.ny - a.ny) * t, ang = a.a + angDiff(b.a, a.a) * t;
    return { x: x + nx * lat, y: y + ny * lat, a: ang, nx, ny };
  }
  // lateral offset of the pit lane path at distance d (blends in from the track and back out)
  laneLat(seq, d) {
    const P = this.pit, sm = x => x * x * (3 - 2 * x);
    const full = P.side * P.lat, outLat = P.side * P.half * 0.45;
    if (d < P.entryD + 140) return seq.lat0 + (full - seq.lat0) * sm(clamp((d - P.entryD) / 140, 0, 1));
    if (d > P.exitD - 150) return full + (outLat - full) * sm(clamp((d - (P.exitD - 150)) / 150, 0, 1));
    return full;
  }
  startPitSeq(c) {
    const d = this.lineDist(c.s);
    const slot = this.cars.indexOf(c) % 5;
    c.pitSeq = {
      phase: 'in', t: 0, d, v: Math.hypot(c.vx, c.vy), lat0: c.lat,
      comp: c.pitReq === '?' ? null : c.pitReq, box: this.pit.boxD + (c.isPlayer ? 0 : [-138, -92, -46, 46, 92][slot]),
      stopT: (this.isKart ? 2.6 : 2.3) + Math.random() * 0.7 + (!c.isPlayer && Math.random() < 0.15 ? 2 + Math.random() * 3 : 0)
    };
    if (c.pitSeq.stopT > 4.5) this.announce(c, '- SLOW PIT STOP');
    c.pitReq = null; c.inPit = true; c.drift = false;
    if (c.isPlayer) { this.flash('PIT LANE', '#ffd166', 1.5, 34); if (this.o.onPit) this.o.onPit(c.pitSeq.comp ? null : 'choose'); }
  }
  // tyre the player picks from the menu shown during the pit-lane cutscene
  choosePitTyre(k) {
    const seq = this.player.pitSeq;
    if (!seq || seq.comp || !TYRES[k]) return;
    seq.comp = k;
    if (this.o.onPit) this.o.onPit(null);
    this.flash(TYRES[k].name.toUpperCase() + 'S READY', TYRES[k].color, 1.2, 30);
  }
  defaultTyre() { return this.wet > 0.4 ? 'W' : 'M'; }
  updatePitSeq(c, dt) {
    const seq = c.pitSeq, P = this.pit;
    seq.t += dt;
    const lim = this.isKart ? 115 : 145;
    if (seq.phase === 'in') {
      const toBox = seq.box - seq.d;
      const vMax = Math.min(Math.max(lim, seq.v), Math.sqrt(Math.max(0, 2 * 260 * toBox)) + 5);
      seq.v = Math.min(vMax, seq.v > lim ? seq.v - 380 * dt : seq.v + 200 * dt);
      seq.v = Math.min(seq.v, vMax);
      seq.d += seq.v * dt;
      if (toBox <= 1.5) { seq.d = seq.box; seq.v = 0; seq.phase = 'stop'; seq.t = 0; if (c.isPlayer) this.sfx.beep(330, 0.25, 'triangle'); }
    } else if (seq.phase === 'stop') {
      if (!seq.comp) { // crew waits until a tyre is chosen (the clock is still running for the race)
        seq.wait = (seq.wait || 0) + dt; seq.t = 0;
        if (seq.wait > 6) this.choosePitTyre(this.defaultTyre());
      } else if (seq.t >= seq.stopT) {
        c.compound = seq.comp; c.stint = c.total; c.wear = 0; c.temp = 0.5; c.tyreWarned = false; c.pits++;
        seq.phase = 'out'; seq.t = 0;
        if (c.isPlayer) { this.flash('GO GO GO!', '#7CFF6B', 1.2, 34); this.sfx.whoosh(); }
      }
    } else {
      const fast = seq.d > P.exitD - 150;
      const top = fast ? c.maxSpeed * 0.75 : lim;
      seq.v = Math.min(top, seq.v + c.accel * 0.9 * dt);
      seq.d += seq.v * dt;
    }
    const lat = this.laneLat(seq, seq.d);
    const q = this.lanePoint(seq.d, lat);
    const q2 = this.lanePoint(seq.d + 4, this.laneLat(seq, seq.d + 4));
    c.x = q.x; c.y = q.y;
    c.h = Math.atan2(q2.y - q.y, q2.x - q.x);
    c.vx = Math.cos(c.h) * seq.v; c.vy = Math.sin(c.h) * seq.v;
    this.trackFollow(c, dt);
    if (seq.phase === 'out' && seq.d >= P.exitD) {
      c.pitSeq = null; c.inPit = false;
      if (c.isPlayer) this.flash('BACK ON TRACK', '#ffffff', 1, 26);
    }
  }
  aiMistake(c) {
    const x = Math.random(), spinP = 0.15 + 0.3 * this.wet;
    let text;
    if (x < spinP) {
      c.spin = 0.7 + Math.random() * 0.6; c.spinDir = Math.random() < 0.5 ? -1 : 1;
      c.vx *= 0.55; c.vy *= 0.55; c.mistake = 0;
      text = 'SPINS!';
    } else if (x < spinP + (1 - spinP) * 0.5) { c.mType = 'wide'; c.mistake = 0.6 + Math.random() * 0.5; text = 'RUNS WIDE'; }
    else { c.mType = 'late'; c.mistake = 0.35 + Math.random() * 0.25; text = 'LOCKS UP'; }
    c.mistakes = (c.mistakes || 0) + 1;
    this.announce(c, text);
  }
  announce(c, text) {
    if (this.headless || !this.player || c === this.player) return;
    const d = Math.hypot(c.x - this.player.x, c.y - this.player.y);
    if (c.isRival || d < 700 || c.pos <= 3) this.flash((c.isRival ? 'RIVAL ' : '') + c.code + ' ' + text, '#ffb703', 1.6, 24);
  }
  doPit(c) {
    const tr = this.track, p = tr.pts[c.idx];
    const side = tr.W / 2 + tr.runoff * 0.55;
    c.x = p.x + p.nx * side; c.y = p.y + p.ny * side; c.h = p.a;
    c.vx = 0; c.vy = 0;
    c.inPit = true;
    c.pitTimer = (this.isKart ? 3.2 : 4.2) + Math.random() * 0.6;
    if (!c.isPlayer && Math.random() < 0.15) { c.pitTimer += 2 + Math.random() * 3; this.announce(c, '- SLOW PIT STOP'); }
    c.compound = c.pitReq === '?' ? this.defaultTyre() : c.pitReq; c.pitReq = null;
    c.stint = c.total; c.wear = 0; c.temp = 0.5; c.tyreWarned = false; c.pits++;
    if (c.isPlayer) { this.flash('PIT STOP - ' + TYRES[c.compound].name.toUpperCase() + 'S', TYRES[c.compound].color, 2.5, 32); this.sfx.beep(330, 0.3, 'triangle'); if (this.o.onPit) this.o.onPit(null); }
  }
  requestPit(k) {
    const p = this.player;
    if (this.quali || p.finished) return;
    if (p.pitSeq) return;
    if (k === 'box') {
      p.pitReq = p.pitReq ? null : '?';
      this.flash(p.pitReq ? 'BOX THIS LAP - PICK TYRES IN THE PIT' : 'STAYING OUT', p.pitReq ? '#ffd166' : '#ffffff', 2, 26);
    } else {
      p.pitReq = k && TYRES[k] ? k : null;
      if (p.pitReq) this.flash('BOX THIS LAP - ' + TYRES[k].name.toUpperCase(), TYRES[k].color, 2, 28);
    }
    if (this.o.onPit) this.o.onPit(p.pitReq ? 'on' : 'off');
  }
  aiPitPlan(c) {
    if (this.quali || c.pitReq || c.finished) return;
    const remaining = 1 - clamp(c.total / (this.track.L * this.laps), 0, 1);
    if (remaining < 0.1) return;
    const TC = TYRES[c.compound];
    if (!TC.wet && this.wet > c.pitThresh) c.pitReq = 'W';
    else if (TC.wet && this.wet < 0.2 && this.rain < 0.1) c.pitReq = remaining < 0.45 ? 'S' : 'M';
    else if (c.wear > 1.02 && remaining > 0.15) c.pitReq = TC.wet ? 'W' : remaining < 0.45 ? 'S' : 'M';
  }

  resetToTrack(c) {
    const tr = this.track;
    const p = tr.pts[c.idx];
    c.x = p.x; c.y = p.y; c.h = p.a; c.vx = Math.cos(p.a) * 40; c.vy = Math.sin(p.a) * 40;
    c.spin = 0; c.drift = false; c.stuck = 0;
    if (c.isPlayer) { c.bog = 0.8; this.flash('RESET', '#aaa', 0.8, 28); }
  }

  collideCars() {
    const cars = this.cars;
    for (let i = 0; i < cars.length; i++) {
      for (let j = i + 1; j < cars.length; j++) {
        const a = cars[i], b = cars[j];
        if (a.inPit || b.inPit) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const rr = a.rad + b.rad;
        const d2 = dx * dx + dy * dy;
        if (d2 < rr * rr && d2 > 0.0001) {
          const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
          const push = (rr - d) / 2;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
          const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rv < 0) {
            const j2 = -rv * 0.65;
            a.vx -= nx * j2; a.vy -= ny * j2;
            b.vx += nx * j2; b.vy += ny * j2;
            if ((a.isPlayer || b.isPlayer) && -rv > 80) { this.shake = Math.max(this.shake, 0.3); this.sfx.beep(140, 0.08, 'square', 0.1); }
          }
        }
      }
    }
  }

  updateSlipstream(dt) {
    for (const c of this.cars) {
      const cs = Math.cos(c.h), sn = Math.sin(c.h);
      let inSlip = false;
      for (const o of this.cars) {
        if (o === c) continue;
        const dx = o.x - c.x, dy = o.y - c.y;
        const ahead = dx * cs + dy * sn;
        if (ahead < 20 || ahead > (this.isKart ? 130 : 180)) continue;
        const lat = Math.abs(-dx * sn + dy * cs);
        if (lat < 22) { inSlip = true; break; }
      }
      c.slip = clamp(c.slip + (inSlip ? dt * 1.5 : -dt * 2), 0, 1);
      if (c.isPlayer && c.slip > 0.35 && Math.random() < 0.25) {
        this.addParticle(c.x + (Math.random() - 0.5) * 30, c.y + (Math.random() - 0.5) * 30, -c.vx * 0.3, -c.vy * 0.3, 0.3, 'rgba(255,255,255,0.5)', 1.5);
      }
    }
  }

  /* ---------- AI ---------- */
  aiInput(c, dt) {
    const tr = this.track, pts = tr.pts, n = tr.n, W = tr.W;
    const cs = Math.cos(c.h), sn = Math.sin(c.h);
    const v = Math.max(0, c.vx * cs + c.vy * sn);
    const k = c.auto ? 0.84 : c.aiK;

    // lane management
    let blocker = null, bd = Infinity;
    for (const o of this.cars) {
      if (o === c) continue;
      const dx = o.x - c.x, dy = o.y - c.y;
      const ahead = dx * cs + dy * sn;
      if (ahead < 0 || ahead > 95) continue;
      const lat = Math.abs(-dx * sn + dy * cs);
      if (lat < c.rad * 2.3 && ahead < bd) { bd = ahead; blocker = o; }
    }
    const pAhead = pts[(c.idx + 10) % n];
    let target = c.lanePref * 0.6;
    if (blocker) {
      const myLat = c.lat - pAhead.line, oLat = blocker.lat - pAhead.line;
      target = oLat > myLat ? oLat - W * 0.32 : oLat + W * 0.32;
      if (Math.abs(target + pAhead.line) > W * 0.42) target = oLat > myLat ? oLat + W * 0.32 : oLat - W * 0.32;
    }
    c.laneOff += (clamp(target, -W * 0.4, W * 0.4) - c.laneOff) * Math.min(1, dt * 1.6);

    const la = Math.round(7 + v * 0.045);
    const tp = pts[(c.idx + la) % n];
    const off = clamp(tp.line + c.laneOff, -W * 0.42, W * 0.42);
    const tx = tp.x + tp.nx * off, ty = tp.y + tp.ny * off;
    const desired = Math.atan2(ty - c.y, tx - c.x);
    const diff = angDiff(desired, c.h);
    let steer = clamp(diff * 3, -1, 1);

    // speed planning
    const Vt = this.tier.baseSpeed;
    const turn = c.turn * c.tg;
    let tgt = c.maxSpeed * 1.5;
    let maxK = 0;
    for (let j = 2; j <= 70; j += 2) {
      const q = pts[(c.idx + j) % n];
      const kap = Math.abs(q.k) + 1e-6;
      if (j < 30) maxK = Math.max(maxK, kap);
      const vc = k * turn / (kap + 0.45 * k * turn / Vt);
      const allowed = Math.sqrt(vc * vc + 2 * c.brake * 0.72 * j * tr.spacing);
      if (allowed < tgt) tgt = allowed;
    }
    let thr = v < tgt - 4, brk = v > tgt + 14;

    // recovery when facing the wrong way: commit to a pivot turn until roughly aligned
    if (c.recover > 0 || (Math.abs(diff) > 1.6 && v < 50)) {
      if (c.recover <= 0) { c.recover = 2.5; c.recoverDir = Math.sign(diff) || 1; }
      c.recover -= dt;
      if (Math.abs(diff) < 0.45) c.recover = 0;
      const d = Math.abs(diff) > 2.6 ? c.recoverDir * Math.abs(diff) : diff;
      return { thr: Math.abs(diff) < 1.2, brk: false, steer: Math.sign(d), pivot: d, drift: false, item: false };
    }

    // mistakes: running wide, missing a braking point, locking up, spinning.
    // More likely in the rain, on cold or worn tyres, under pressure, and for low-Focus drivers.
    if ((!c.auto || c.mistakesOn) && this.state === 'race' && this.time > 2) {
      if (c.mistake > 0) {
        c.mistake -= dt;
        if (c.mType === 'wide') { steer *= 0.2; thr = true; brk = false; }
        else if (c.mType === 'late') { thr = true; brk = false; steer *= 0.6; }
        else if (c.mType === 'lock') {
          thr = false; brk = true; steer *= 0.3;
          if (Math.random() < 0.6) this.addParticle(c.x, c.y, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, 0.8, 'rgba(235,235,235,0.6)', 9);
        }
        if (c.mistake <= 0 && c.mType === 'late') { c.mType = 'lock'; c.mistake = 0.45; } // braked too late... now locks up
      } else if (maxK > 1 / 800 && v > this.tier.baseSpeed * 0.4) {
        const TC = TYRES[c.compound];
        let rate = AI_MISTAKE_RATE * (1.4 - c.stats.foc / 100) * ({ easy: 1.5, normal: 1, hard: 0.65 }[this.o.difficulty] || 1);
        rate *= 1 + 2.5 * this.wet * (TC.wet ? 0.35 : 1);
        if (c.temp < 0.55) rate *= 1.7;
        if (c.wear > 1) rate *= 2;
        for (const o of this.cars) { // pressure from a car right behind
          if (o === c) continue;
          const dx = o.x - c.x, dy = o.y - c.y, along = dx * cs + dy * sn;
          if (along < -8 && along > -70 && Math.abs(-dx * sn + dy * cs) < 30) { rate *= 1.6; break; }
        }
        if (Math.random() < rate * dt) this.aiMistake(c);
      }
    }

    // ERS / items
    let item = false;
    if (this.ersOn && !this.itemsOn) item = maxK < 1 / 900 && c.ers > 0.25;
    if (this.itemsOn && c.item && !c.auto) c.itemHold += dt; // item use decided in _aiItemWant
    return { thr, brk, steer, drift: false, item };
  }

  /* ---------- items ---------- */
  rollItem(c) {
    const N = this.cars.length;
    let frac = (c.pos - 1) / Math.max(1, N - 1);
    frac = clamp(frac + 0.12 * (c.stats.rc / 100) - 0.04, 0, 1);
    const w = {
      nitro: 1 + 3 * frac,
      bolt: 0.6 + 2.2 * frac,
      oil: 2.6 - 1.8 * frac,
      shield: 1.4,
      storm: frac > 0.6 ? (frac - 0.6) * 4 : 0
    };
    let tot = 0; for (const k in w) tot += w[k];
    let r = Math.random() * tot;
    for (const k in w) { r -= w[k]; if (r <= 0) return k; }
    return 'nitro';
  }

  useItem(c) {
    const it = c.item;
    c.item = null; c.itemHold = 0;
    const cs = Math.cos(c.h), sn = Math.sin(c.h);
    if (it === 'nitro') { c.boost = Math.max(c.boost, 1.4); if (c.isPlayer) this.sfx.whoosh(); }
    else if (it === 'shield') { c.shield = 8; }
    else if (it === 'oil') { this.hazards.push({ x: c.x - cs * (c.len + 8), y: c.y - sn * (c.len + 8), life: 30, owner: c, born: this.time }); }
    else if (it === 'bolt') {
      const sp = Math.max(0, c.vx * cs + c.vy * sn) + 380;
      this.shots.push({ x: c.x + cs * c.len * 0.7, y: c.y + sn * c.len * 0.7, h: c.h, v: sp, life: 2.6, owner: c, trail: [] });
      if (c.isPlayer) this.sfx.beep(1200, 0.12, 'sawtooth', 0.1);
    } else if (it === 'storm') {
      this.stormFlash = 1;
      this.sfx.beep(60, 0.6, 'sawtooth', 0.3);
      for (const o of this.cars) {
        if (o === c || o.pos > c.pos || o.finished) continue;
        if (o.shield > 0) { o.shield = 0; continue; }
        o.slow = 2.4;
        if (o.isPlayer) this.flash('STRUCK BY ' + c.code + '\'s STORM', '#c77dff', 1.4, 26);
      }
      if (c.isPlayer) this.flash('STORM UNLEASHED', '#c77dff', 1.2, 28);
    }
  }

  hitCar(c, by, kind) {
    if (c.shield > 0) { c.shield = 0; this.burst(c.x, c.y, '#4cc9f0'); return; }
    c.spin = 0.7 + 0.5 * (1 - c.stats.foc / 100);
    c.spinDir = Math.random() < 0.5 ? -1 : 1;
    c.vx *= 0.45; c.vy *= 0.45;
    c.drift = false;
    this.burst(c.x, c.y, kind === 'oil' ? '#222' : '#ffd60a');
    if (c.isPlayer) { this.shake = 0.6; this.sfx.hit(); this.flash(by && by !== c ? 'HIT BY ' + by.code : 'SPUN OUT', '#ff6b6b', 1.2, 30); }
    else if (by && by.isPlayer) { this.flash('HIT ' + c.code + '!', '#7CFF6B', 1, 30); this.sfx.beep(520, 0.12, 'triangle', 0.15); }
  }

  updateItems(dt) {
    // boxes
    for (const b of this.boxes) {
      if (!b.active) { b.t -= dt; if (b.t <= 0) b.active = true; continue; }
      for (const c of this.cars) {
        if (c.item || c.itemRoll > 0) continue;
        const dx = c.x - b.x, dy = c.y - b.y;
        if (dx * dx + dy * dy < (c.rad + 12) * (c.rad + 12)) {
          b.active = false; b.t = 2.5;
          c.itemRoll = c.isPlayer ? 1.0 : 0.6;
          c.rollItem = this.rollItem(c);
          if (c.isPlayer) this.sfx.pickup();
          this.burst(b.x, b.y, '#ffffff');
          break;
        }
      }
    }
    // item rolls & use
    for (const c of this.cars) {
      if (c.itemRoll > 0) { c.itemRoll -= dt; if (c.itemRoll <= 0) { c.item = c.rollItem; c.itemHold = 0; } }
      const inp = c.isPlayer && !c.auto ? this.playerInput() : null;
      if (c.isPlayer && !c.auto) {
        if (inp.item && !c.prevItemKey && c.item && this.state === 'race' && c.spin <= 0) this.useItem(c);
        c.prevItemKey = inp.item;
      } else if (c.item && this.state === 'race') {
        const ai = this._aiItemWant(c);
        if (ai) this.useItem(c);
      }
    }
    // hazards
    for (const hz of this.hazards) {
      hz.life -= dt;
      for (const c of this.cars) {
        if (c.spin > 0) continue;
        if (c === hz.owner && this.time - hz.born < 0.8) continue;
        const dx = c.x - hz.x, dy = c.y - hz.y;
        if (dx * dx + dy * dy < (c.rad + 13) * (c.rad + 13)) { this.hitCar(c, hz.owner, 'oil'); hz.life = 0; break; }
      }
    }
    this.hazards = this.hazards.filter(h => h.life > 0);
    // projectiles
    const tr = this.track;
    for (const s of this.shots) {
      s.life -= dt;
      // home on nearest car ahead in cone
      let tgt = null, td = 420;
      for (const c of this.cars) {
        if (c === s.owner) continue;
        const dx = c.x - s.x, dy = c.y - s.y;
        const d = Math.hypot(dx, dy);
        if (d < td && Math.abs(angDiff(Math.atan2(dy, dx), s.h)) < 0.7) { td = d; tgt = c; }
      }
      if (tgt) s.h += clamp(angDiff(Math.atan2(tgt.y - s.y, tgt.x - s.x), s.h), -3.2 * dt, 3.2 * dt);
      else {
        // follow the track direction gently
        let bi = 0, bd = Infinity;
        for (let i = 0; i < tr.n; i += 3) { const dx = tr.pts[i].x - s.x, dy = tr.pts[i].y - s.y; const d = dx * dx + dy * dy; if (d < bd) { bd = d; bi = i; } }
        const p = tr.pts[(bi + 6) % tr.n];
        s.h += clamp(angDiff(Math.atan2(p.y - s.y, p.x - s.x), s.h), -2 * dt, 2 * dt);
      }
      s.x += Math.cos(s.h) * s.v * dt; s.y += Math.sin(s.h) * s.v * dt;
      s.trail.push({ x: s.x, y: s.y }); if (s.trail.length > 10) s.trail.shift();
      for (const c of this.cars) {
        if (c === s.owner || c.spin > 0) continue;
        const dx = c.x - s.x, dy = c.y - s.y;
        if (dx * dx + dy * dy < (c.rad + 8) * (c.rad + 8)) { this.hitCar(c, s.owner, 'bolt'); s.life = 0; break; }
      }
    }
    this.shots = this.shots.filter(s => s.life > 0);
  }

  _aiItemWant(c) {
    // reuse the AI decision computed in aiInput by re-running only the item part cheaply
    const cs = Math.cos(c.h), sn = Math.sin(c.h);
    const it = c.item;
    if (it === 'shield' || it === 'storm') return c.itemHold > 0.8;
    if (it === 'nitro') {
      let maxK = 0; const pts = this.track.pts, n = this.track.n;
      for (let j = 2; j < 30; j += 2) maxK = Math.max(maxK, Math.abs(pts[(c.idx + j) % n].k));
      return maxK < 1 / 500 || c.itemHold > 6;
    }
    for (const o of this.cars) {
      if (o === c) continue;
      const dx = o.x - c.x, dy = o.y - c.y;
      const ahead = dx * cs + dy * sn, lat = Math.abs(-dx * sn + dy * cs);
      if (it === 'bolt' && ahead > 40 && ahead < 380 && lat < ahead * 0.3) return true;
      if (it === 'oil' && ahead < -25 && ahead > -170 && lat < 40) return true;
    }
    return c.itemHold > (it === 'bolt' ? 8 : 7);
  }

  /* ---------- particles ---------- */
  addParticle(x, y, vx, vy, life, color, size) {
    if (this.particles.length > 500) return;
    this.particles.push({ x, y, vx, vy, life, max: life, color, size });
  }
  burst(x, y, color) {
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * TAU, s = 60 + Math.random() * 160;
      this.addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, 0.5, color, 4);
    }
  }
  updateParticles(dt) {
    for (const p of this.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
    this.particles = this.particles.filter(p => p.life > 0);
    for (const s of this.skids) s.a -= dt * 0.035;
    if (this.skids.length > 0 && this.skids[0].a <= 0) this.skids = this.skids.filter(s => s.a > 0);
  }

  /* ---------- finish ---------- */
  finish(retired) {
    if (this.done) return;
    this.computeOrder();
    const results = this.order.map(c => ({
      id: c.id, pos: c.pos, finished: c.finished, time: c.finishTime, best: c.best, grid: c.grid,
      dnf: retired && c.isPlayer
    }));
    if (retired) {
      const pr = results.find(r => r.dnf);
      results.splice(results.indexOf(pr), 1);
      results.push(pr);
      results.forEach((r, i) => r.pos = i + 1);
    }
    let fl = null;
    for (const c of this.cars) if (c.best < Infinity && (!fl || c.best < fl.best)) fl = c;
    const out = { results, fastestLap: fl ? fl.id : null, fastestTime: fl ? fl.best : null };
    this.destroy();
    this.o.onEnd(out);
  }

  /* ============================================================
     Rendering
     ============================================================ */
  render() {
    const ctx = this.ctx, w = this.w, h = this.h, tr = this.track;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    const now = this.clock, rdt = clamp(now - (this.lastRender == null ? now : this.lastRender), 0, 0.1);
    this.lastRender = now;
    if (this.v3 && this.viewMode === 'cockpit') {
      this.v3.render(rdt || 1 / 60);
      ctx.clearRect(0, 0, w, h);
      this.v3.labels(ctx, w, h);
      this.drawCockpit(ctx, w, h);
      if (this.stormFlash > 0) { ctx.fillStyle = `rgba(200,160,255,${this.stormFlash * 0.35})`; ctx.fillRect(0, 0, w, h); }
      this.drawHUD(ctx, w, h);
      return;
    }
    const z = this.cam.z;
    const shx = (Math.random() - 0.5) * this.shake * 14, shy = (Math.random() - 0.5) * this.shake * 14;
    ctx.save();
    ctx.translate(w / 2 + shx, h / 2 + shy);
    ctx.scale(z, z);
    ctx.translate(-this.cam.x, -this.cam.y);
    const vx0 = this.cam.x - w / 2 / z - 50, vy0 = this.cam.y - h / 2 / z - 50, vx1 = this.cam.x + w / 2 / z + 50, vy1 = this.cam.y + h / 2 / z + 50;
    const inView = (x, y, m = 0) => x > vx0 - m && x < vx1 + m && y > vy0 - m && y < vy1 + m;

    // grass
    ctx.fillStyle = this.grassPattern;
    ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);

    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // barrier + runoff
    ctx.strokeStyle = this.isKart ? '#2b2b2b' : '#d9dde3';
    ctx.lineWidth = tr.W + tr.runoff * 2 + 14;
    ctx.stroke(tr.path);
    ctx.strokeStyle = this.isKart ? '#c8ad78' : '#b9ad95';
    ctx.lineWidth = tr.W + tr.runoff * 2;
    ctx.stroke(tr.path);
    // curbs
    ctx.strokeStyle = '#f4f4f4';
    ctx.lineWidth = tr.W + 20;
    ctx.stroke(tr.path);
    ctx.setLineDash([24, 24]);
    ctx.strokeStyle = '#d62828';
    ctx.stroke(tr.path);
    ctx.setLineDash([]);
    // asphalt
    ctx.strokeStyle = '#3a3e46';
    ctx.lineWidth = tr.W;
    ctx.stroke(tr.path);
    ctx.strokeStyle = 'rgba(0,0,0,0.16)';
    ctx.lineWidth = tr.W * 0.3;
    ctx.stroke(tr.linePath);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.setLineDash([30, 40]);
    ctx.stroke(tr.path);
    ctx.restore();

    // pit lane
    if (this.pit) {
      if (!this.pitPath) {
        this.pitPath = new Path2D();
        const P = this.pit, seq = { lat0: 0 };
        for (let d = P.entryD; d <= P.exitD; d += 8) { const q = this.lanePoint(d, this.laneLat(seq, d)); d === P.entryD ? this.pitPath.moveTo(q.x, q.y) : this.pitPath.lineTo(q.x, q.y); }
      }
      ctx.strokeStyle = '#4a4f57'; ctx.lineWidth = 32; ctx.stroke(this.pitPath);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5; ctx.setLineDash([10, 10]); ctx.stroke(this.pitPath); ctx.setLineDash([]);
    }
    // start line + grid boxes
    const sp = tr.pts[0];
    ctx.save();
    ctx.translate(sp.x, sp.y); ctx.rotate(sp.a);
    const sq = 8, cols = Math.ceil(tr.W / sq);
    for (let i = 0; i < cols; i++) for (let j = 0; j < 2; j++) {
      ctx.fillStyle = (i + j) % 2 ? '#111' : '#fff';
      ctx.fillRect(-sq + j * sq, -tr.W / 2 + i * sq, sq, Math.min(sq, tr.W / 2 - (-tr.W / 2 + i * sq)));
    }
    ctx.restore();

    // skids
    ctx.fillStyle = '#111';
    for (const s of this.skids) {
      if (!inView(s.x, s.y)) continue;
      ctx.globalAlpha = Math.max(0, s.a);
      ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // stand + tyres
    const st = tr.stand;
    if (inView(st.x, st.y, 200)) {
      ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(st.a);
      ctx.fillStyle = '#555c66'; ctx.fillRect(-150, -30, 300, 60);
      for (let r = 0; r < 4; r++) {
        for (let i = 0; i < 28; i++) {
          ctx.fillStyle = ['#e63946', '#ffd60a', '#4cc9f0', '#f1f1f1', '#06d6a0'][(i * 7 + r * 3) % 5];
          ctx.fillRect(-145 + i * 10.5, -25 + r * 13, 7, 8);
        }
      }
      ctx.fillStyle = '#2b2f36'; ctx.fillRect(-155, -36, 310, 8);
      ctx.restore();
    }
    for (const t of tr.tires) {
      if (!inView(t.x, t.y)) continue;
      for (let i = -1; i <= 1; i++) {
        ctx.fillStyle = '#1b1b1b';
        ctx.beginPath(); ctx.arc(t.x + i * 9, t.y, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = i ? '#e63946' : '#f1f1f1';
        ctx.beginPath(); ctx.arc(t.x + i * 9, t.y, 2.4, 0, TAU); ctx.fill();
      }
    }

    // item boxes
    const tt = this.clock;
    for (const b of this.boxes) {
      if (!b.active || !inView(b.x, b.y)) continue;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(tt * 1.6);
      const hue = (tt * 120 + b.x) % 360;
      ctx.fillStyle = `hsla(${hue},90%,60%,0.85)`;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.rect(-10, -10, 20, 20); ctx.fill(); ctx.stroke();
      ctx.rotate(-tt * 1.6);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', 0, 1);
      ctx.restore();
    }
    // hazards
    for (const hz of this.hazards) {
      if (!inView(hz.x, hz.y)) continue;
      ctx.fillStyle = 'rgba(10,10,15,0.9)';
      ctx.beginPath(); ctx.ellipse(hz.x, hz.y, 16, 12, 0.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(120,80,200,0.35)';
      ctx.beginPath(); ctx.ellipse(hz.x - 4, hz.y - 3, 6, 4, 0.4, 0, TAU); ctx.fill();
    }

    // cars
    for (const c of this.cars) if (inView(c.x, c.y, 60)) this.drawCar(ctx, c);

    // shots
    for (const s of this.shots) {
      ctx.strokeStyle = 'rgba(255,214,10,0.6)'; ctx.lineWidth = 5;
      ctx.beginPath(); s.trail.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
      ctx.fillStyle = '#fff6a0';
      ctx.beginPath(); ctx.arc(s.x, s.y, 7, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 2; ctx.stroke();
    }
    // particles
    for (const p of this.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + p.life / p.max * 0.5), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // trees
    for (const t of tr.trees) {
      if (!inView(t.x, t.y, t.r)) continue;
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.arc(t.x + 8, t.y + 8, t.r, 0, TAU); ctx.fill();
      ctx.fillStyle = t.shade < 0.5 ? '#1f5a2a' : '#256b33';
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.arc(t.x - t.r * 0.3, t.y - t.r * 0.3, t.r * 0.5, 0, TAU); ctx.fill();
    }
    ctx.restore();

    if (this.stormFlash > 0) { ctx.fillStyle = `rgba(200,160,255,${this.stormFlash * 0.35})`; ctx.fillRect(0, 0, w, h); }
    if (this.rain > 0.05) {
      ctx.fillStyle = `rgba(40,50,70,${this.rain * 0.25})`; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = `rgba(200,215,235,${0.25 + this.rain * 0.3})`; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 160 * this.rain; i++) { const x = Math.random() * w, y = Math.random() * h; ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 16); }
      ctx.stroke();
    }
    this.drawHUD(ctx, w, h);
  }

  drawCar(ctx, c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.h);
    const L = c.len, W = c.wid;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(3, 4, L * 0.55, W * 0.6, 0, 0, TAU); ctx.fill();
    if (this.isKart) {
      ctx.fillStyle = '#111';
      for (const [x, y] of [[-L * 0.32, -W * 0.55], [-L * 0.32, W * 0.55], [L * 0.3, -W * 0.5], [L * 0.3, W * 0.5]]) {
        ctx.fillRect(x - 4.5, y - 3, 9, 6);
      }
      ctx.fillStyle = c.color;

      ctx.fillRect(L * 0.38, -W * 0.38, 4, W * 0.76);

    } else {

      ctx.beginPath(); ctx.moveTo(c.x, c.y - c.len * 0.9); ctx.lineTo(c.x - 6, c.y - c.len * 0.9 - 9); ctx.lineTo(c.x + 6, c.y - c.len * 0.9 - 9); ctx.closePath(); ctx.fill();
    } else if (c.isRival) {
      ctx.fillStyle = '#ff4d6d'; ctx.font = 'bold 11px Rajdhani, sans-serif'; ctx.textAlign = 'center';

  drawCockpit(ctx, w, h) {
    const p = this.player;
    const R = Math.min(w * 0.36, h * 0.3, 200);
    const cx = w / 2;
    ctx.save();
    // speed vignette
    const sf = clamp(Math.hypot(p.vx, p.vy) / this.tier.baseSpeed, 0, 1.3);
    if (sf > 0.3) {
      const vg = ctx.createRadialGradient(cx, h * 0.45, Math.min(w, h) * 0.35, cx, h * 0.45, Math.max(w, h) * 0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${(sf - 0.3) * 0.45})`);
      ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
    }
    if (this.v3 && this.v3.cockpit) { ctx.restore(); return; } // the 3D view draws the wheel and bodywork
    if (this.isKart) {
      const fg = ctx.createLinearGradient(0, h - R * 0.6, 0, h);
      fg.addColorStop(0, p.color); fg.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(cx - R * 1.5, h); ctx.lineTo(cx - R * 0.9, h - R * 0.55); ctx.lineTo(cx + R * 0.9, h - R * 0.55); ctx.lineTo(cx + R * 1.5, h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = fg; ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(cx - R * 0.85, h - R * 0.55, R * 1.7, R * 0.03);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(cx - R * 0.9, h - R * 0.58, R * 1.8, R * 0.06);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(cx - R * 0.55, h); ctx.lineTo(cx - R * 0.16, h - R * 0.95); ctx.lineTo(cx + R * 0.16, h - R * 0.95); ctx.lineTo(cx + R * 0.55, h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = p.team || p.color;
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(cx + s * w * 0.5, h); ctx.lineTo(cx + s * w * 0.5, h - R * 0.75); ctx.lineTo(cx + s * R * 1.15, h - R * 0.5); ctx.lineTo(cx + s * R * 0.95, h);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.translate(cx, h + R * 0.28);
    ctx.rotate(this.steerVis * 1.4);
    if (this.isKart) {
      ctx.strokeStyle = '#161616'; ctx.lineWidth = R * 0.15;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.8, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = R * 0.03;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.84, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = R * 0.17;
      for (const a of [Math.PI * 1.15, Math.PI * 1.85]) { ctx.beginPath(); ctx.arc(0, 0, R * 0.8, a - 0.25, a + 0.25); ctx.stroke(); }
      ctx.strokeStyle = '#161616';
      ctx.lineWidth = R * 0.09;
      for (const a of [-Math.PI / 2, Math.PI / 6, Math.PI * 5 / 6]) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * R * 0.75, Math.sin(a) * R * 0.75); ctx.stroke(); }
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, R * 0.2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd166'; ctx.fillRect(-R * 0.05, -R * 0.88, R * 0.1, R * 0.16);
    } else {
      ctx.fillStyle = '#151515';
      roundRect(ctx, -R * 0.85, -R * 0.55, R * 1.7, R * 0.75, R * 0.25); ctx.fill();
      ctx.fillStyle = '#0b0b0b';
      roundRect(ctx, -R * 0.95, -R * 0.45, R * 0.3, R * 0.75, R * 0.12); ctx.fill();
      roundRect(ctx, R * 0.65, -R * 0.45, R * 0.3, R * 0.75, R * 0.12); ctx.fill();
      ctx.fillStyle = '#1f6f8b'; roundRect(ctx, -R * 0.3, -R * 0.45, R * 0.6, R * 0.28, R * 0.05); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(R * 0.2)}px Rajdhani, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(Math.round(Math.hypot(p.vx, p.vy) * this.tier.kmh)), 0, -R * 0.3);
      ctx.textBaseline = 'alphabetic';
      ['#e63946', '#ffd60a', '#4cc9f0', '#06d6a0'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc((i < 2 ? -1 : 1) * R * 0.45, -R * 0.05 + (i % 2) * R * 0.17, R * 0.05, 0, TAU); ctx.fill(); });
      ctx.fillStyle = '#ffd166'; ctx.fillRect(-R * 0.04, -R * 0.6, R * 0.08, R * 0.08);
    }
    ctx.restore();
  }

  drawHUD(ctx, w, h) {
    const cockpit = !!(this.v3 && this.viewMode === 'cockpit');
    const ps = this.player.pitSeq;
    if (ps && cockpit) {
      const bar = Math.round(h * 0.1);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, bar); ctx.fillRect(0, h - bar, w, bar);
      ctx.textAlign = 'center'; ctx.fillStyle = '#ffd166'; ctx.font = `700 ${Math.round(bar * 0.45)}px Rajdhani, sans-serif`;
      const top = !ps.comp ? (ps.phase === 'stop' ? 'CREW WAITING - CHOOSE TYRES  ' + (6 - (ps.wait || 0)).toFixed(0) : 'PIT LANE  -  CHOOSE YOUR TYRES')
        : ps.phase === 'stop' ? 'PIT STOP  ' + Math.min(ps.t, ps.stopT).toFixed(1) + 's' : ps.phase === 'in' ? 'PIT LANE  -  LIMITER ON' : 'RELEASED!';
      ctx.fillText(top, w / 2, bar * 0.68);
      // live gaps to the cars around you
      const p = this.player, order = this.cars.slice().sort((a, b) => a.pos - b.pos), i = order.indexOf(p);
      const ahead = order[i - 1], behind = order[i + 1], spd = p.maxSpeed * 0.78;
      const fs = Math.round(bar * 0.3);
      const ty = h - bar * 0.38;
      ctx.font = `700 ${fs}px Rajdhani, sans-serif`;
      ctx.fillStyle = ps.comp ? TYRES[ps.comp].color : '#ffd166';
      ctx.fillText('P' + p.pos + (ps.comp ? '  •  ' + TYRES[ps.comp].name.toUpperCase() + 'S' : ''), w / 2, ty);
      ctx.font = `600 ${fs}px Rajdhani, sans-serif`;
      ctx.textAlign = 'left'; ctx.fillStyle = '#ff9f9f';
      ctx.fillText(ahead ? 'AHEAD P' + ahead.pos + ' ' + ahead.code + '  +' + Math.max(0, (ahead.total - p.total) / spd).toFixed(1) + 's' : 'LEADING', Math.max(12, w * 0.04), ty);
      ctx.textAlign = 'right'; ctx.fillStyle = '#9fffb0';
      ctx.fillText(behind ? 'BEHIND P' + behind.pos + ' ' + behind.code + '  -' + Math.max(0, (p.total - behind.total) / spd).toFixed(1) + 's' : 'LAST', w - Math.max(12, w * 0.04), ty);
      ctx.textAlign = 'center';
      for (const f of this.flashes) f.t = Math.min(f.t, 0.01);
      return;
    }
    const p = this.player, tr = this.track;
    const font = (s, wgt = 700) => `${wgt} ${s}px Rajdhani, "Segoe UI", sans-serif`;
    const small = w < 700 || h < 500;
    ctx.textBaseline = 'alphabetic';

    // position + lap
    const lap = clamp(Math.floor(p.total / tr.L) + 1, 1, this.laps);
    panel(ctx, 14, 14, small ? 150 : 190, small ? 92 : 108);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.font = font(small ? 40 : 52);
    if (this.quali) {
      ctx.fillText('QUALI', 26, small ? 56 : 66);
    } else {
      ctx.fillText('P' + p.pos, 26, small ? 56 : 66);
      ctx.font = font(18, 600); ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('/' + this.cars.length, small ? 80 : 100, small ? 56 : 66);
    }
    ctx.font = font(small ? 15 : 18, 600); ctx.fillStyle = '#ffd166';
    ctx.fillText(`LAP ${p.finished ? this.laps : lap}/${this.laps}`, 26, small ? 80 : 92);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText(fmtTime(p.finished ? p.finishTime : this.time), small ? 92 : 112, small ? 80 : 92);

    // timing tower
    if (!small) {
      const tx = 14, ty = 132, rowH = 22;
      panel(ctx, tx, ty, 190, rowH * this.order.length + 12);
      const leader = this.order[0];
      this.order.forEach((c, i) => {
        const y = ty + 8 + i * rowH;
        if (c.isPlayer) { ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(tx + 4, y, 182, rowH - 2); }
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = font(14, 700); ctx.textAlign = 'right';
        ctx.fillText(String(i + 1), tx + 26, y + 15);
        ctx.fillStyle = c.team || c.color; ctx.fillRect(tx + 32, y + 3, 4, rowH - 8);
        ctx.fillStyle = TYRES[c.compound].color; ctx.beginPath(); ctx.arc(tx + 128, y + 10, 4, 0, TAU); ctx.fill();
        ctx.fillStyle = c.isPlayer ? '#ffd166' : c.isRival ? '#ff8fa3' : '#fff'; ctx.textAlign = 'left';
        ctx.fillText(c.code, tx + 42, y + 15);
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.textAlign = 'right'; ctx.font = font(13, 600);
        let gap = '';
        if (i === 0) gap = 'Leader';
        else if (c.finished && leader.finished) gap = '+' + (c.finishTime - leader.finishTime).toFixed(1);
        else gap = '+' + Math.max(0, (leader.total - c.total) / (c.maxSpeed * 0.78)).toFixed(1);
        if (c.spin > 0) gap = 'SPIN';
        ctx.fillText(gap, tx + 182, y + 15);
      });
    }

    // minimap
    const ms = small ? 120 : 180;
    const mx = w - ms - 14, my = 14;
    panel(ctx, mx, my, ms, ms);
    const b = tr.bounds;
    const s = Math.min((ms - 24) / (b.maxX - b.minX), (ms - 24) / (b.maxY - b.minY));
    ctx.save();
    ctx.translate(mx + ms / 2, my + ms / 2);
    ctx.scale(s, s);
    ctx.translate(-(b.minX + b.maxX) / 2, -(b.minY + b.maxY) / 2);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 5 / s;
    ctx.stroke(tr.path);
    const sp = tr.pts[0];
    ctx.fillStyle = '#fff'; ctx.fillRect(sp.x - 6 / s, sp.y - 6 / s, 12 / s, 12 / s);
    for (const c of this.cars) {
      if (c.isPlayer) continue;
      ctx.fillStyle = c.isRival ? '#ff4d6d' : (c.team || c.color);
      ctx.beginPath(); ctx.arc(c.x, c.y, 4.5 / s, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#ffd166'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2 / s;
    ctx.beginPath(); ctx.arc(p.x, p.y, 7 / s, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();

    // speed
    const spd = Math.hypot(p.vx, p.vy);
    panel(ctx, 14, h - 86, 150, 72);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = font(44);
    ctx.fillText(Math.round(spd * this.tier.kmh), 26, h - 36);
    ctx.font = font(15, 600); ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('KM/H', 110, h - 36);
    if (p.best < Infinity) { ctx.font = font(13, 600); ctx.fillText('BEST ' + fmtTime(p.best), 26, h - 20); }
    // weather / wind / pit
    if (!this.quali || this.wet > 0) {
      const wx0 = small ? 14 : 310, wy0 = small ? 112 : h - 86;
      panel(ctx, wx0, wy0, 128, 72);
      ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = font(15, 700);
      ctx.fillText(this.rain > 0.15 ? 'RAIN' : this.wet > 0.15 ? 'DRYING' : 'DRY', wx0 + 12, wy0 + 22);
      ctx.font = font(12, 600); ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('WET ' + Math.round(this.wet * 100) + '%', wx0 + 12, wy0 + 40);
      // wind arrow relative to the car (up = straight ahead)
      const ang = this.wx.windDir - p.h - Math.PI / 2, ax = wx0 + 98, ay = wy0 + 34;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
      ctx.strokeStyle = p.windFx > 0.25 ? '#7CFF6B' : p.windFx < -0.25 ? '#ff6b6b' : '#ddd'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, -12); ctx.moveTo(-7, -4); ctx.lineTo(0, -13); ctx.lineTo(7, -4); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = p.windFx > 0.25 ? '#7CFF6B' : p.windFx < -0.25 ? '#ff6b6b' : 'rgba(255,255,255,0.6)';
      ctx.font = font(11, 700); ctx.textAlign = 'center';
      ctx.fillText(p.windFx > 0.25 ? 'TAILWIND' : p.windFx < -0.25 ? 'HEADWIND' : 'WIND', ax, wy0 + 64);
      ctx.textAlign = 'left';
      if (p.pitReq) { ctx.fillStyle = TYRES[p.pitReq] ? TYRES[p.pitReq].color : '#ffd166'; ctx.font = font(12, 700); ctx.fillText(TYRES[p.pitReq] ? 'BOX: ' + TYRES[p.pitReq].name.toUpperCase() : 'BOX THIS LAP', wx0 + 12, wy0 + 60); }
      else if (p.pitTimer > 0) { ctx.fillStyle = '#ffd166'; ctx.font = font(12, 700); ctx.fillText('IN PIT ' + p.pitTimer.toFixed(1), wx0 + 12, wy0 + 60); }
    }
    // tyres
    {
      const TC = TYRES[p.compound], x0 = 172, y0 = h - 86;
      panel(ctx, x0, y0, 128, 72);
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x0 + 26, y0 + 36, 19, 0, TAU); ctx.fill();
      ctx.strokeStyle = TC.color; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x0 + 26, y0 + 36, 15, 0, TAU); ctx.stroke();
      ctx.fillStyle = TC.color; ctx.font = font(17); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(TC.key, x0 + 26, y0 + 37); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      const bx = x0 + 54, bw = 64;
      const warm = clamp((p.temp - 0.3) / 0.45, 0, 1), life = clamp(1 - p.wear, 0, 1);
      ctx.font = font(11, 700); ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText(warm < 1 ? 'WARMING' : 'TEMP OK', bx, y0 + 20);
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bx, y0 + 25, bw, 7);
      ctx.fillStyle = warm < 0.5 ? '#4cc9f0' : warm < 1 ? '#8ecae6' : '#7bd88f'; ctx.fillRect(bx, y0 + 25, bw * warm, 7);
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillText(p.wear > 1 ? 'WORN OUT' : 'LIFE', bx, y0 + 48);
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bx, y0 + 53, bw, 7);
      ctx.fillStyle = life > 0.5 ? '#7bd88f' : life > 0.2 ? '#ffd166' : '#ff6b6b'; ctx.fillRect(bx, y0 + 53, bw * Math.max(life, p.wear > 1 ? 1 : 0), 7);
      if (p.wear > 1) { ctx.fillStyle = '#ff6b6b'; ctx.fillRect(bx, y0 + 53, bw, 7); }
    }

    // item / ERS
    const cx = w / 2;
    // in cockpit view the wheel owns the bottom centre, so item / ERS move up top
    const ix = cockpit ? (small ? 54 : cx) : cx;
    const iy = cockpit ? (small ? 112 : 14) : h - 96;
    if (this.itemsOn) {
      panel(ctx, ix - 40, iy, 80, 80);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '42px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
      if (p.itemRoll > 0) {
        const k = ITEM_KEYS[Math.floor(this.clock * 14) % ITEM_KEYS.length];
        ctx.globalAlpha = 0.7; ctx.fillText(ITEM_DEFS[k].icon, ix, iy + 42); ctx.globalAlpha = 1;
      } else if (p.item) {
        ctx.fillText(ITEM_DEFS[p.item].icon, ix, iy + 42);
        ctx.font = font(12, 700); ctx.fillStyle = '#fff'; ctx.fillText(small ? 'ITEM' : 'SPACE', ix, iy + 74);
      } else {
        ctx.font = font(13, 600); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillText('NO ITEM', ix, iy + 40);
      }
      ctx.textBaseline = 'alphabetic';
    }
    if (this.ersOn && !this.itemsOn) {
      const bw = small ? 150 : 220;
      const ex = cockpit && small ? 14 + bw / 2 + 10 : cx;
      const ey = cockpit ? (small ? 112 : 14) : h - 70;
      panel(ctx, ex - bw / 2 - 10, ey, bw + 20, 56);
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = font(12, 700); ctx.textAlign = 'left';
      ctx.fillText(small ? 'ERS (HOLD ITEM)' : 'ERS  (HOLD SPACE)', ex - bw / 2, ey + 18);
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(ex - bw / 2, ey + 26, bw, 10);
      ctx.fillStyle = p.ersActive ? '#f9f871' : '#4cc9f0'; ctx.fillRect(ex - bw / 2, ey + 26, bw * p.ers, 10);
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillText('TYRES', ex - bw / 2, ey + 50);
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(ex - bw / 2 + 50, ey + 42, bw - 50, 8);
      const tw = 1 - p.wear;

    if (p.slip > 0.35) {

    }
    if (p.drift) {
      const lvl = p.driftCharge > 2.4 ? 3 : p.driftCharge > 1.5 ? 2 : p.driftCharge > 0.75 ? 1 : 0;
      ctx.fillStyle = ['#ccc', '#4cc9f0', '#ff9f1c', '#d38cff'][lvl]; ctx.font = font(cockpit ? 22 : 16, 700); ctx.textAlign = 'center';
      ctx.fillText('DRIFT ' + '\u25CF'.repeat(lvl) + '\u25CB'.repeat(3 - lvl), cx, msgY - 22);
    }

    // countdown lights
    if (this.state === 'countdown' || this.time < 1) {
      const lw = 5 * 46 + 20;
      const lx = cx - lw / 2, ly = 20;
      panel(ctx, lx, ly, lw, 64);
      for (let i = 0; i < 5; i++) {
        const on = this.state === 'countdown' && i < this.lights;
        ctx.fillStyle = on ? '#ff2d2d' : '#2a2a2a';
        ctx.beginPath(); ctx.arc(lx + 33 + i * 46, ly + 32, 16, 0, TAU); ctx.fill();
        if (on) { ctx.fillStyle = 'rgba(255,80,80,0.3)'; ctx.beginPath(); ctx.arc(lx + 33 + i * 46, ly + 32, 22, 0, TAU); ctx.fill(); }
