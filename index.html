<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kart to Crown</title>
  <meta name="description" content="Create a driver and race from backyard karts all the way to the Apex Grand Prix.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #0b0f1a;
  --bg2: #111729;
  --card: #161d31;
  --card2: #1c2540;
  --line: rgba(255, 255, 255, 0.08);
  --text: #eef1f8;
  --muted: #8d97b3;
  --accent: #ff3b5c;
  --accent2: #ffd166;
  --good: #7bd88f;
  --bad: #ff6b6b;
  --blue: #4cc9f0;
  --radius: 14px;
  --head: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--head); margin: 0 0 8px; letter-spacing: 0.02em; }
h2 { font-size: 26px; }
h3 { font-size: 20px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.gold { color: var(--accent2); }
button { font: inherit; color: inherit; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--card2); border: 1px solid var(--line); color: var(--text);
  padding: 10px 18px; border-radius: 10px; cursor: pointer;
  font-family: var(--head); font-weight: 700; font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase;
  transition: transform .08s ease, background .15s ease, border-color .15s;
}
.btn:hover { background: #243055; border-color: rgba(255,255,255,0.18); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, #ff3b5c, #ff7a3b); border-color: transparent; color: #fff; box-shadow: 0 6px 22px rgba(255, 59, 92, 0.3); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.gold { background: linear-gradient(135deg, #ffd166, #ffb703); color: #1a1200; border-color: transparent; }
.btn.danger { background: rgba(255, 107, 107, 0.12); border-color: rgba(255, 107, 107, 0.4); color: #ffb3b3; }
.btn.ghost { background: transparent; }
.btn.big { padding: 14px 28px; font-size: 21px; }
.btn.sm { padding: 6px 12px; font-size: 14px; border-radius: 8px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- title ---------- */
.title-screen {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 16px; text-align: center; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(255, 59, 92, 0.25), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 40px, transparent 40px 80px),
    var(--bg);
}
.logo { font-family: var(--head); font-weight: 700; font-size: clamp(54px, 11vw, 120px); line-height: 0.9; letter-spacing: 0.02em; }
.logo .k { color: #fff; }
.logo .to { color: var(--accent); font-size: 0.45em; vertical-align: middle; margin: 0 0.15em; }
.logo .c { background: linear-gradient(180deg, #ffe08a, #ffb703); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tagline { color: var(--muted); font-size: 18px; margin: 18px 0 34px; max-width: 560px; }
.title-menu { display: flex; flex-direction: column; gap: 12px; width: min(320px, 100%); }
.ladder-mini { display: flex; gap: 6px; margin-top: 46px; flex-wrap: wrap; justify-content: center; }
.ladder-mini span { font-family: var(--head); font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.ladder-mini span:last-child { color: #1a1200; background: var(--accent2); border-color: transparent; }
.checker { position: absolute; left: 0; right: 0; height: 16px; background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0/16px 16px; opacity: 0.12; }
.checker.top { top: 0; } .checker.bottom { bottom: 0; }

/* ---------- layout ---------- */
.page { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card + .card { margin-top: 16px; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-title h3 { margin: 0; }
.grid2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stack > * + * { margin-top: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } .grid3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .grid3 { grid-template-columns: 1fr; } }

/* ---------- topbar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(11, 15, 26, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--head); font-weight: 700; font-size: 22px; cursor: pointer; }
.brand span { color: var(--accent); }
.driver-chip { display: flex; align-items: center; gap: 10px; }
.helmet { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--head); font-weight: 700; font-size: 16px; color: #000; border: 3px solid rgba(255,255,255,0.25); flex: none; }
.driver-chip .nm { font-weight: 700; line-height: 1.1; }
.driver-chip .sub { font-size: 12px; color: var(--muted); }
.top-stats { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; align-items: center; }
.tstat { display: flex; flex-direction: column; min-width: 64px; }
.tstat b { font-family: var(--head); font-size: 18px; line-height: 1.1; }
.tstat small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.meter { height: 6px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; width: 80px; margin-top: 4px; }
.meter i { display: block; height: 100%; border-radius: 99px; }
.tabs { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 10px 14px; border: none; background: none; color: var(--muted); font-family: var(--head); font-weight: 700; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab.active { color: #fff; border-bottom-color: var(--accent); }
.tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: middle; }

/* ---------- tier badge ---------- */
.tier-badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--head); font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.06em; color: #0b0f1a; }

/* ---------- next race ---------- */
.next-race { position: relative; overflow: hidden; }
.next-race .round { font-family: var(--head); color: var(--muted); font-weight: 700; letter-spacing: 0.08em; }
.next-race h2 { font-size: 34px; margin: 2px 0 8px; }
.race-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.race-meta b { color: var(--text); }
.track-preview { width: 100%; height: 170px; display: block; }
.next-race-body { display: grid; grid-template-columns: 1fr 220px; gap: 12px; align-items: center; }
@media (max-width: 560px) { .next-race-body { grid-template-columns: 1fr; } .track-preview { height: 140px; } }

/* ---------- planner ---------- */
.slots { display: flex; gap: 8px; margin-bottom: 14px; }
.slot { flex: 1; min-height: 58px; border-radius: 10px; border: 1px dashed rgba(255,255,255,0.15); padding: 8px 10px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; justify-content: center; }
.slot.filled { border-style: solid; background: var(--card2); color: var(--text); }
.slot .s-name { font-weight: 700; font-family: var(--head); font-size: 15px; }
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.action { text-align: left; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .15s, background .15s; }
.action:hover:not(:disabled) { border-color: rgba(255,255,255,0.25); background: #18203a; }
.action:disabled { opacity: 0.4; cursor: not-allowed; }
.action .a-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--head); font-weight: 700; font-size: 16px; }
.action .a-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.energy-cost { font-size: 12px; font-weight: 700; color: var(--accent2); }
.energy-cost.gain { color: var(--good); }

/* ---------- events ---------- */
.event-card { border-color: rgba(255, 209, 102, 0.35); background: linear-gradient(160deg, rgba(255,209,102,0.08), var(--card) 55%); }
.event-card .tagline-s { font-family: var(--head); font-weight: 700; color: var(--accent2); letter-spacing: 0.1em; font-size: 13px; }
.event-card p { margin: 6px 0 14px; font-size: 16px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices .btn { justify-content: flex-start; text-transform: none; font-family: var(--body); font-weight: 600; font-size: 15px; letter-spacing: 0; }

/* ---------- stats ---------- */
.stat-row { display: grid; grid-template-columns: 130px 1fr 44px 40px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.stat-row:last-child { border-bottom: none; }
.stat-row .nm { font-weight: 600; }
.stat-row .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.bar { height: 10px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), #7b61ff); }
.stat-val { font-family: var(--head); font-weight: 700; font-size: 20px; text-align: right; }
.plus { width: 34px; height: 30px; padding: 0; }
.ovr-big { font-family: var(--head); font-weight: 700; font-size: 64px; line-height: 1; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.kv div { background: var(--bg2); border-radius: 10px; padding: 10px 12px; }
.kv b { display: block; font-family: var(--head); font-size: 22px; }
.kv small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
@media (max-width: 520px) { .stat-row { grid-template-columns: 96px 1fr 36px 36px; } }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px 8px; border-bottom: 1px solid var(--line); }
tr.me td { background: rgba(255, 209, 102, 0.1); font-weight: 700; }
tr.rival td { background: rgba(255, 77, 109, 0.08); }
td.pos { font-family: var(--head); font-weight: 700; font-size: 17px; width: 40px; }
.swatch { display: inline-block; width: 4px; height: 16px; border-radius: 2px; vertical-align: middle; margin-right: 8px; }
.table-wrap { overflow-x: auto; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
.tag.rival { background: rgba(255,77,109,0.2); color: #ff8fa3; }
.tag.you { background: rgba(255,209,102,0.2); color: var(--accent2); }
.tag.fl { background: rgba(199,125,255,0.2); color: #d8b4fe; }

/* ---------- news ---------- */
.news { list-style: none; padding: 0; margin: 0; }
.news li { padding: 9px 0 9px 14px; border-bottom: 1px solid var(--line); font-size: 14px; position: relative; }
.news li::before { content: ''; position: absolute; left: 0; top: 15px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.news li.win::before { background: var(--accent2); }
.news li.podium::before { background: var(--good); }
.news li.rival::before { background: var(--accent); }
.news li.story::before { background: var(--blue); }
.news li:last-child { border-bottom: none; }

/* ---------- garage ---------- */
.part { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.part:last-child { border-bottom: none; }
.pips { display: flex; gap: 4px; margin-top: 6px; }
.pips i { width: 22px; height: 7px; border-radius: 3px; background: rgba(255,255,255,0.1); }
.pips i.on { background: var(--accent2); }

/* ---------- ladder ---------- */
.ladder { display: flex; flex-direction: column-reverse; gap: 8px; }
.rung { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); }
.rung .lvl { font-family: var(--head); font-weight: 700; width: 26px; color: var(--muted); }
.rung .rn { font-family: var(--head); font-weight: 700; font-size: 17px; }
.rung .rd { font-size: 12px; color: var(--muted); }
.rung .st { margin-left: auto; font-size: 13px; font-weight: 700; }
.rung.done { opacity: 0.75; }
.rung.current { border-color: var(--accent); background: linear-gradient(90deg, rgba(255,59,92,0.15), var(--bg2)); }
.rung.locked { opacity: 0.45; }

/* ---------- create ---------- */
.create-grid { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .create-grid { grid-template-columns: 1fr; } }
label.f { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
input[type=text], input[type=number], select {
  width: 100%; background: var(--bg2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px;
}
input:focus, select:focus { outline: 2px solid rgba(255, 59, 92, 0.5); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 110px 120px; gap: 10px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr 1fr; } .row2 > :first-child { grid-column: 1 / -1; } }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
.sw.sel { border-color: #fff; transform: scale(1.08); }
.bgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.bgc { text-align: left; background: var(--bg2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.bgc.sel { border-color: var(--accent); background: rgba(255,59,92,0.08); }
.bgc b { font-family: var(--head); font-size: 17px; display: block; }
.bgc span { font-size: 12px; color: var(--muted); display: block; }
.bgc em { font-style: normal; font-size: 12px; color: var(--good); display: block; margin-top: 4px; }
.alloc-row { display: grid; grid-template-columns: 110px 1fr 32px 32px 36px; gap: 8px; align-items: center; margin: 6px 0; }
.preview-card { position: sticky; top: 16px; text-align: center; }
#kart-preview { width: 100%; height: 220px; display: block; }

/* ---------- results ---------- */
.result-hero { text-align: center; padding: 26px 16px; }
.result-hero .pbig { font-family: var(--head); font-size: 96px; font-weight: 700; line-height: 1; }
.rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.rewards div { background: var(--bg2); border-radius: 10px; padding: 10px 12px; }
.rewards small { display: block; color: var(--muted); font-size: 12px; }
.rewards b { font-family: var(--head); font-size: 20px; }
.notes { margin: 12px 0 0; padding-left: 18px; color: var(--accent2); }

.offer { display: flex; gap: 14px; align-items: center; padding: 14px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; flex-wrap: wrap; }
.offer .o-main { flex: 1; min-width: 200px; }
.offer .o-name { font-family: var(--head); font-weight: 700; font-size: 20px; }
.offer.promote { border-color: rgba(123, 216, 143, 0.45); }
.trophy { font-size: 80px; line-height: 1; filter: drop-shadow(0 6px 20px rgba(255, 209, 102, 0.5)); }

/* ---------- race screen ---------- */
#race-screen { position: fixed; inset: 0; background: #000; z-index: 50; touch-action: none; user-select: none; -webkit-user-select: none; }
.tyre-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 8px 0 6px; }
.tyre-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 14px 10px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.1); color: inherit; font: inherit; cursor: pointer; }
.tyre-opt.on { border-color: var(--accent2, #ffd166); background: rgba(255,209,102,0.08); }
.tyre-opt small { color: rgba(255,255,255,0.6); font-size: 12px; line-height: 1.35; }
.tyre-badge { width: 44px; height: 44px; border-radius: 50%; border: 5px solid; background: #111; display: grid; place-items: center; font-family: var(--head); font-weight: 700; font-size: 20px; }
@media (max-width: 700px) { .tyre-pick { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .tyre-pick { grid-template-columns: 1fr; } .tyre-opt { flex-direction: row; text-align: left; } }
.pit-btn { position: absolute; top: 200px; right: 16px; z-index: 5; padding: 8px 14px; border-radius: 10px; background: rgba(10,14,24,0.75); color: #fff; border: 2px solid rgba(255,255,255,0.3); font-family: var(--head); font-weight: 700; font-size: 15px; cursor: pointer; }
.race-quali .pit-btn, .race-quali .tc-pit { display: none !important; }
.race-cine .pit-btn, .race-cine .pit-menu, .race-cine .touch-controls { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.pit-menu { position: absolute; top: 200px; right: 16px; z-index: 6; display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: rgba(10,14,24,0.9); border: 1px solid rgba(255,255,255,0.15); width: 210px; }
.pit-menu.hidden { display: none; }
.race-cine .pit-menu.choosing { opacity: 1; pointer-events: auto; }
.pit-menu.choosing { top: auto; bottom: 13%; right: 50%; transform: translateX(50%); width: min(560px, calc(100vw - 32px)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.pit-menu.choosing .pit-title { grid-column: 1 / -1; text-align: center; }
.pit-menu.choosing button { text-align: center; padding: 14px 6px; font-size: 17px; }
.pit-btn.on, .tc-pit.on { background: #ffd166 !important; color: #111 !important; border-color: #ffd166 !important; }
.pit-title { font-family: var(--head); font-weight: 700; font-size: 16px; color: #fff; }
.pit-title small { color: rgba(255,255,255,0.6); font-weight: 500; font-size: 12px; font-family: var(--body, sans-serif); }
.pit-menu button { padding: 10px 12px; border-radius: 10px; border: 2px solid var(--c, rgba(255,255,255,0.3)); background: rgba(255,255,255,0.06); color: #fff; font-family: var(--head); font-weight: 700; font-size: 16px; text-align: left; cursor: pointer; }
.pit-menu .pit-cancel { border-color: rgba(255,255,255,0.25); font-size: 13px; }
#race-canvas, .race-3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay { position: fixed; inset: 0; background: rgba(5, 8, 15, 0.7); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 60; padding: 16px; }
.overlay-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 10px; }
.overlay-card.wide { width: min(620px, 100%); max-height: 88vh; overflow: auto; display: block; }
.overlay-card h2 { text-align: center; }
.touch-controls { display: none; }
@media (hover: none) and (pointer: coarse) {
  .touch-controls { display: block; }
  .touch-controls button { position: relative; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); color: #fff; border-radius: 50%; width: 74px; height: 74px; font-family: var(--head); font-weight: 700; font-size: 18px; touch-action: none; }
  .touch-controls button.active { background: rgba(255,255,255,0.35); }
  .tc-left { position: absolute; left: 16px; bottom: 110px; display: flex; gap: 14px; }
  .tc-right { position: absolute; right: 16px; bottom: 110px; display: grid; grid-template-columns: 74px 74px; gap: 10px; }
  .tc-right .tc-small { width: 74px; height: 52px; border-radius: 14px; font-size: 14px; }
  .tc-right .tc-gas { background: rgba(123, 216, 143, 0.3); }
  .tc-pause { position: absolute; top: 146px; right: 16px; width: 44px !important; height: 44px !important; font-size: 14px !important; }
  .touch-controls .tc-tilt { position: absolute; top: 146px; right: 70px; width: 70px; height: 44px; border-radius: 12px; font-size: 13px; }

function resample(rx, ry, spacing) {

    while (cum[seg + 1] < d) seg++;

    const j = (seg + 1) % N;
    pts.push({ x: rx[seg] + (rx[j] - rx[seg]) * t, y: ry[seg] + (ry[j] - ry[seg]) * t });

}

function computeGeometry(pts, spacing) {

    const k2 = new Float64Array(n);
    for (let i = 0; i < n; i++) k2[i] = (k[(i - 1 + n) % n] + 2 * k[i] + k[(i + 1) % n]) / 4;
    k = k2;

function validate(pts, spacing, W, runoff) {

  const ms2 = minSep * minSep;
  for (let i = 0; i < n; i += 2) {

      if (sep <= skip) continue;
      const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;

}

function computeRacingLine(pts, W) {
  const n = pts.length;
  // wide curvature average
  const win = 22;
  const kw = new Float64Array(n);
  let acc = 0;
  for (let j = -win; j <= win; j++) acc += pts[(j + n) % n].k;
  for (let i = 0; i < n; i++) {
    kw[i] = acc / (win * 2 + 1);
    acc -= pts[(i - win + n) % n].k;
    acc += pts[(i + win + 1) % n].k;
  }
  let line = new Float64Array(n);
  for (let i = 0; i < n; i++) line[i] = clamp(kw[i] * W * 75, -0.3 * W, 0.3 * W);
  for (let pass = 0; pass < 6; pass++) {
    const l2 = new Float64Array(n);
    for (let i = 0; i < n; i++) l2[i] = (line[(i - 2 + n) % n] + line[(i - 1 + n) % n] + line[i] + line[(i + 1) % n] + line[(i + 2) % n]) / 5;
    line = l2;
  }

}

/* Small preview of a track drawn into a canvas element */
function drawTrackPreview(canvas, track, color) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 200, h = canvas.clientHeight || 140;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const b = track.bounds;

  ctx.save();

  ctx.scale(s, s);

  ctx.strokeStyle = 'rgba(255,255,255,0.12)';

  ctx.stroke(track.path);
  ctx.strokeStyle = color || '#fff';
  ctx.lineWidth = Math.max(track.W * 0.7, 3 / s);
  ctx.stroke(track.path);

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(p.x, p.y, 7 / s, 0, TAU); ctx.fill();

/* Races target ~5 minutes: the faster the series and the shorter the track, the more laps. */
const RACE_TARGET_SECONDS = 300;
function raceLaps(trackOrName, tier) {
  const tr = typeof trackOrName === 'string' ? buildTrack(trackOrName, tier) : trackOrName;

  const lapTime = tr.L / avgSpeed;

}

  // sky reflections for shiny materials (re-made when the weather changes a lot)

    const gnd = new THREE.Mesh(new THREE.CircleGeometry(90, 24), new THREE.MeshBasicMaterial({ color: L3(this.rainNow > 0.3 ? 0x3d4a3a : 0x4c6a3f) }));

  /* ---------- circuit ---------- */
  buildWorld() {
    const e = this.e, tr = e.track, kart = this.kart, half = tr.W / 2;
    const b = tr.bounds;
    const grass = this.tex(512, 512, (g, w, h) => {
      g.fillStyle = kart ? '#4d8a3f' : '#4a8344'; g.fillRect(0, 0, w, h);
      g.fillStyle = kart ? '#579646' : '#53904b'; g.fillRect(0, 0, w, h / 2);
      for (let i = 0; i < 18000; i++) { g.fillStyle = Math.random() < 0.5 ? 'rgba(20,40,10,0.10)' : 'rgba(210,230,150,0.07)'; g.fillRect(Math.random() * w, Math.random() * h, 1.2, 2.6); }
      for (let i = 0; i < 30; i++) { g.fillStyle = 'rgba(90,80,30,0.05)'; g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 10 + Math.random() * 30, 0, TAU); g.fill(); }
    }, true);
    const size = Math.max(b.maxX - b.minX, b.maxY - b.minY) + 12000;
    grass.repeat.set(size / 340, size / 340);
    const gg = new THREE.PlaneGeometry(size, size); gg.rotateX(-Math.PI / 2);
    this.grassMat = this.std(0xffffff, { map: grass, roughness: 0.95, polygonOffset: true, polygonOffsetFactor: 4, polygonOffsetUnits: 8 });
    const ground = new THREE.Mesh(gg, this.grassMat);
    ground.position.set((b.minX + b.maxX) / 2, 0, (b.minY + b.maxY) / 2);
    ground.receiveShadow = true;
    this.scene.add(ground);

    const vc = this.std(0xffffff, { vertexColors: true, side: THREE.DoubleSide, roughness: 0.95, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4 });
    this.runMat = vc;
    const runA = this.col(kart ? '#cdb382' : '#aaa497'), runB = this.col(kart ? '#c5a978' : '#a29c90');
    const run = i => (i % 6 < 3 ? runA : runB);
    this.ribbon(half + 12, half + tr.runoff, 0, 0, vc, run);
    this.ribbon(-half - tr.runoff, -half - 12, 0, 0, vc, run);
    const red = this.col('#c81e1e'), white = this.col('#ededed');
    const kerb = i => (Math.floor(i / 2) % 2 ? red : white);
    this.kerbMat = this.std(0xffffff, { vertexColors: true, side: THREE.DoubleSide, roughness: 0.55 });
    this.ribbon(half, half + 12, 0.2, 1.6, this.kerbMat, kerb);
    this.ribbon(-half - 12, -half, 1.6, 0.2, this.kerbMat, kerb);
    // asphalt: colour, bump and roughness detail
    const asphDraw = (g, w, h, bump) => {
      g.fillStyle = bump ? '#808080' : '#3f434a'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 26000; i++) { const v = Math.random(); g.fillStyle = v < 0.5 ? 'rgba(0,0,0,0.14)' : 'rgba(255,255,255,0.08)'; g.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5); }
      if (!bump) {
        const gr = g.createLinearGradient(0, 0, w, 0);
        gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.32, 'rgba(0,0,0,0.18)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.24)'); gr.addColorStop(0.68, 'rgba(0,0,0,0.18)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(28,30,34,0.35)'; g.fillRect(Math.random() * w * 0.8, Math.random() * h, 25 + Math.random() * 60, 10 + Math.random() * 40); }
        for (let i = 0; i < 4; i++) { g.strokeStyle = 'rgba(20,20,22,0.35)'; g.lineWidth = 2; g.beginPath(); let x = Math.random() * w, y = Math.random() * h; g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (Math.random() - 0.5) * 30; y += 10 + Math.random() * 20; g.lineTo(x, y); } g.stroke(); }
        g.fillStyle = '#e8e8e8'; g.fillRect(0, 0, 6, h); g.fillRect(w - 6, 0, 6, h);

    const asph = this.tex(256, 1024, (g, w, h) => asphDraw(g, w, h, false), true);

    this.asphMat = this.std(0xffffff, { map: asph, bumpMap: asphBump, bumpScale: 0.6, roughness: 0.88, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2 });
    this.ribbon(-half, half, 0, 0, this.asphMat, null, true);
    const dash = this.col('#d6d6d6');

    const beam = new THREE.Mesh(new THREE.BoxGeometry(6, 10, span * 2 + 6), dark); beam.position.set(0, 62, 0); beam.castShadow = true; gantry.add(beam);
    const banner = this.tex(512, 64, (g, w, h) => {

  }

  /* ---------- scenery ---------- */
  buildScenery() {
    const e = this.e, tr = e.track, half = tr.W / 2;
    const rng = mulberry32(hashStr(tr.name + 'scenery'));
    const concrete = this.std(0x8c939c, { roughness: 0.9 });
    const st = tr.stand;
    const crowd = this.tex(512, 128, (g, w, h) => {
      g.fillStyle = '#4f565f'; g.fillRect(0, 0, w, h);
      const cs = ['#e63946', '#ffd60a', '#4cc9f0', '#f1f1f1', '#06d6a0', '#ff9f1c', '#3a0ca3', '#f4a261', '#222'];
      for (let r = 0; r < 10; r++) for (let i = 0; i < 80; i++) { if (Math.random() < 0.12) continue; g.fillStyle = cs[(Math.random() * cs.length) | 0]; g.fillRect(i * 6.4 + 1, r * 12.8 + 3.5, 4.4, 7); g.fillStyle = ['#e0b48f', '#c68c63', '#8d5a3b', '#f1c9a5'][(Math.random() * 4) | 0]; g.fillRect(i * 6.4 + 1.6, r * 12.8 + 0.5, 3.2, 3.2); }
    });
    const crowdMat = this.std(0xffffff, { map: crowd, roughness: 0.9 });
    const stand = new THREE.Group();
    for (let k = 0; k < 4; k++) {
      const step = new THREE.Mesh(new THREE.BoxGeometry(300, 12, 15), [concrete, concrete, concrete, concrete, crowdMat, concrete]);
      step.position.set(0, 6 + k * 10, 22 - k * 15); step.castShadow = true; step.receiveShadow = true; stand.add(step);
    }
    const roof = new THREE.Mesh(new THREE.BoxGeometry(312, 3, 74), this.std(0xe8ecf0, { roughness: 0.35, metalness: 0.5 }));
    roof.position.set(0, 66, 0); roof.castShadow = true; stand.add(roof);
    for (const x of [-145, 0, 145]) { const p = new THREE.Mesh(new THREE.BoxGeometry(3, 66, 3), concrete); p.position.set(x, 33, -28); p.castShadow = true; stand.add(p); }
    stand.position.set(st.x, 0, st.y); stand.rotation.y = -st.a;
    const sp = tr.pts[0];
    const facing = (st.x - sp.x) * Math.sin(-st.a) + (st.y - sp.y) * Math.cos(-st.a);
    if (facing > 0) stand.rotation.y += Math.PI;
    this.scene.add(stand);

    // pit building (old style, only when there is no pit lane)
    const pd = half + tr.runoff + 70;
    const px = sp.x + sp.nx * pd, py = sp.y + sp.ny * pd;
    if (!this.pit && this.clearOfTrack(px, py, pd - 20)) {
      const pit = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(280, 34, 50), this.std(0xeef1f4, { roughness: 0.55 })); body.position.y = 17; body.castShadow = body.receiveShadow = true; pit.add(body);
      const glass = new THREE.Mesh(new THREE.BoxGeometry(284, 10, 54), this.std(0x1d3346, { roughness: 0.05, metalness: 0.9 })); glass.position.y = 40; pit.add(glass);
      const cap = new THREE.Mesh(new THREE.BoxGeometry(290, 3, 60), this.std(this.kart ? 0xd62839 : 0x1d3557, { roughness: 0.4 })); cap.position.y = 46; cap.castShadow = true; pit.add(cap);
      const toTrack = new THREE.Vector3(sp.x - px, 0, sp.y - py).normalize();
      const s = (toTrack.x * Math.sin(-sp.a) + toTrack.z * Math.cos(-sp.a)) >= 0 ? 1 : -1;
      const doorM = this.std(0x2a2e35, { roughness: 0.5, metalness: 0.3 });
      for (let i = 0; i < 8; i++) { const d = new THREE.Mesh(new THREE.BoxGeometry(24, 22, 1), doorM); d.position.set(-122 + i * 35, 11, s * 25.6); pit.add(d); }
      pit.position.set(px, 0, py); pit.rotation.y = -sp.a;
      this.scene.add(pit);
    }

    // sponsor billboards (logo on both sides)
    const boards = SPONSOR_NAMES.map((name, i) => this.tex(512, 128, (g, w, h) => {
      const bg = ['#1d3557', '#d62839', '#f2c500', '#2a9d8f', '#111', '#f07800', '#3a0ca3', '#eef2f5'][i % 8];
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      g.fillStyle = (bg === '#eef2f5' || bg === '#f2c500') ? '#111' : '#fff';
      g.font = 'bold 54px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(name.toUpperCase(), w / 2, h / 2 + 3, w - 30);
    }));
    const postM = this.std(0x666a70, { roughness: 0.4, metalness: 0.6 });
    const step = Math.max(40, Math.round(520 / tr.spacing));
    for (let i = 0, k = 0; i < tr.n; i += step, k++) {
      const p = tr.pts[i], side = k % 2 ? 1 : -1, d = half + tr.runoff + 34;
      const x = p.x + p.nx * d * side, y = p.y + p.ny * d * side;
      if (!this.clearOfTrack(x, y, d - 8) || this.inPitArea(x, y)) continue;
      const g = new THREE.Group();
      const bmat = this.std(0xffffff, { map: boards[k % boards.length], roughness: 0.5 });
      for (const r of [0, Math.PI]) { const face = new THREE.Mesh(new THREE.PlaneGeometry(90, 22), bmat); face.rotation.y = r; face.position.y = 26; face.castShadow = true; g.add(face); }
      for (const s of [-38, 38]) { const post = new THREE.Mesh(new THREE.BoxGeometry(2.5, 26, 2.5), postM); post.position.set(s, 13, -0.8); g.add(post); }
      g.position.set(x, 0, y);
      g.lookAt(p.x - Math.cos(p.a) * 300, 0, p.y - Math.sin(p.a) * 300);
      this.scene.add(g);
    }

    // tyre stacks
    const nT = tr.tires.length * 3;
    if (nT) {
      const tm = new THREE.InstancedMesh(new THREE.CylinderGeometry(6, 6, 14, 14), this.std(0x161616, { roughness: 0.85 }), nT);
      const M = new THREE.Matrix4(); let k = 0;
      for (const t of tr.tires) for (let i = -1; i <= 1; i++) { M.makeTranslation(t.x + i * 12, this.inPitArea(t.x, t.y) ? -100 : 7, t.y); tm.setMatrixAt(k++, M); }
      tm.castShadow = true;

      const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.12, 0.18, 1, 7), this.std(0x4e3523, { roughness: 1 }), trees.length);
      trees.forEach((t, i) => { const r = t.r * 0.9; P.set(t.x, r * 0.5, t.y); S.set(r, r, r); M.compose(P, Q, S); trunks.setMatrixAt(i, M); });
      trunks.castShadow = true; this.scene.add(trunks);
      const greens = [0x1d4f26, 0x285f30, 0x2f6b34, 0x3a6a2a].map(c => L3(c));
      const leaf = this.std(0xffffff, { roughness: 0.9 });
      if (pines.length) {
        const low = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 10), leaf, pines.length);
        const up = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 10), leaf, pines.length);
        pines.forEach((t, i) => {
          const r = t.r * 0.95, th = r * 0.8;
          Q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rng() * TAU);
          P.set(t.x, th + r * 0.9, t.y); S.set(r, r * 1.8, r); M.compose(P, Q, S); low.setMatrixAt(i, M);
          P.set(t.x, th + r * 2.1, t.y); S.set(r * 0.7, r * 1.5, r * 0.7); M.compose(P, Q, S); up.setMatrixAt(i, M);
          const c = greens[(i + (t.shade * 4 | 0)) % 4]; low.setColorAt(i, c); up.setColorAt(i, c.clone().multiplyScalar(1.15));
        });
        low.castShadow = up.castShadow = true;
        this.scene.add(low); this.scene.add(up);
      }
      if (round.length) {
        const crowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), leaf, round.length);
        Q.set(0, 0, 0, 1);
        round.forEach((t, i) => {
          const r = t.r * 1.05;
          P.set(t.x, r * 1.8, t.y); S.set(r, r * 0.95, r); M.compose(P, Q, S); crowns.setMatrixAt(i, M);
          crowns.setColorAt(i, greens[(i + 1) % 4].clone().multiplyScalar(1.25));

        crowns.castShadow = true;
        this.scene.add(crowns);
      }
    }
  }

  /* ---------- pit lane ---------- */
  buildPitArea() {
    // centre line of the pit lane + garage block, for keeping scenery out of the way
    this.pitPts = [];
    if (!this.pit) return;
    const e = this.e, P = this.pit, seq = { lat0: P.side * P.half * 0.45 };
    for (let d = P.entryD - 40; d <= P.exitD + 40; d += 20) this.pitPts.push(e.lanePoint(d, e.laneLat(seq, d)));
  }
  inPitArea(x, y, r = 0) {
    if (!this.pit) return false;
    const lim = 80 + r;
    for (const q of this.pitPts) { const dx = q.x - x, dy = q.y - y; if (dx * dx + dy * dy < lim * lim) return true; }
    return false;
  }
  // wall segments on the pit side that are removed for the pit lane
  inPitGap(i) {
    const P = this.pit, d = this.e.lineDist(i * this.e.track.spacing);
    return d > P.entryD - 10 && d < P.exitD + 10;
  }
  laneStrip(fa, fb, y, mat, from, to, uvW) {
    const e = this.e, pos = [], uvs = [], nrm = [];
    const step = 6;
    let v = 0;
    for (let d = from; d < to; d += step) {
      const p0 = e.lanePoint(d, 0), p1 = e.lanePoint(d + step, 0);
      const a0 = fa(d), b0 = fb(d), a1 = fa(d + step), b1 = fb(d + step);
      const A = [p0.x + p0.nx * a0, p0.y + p0.ny * a0], B = [p0.x + p0.nx * b0, p0.y + p0.ny * b0];
      const C = [p1.x + p1.nx * a1, p1.y + p1.ny * a1], D = [p1.x + p1.nx * b1, p1.y + p1.ny * b1];
      for (const q of [A, B, D, A, D, C]) { pos.push(q[0], y, q[1]); nrm.push(0, 1, 0); }
      const v1 = v + step / (uvW || 40);
      uvs.push(0, v, 1, v, 1, v1, 0, v, 1, v1, 0, v1);
      v = v1;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    const m = new THREE.Mesh(g, mat); m.receiveShadow = true; this.scene.add(m);
    return m;
  }
  buildPitLane() {
    if (!this.pit) return;
    const e = this.e, P = this.pit, side = P.side, tr = e.track, half = tr.W / 2;
    const seq = { lat0: side * P.half * 0.45 };
    const lat = d => e.laneLat(seq, d);
    const off = (lt, k) => d => lat(d) + side * k;
    const lm = this.std(0xffffff, { map: this.asphMat.map, bumpMap: this.asphMat.bumpMap, bumpScale: 0.6, roughness: 0.85, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2 });
    this.pitLaneMat = lm;
    // lane surface (wider through the entry / exit where it crosses the runoff)
    this.laneStrip(off(0, -18), off(0, 18), 0.05, lm, P.entryD, P.exitD, 36);
    this.laneStrip(d => side * (half + 2), off(0, -10), 0.04, lm, P.entryD, P.entryD + 150, 36);
    this.laneStrip(d => side * (half + 2), off(0, -10), 0.04, lm, P.exitD - 160, P.exitD, 36);
    // white edge lines + pit-box markings
    const white = this.std(0xf2f2f2, { roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4, side: THREE.DoubleSide });
    this.laneStrip(off(0, 16), off(0, 18), 0.07, white, P.entryD + 140, P.exitD - 150);
    this.laneStrip(off(0, -18), off(0, -16), 0.07, white, P.entryD + 140, P.exitD - 150);
    const yel = this.std(0xffc300, { roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4, side: THREE.DoubleSide });
    for (const b of [-138, -92, -46, 0, 46, 92]) {

      const bump = new THREE.CylinderGeometry(1.1, 1.1, W * 0.9, 8); bump.rotateX(Math.PI / 2);
      add(bump, carbon, -L * 0.52, 3.2, 0);
      for (const s of [1, -1]) { const pod = add(new THREE.BoxGeometry(L * 0.36, 3.6, 3.4), paint, -L * 0.04, 4.4, s * W * 0.47); pod.rotation.x = s * 0.12; }
      add(new THREE.BoxGeometry(5, 6, W * 0.42), carbon, -L * 0.2, 6, 0);
      add(new THREE.BoxGeometry(6, 7, W * 0.4), paint, -L * 0.1, 9, 0);
      for (const s of [1, -1]) add(new THREE.BoxGeometry(8, 1.8, 1.8), paint, L * 0.06, 9, s * 3.6, 0, -0.35);
      add(new THREE.SphereGeometry(4.6, 18, 14), helmet, -L * 0.08, 14.5, 0);
      add(new THREE.BoxGeometry(2, 2.6, 6.4), visor, -L * 0.08 + 3.6, 14.8, 0);
      add(new THREE.BoxGeometry(2, 1.2, W * 0.6), carbon, -L * 0.42, 6, 0);
      for (const [x, z] of [[-L * 0.32, W * 0.58], [-L * 0.32, -W * 0.58]]) wheel(3.9, 3.8, x, 3.9, z);
      for (const [x, z] of [[L * 0.3, W * 0.52], [L * 0.3, -W * 0.52]]) wheel(3.4, 3, x, 3.4, z);
    } else {
      add(new THREE.BoxGeometry(L * 0.5, 4.6, W * 0.36), paint, -L * 0.05, 4.8, 0);
      const ng = new THREE.CylinderGeometry(0.8, 3, L * 0.42, 4); ng.rotateZ(-Math.PI / 2); ng.rotateX(Math.PI / 4);
      add(ng, paint, L * 0.36, 4, 0);
      for (const s of [1, -1]) { const sp = add(new THREE.BoxGeometry(L * 0.34, 4.2, W * 0.24), paint, -L * 0.1, 4, s * W * 0.3); sp.rotation.x = s * 0.06; }
      const cov = new THREE.CylinderGeometry(1.5, 3.4, L * 0.38, 6); cov.rotateZ(Math.PI / 2);

      add(halo, carbon, L * 0.02, 10.6, 0, Math.PI / 2);
      add(new THREE.BoxGeometry(0.8, 4, 0.8), carbon, L * 0.12, 8.6, 0);
      add(new THREE.SphereGeometry(3.3, 18, 14), helmet, -L * 0.02, 9.4, 0);
      add(new THREE.BoxGeometry(4, 0.8, W * 1.3), team, L * 0.54, 1.6, 0);
      add(new THREE.BoxGeometry(3, 0.6, W * 1.2), carbon, L * 0.5, 2.6, 0);
      for (const s of [1, -1]) add(new THREE.BoxGeometry(5, 3, 0.5), team, L * 0.53, 2.4, s * W * 0.65);
      add(new THREE.BoxGeometry(4, 1.2, W * 1.05), team, -L * 0.52, 11.8, 0);
      add(new THREE.BoxGeometry(2.4, 0.8, W * 1.0), carbon, -L * 0.49, 13.4, 0);
      for (const s of [1, -1]) add(new THREE.BoxGeometry(6, 9, 0.6), team, -L * 0.5, 8.5, s * W * 0.52);
      add(new THREE.BoxGeometry(L * 0.15, 1.2, W * 0.9), carbon, -L * 0.5, 2, 0);
      // rain light
      const rl = add(new THREE.BoxGeometry(0.6, 1.2, 2), new THREE.MeshBasicMaterial({ color: 0xff2020 }), -L * 0.55, 6, 0);
      g.userData.rainLight = rl;
      for (const [x, z] of [[-L * 0.32, W * 0.68], [-L * 0.32, -W * 0.68]]) wheel(5.4, 5.6, x, 5.4, z);
      for (const [x, z] of [[L * 0.28, W * 0.64], [L * 0.28, -W * 0.64]]) wheel(4.9, 4.6, x, 4.9, z);
    }
    // race number plates
    const num = c.number || (hashStr(String(c.id)) % 98) + 2;
    const plate = this.tex(128, 96, (cx, w, h) => { cx.fillStyle = '#f4f4f4'; cx.fillRect(0, 0, w, h); cx.fillStyle = '#111'; cx.font = 'bold 76px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(String(num), w / 2, h / 2 + 4); });
    const pm = this.std(0xffffff, { map: plate, roughness: 0.4 });
    if (this.kart) {
      const pl = new THREE.Mesh(new THREE.PlaneGeometry(7, 5.2), pm); pl.rotation.set(-Math.PI / 2 + 0.25, 0, -Math.PI / 2); pl.position.set(L * 0.38, 6.6, 0); g.add(pl);
      for (const sd of [1, -1]) { const sp2 = new THREE.Mesh(new THREE.PlaneGeometry(6, 4.5), pm); sp2.position.set(-L * 0.04, 4.6, sd * (W * 0.47 + 1.75)); sp2.rotation.y = sd > 0 ? 0 : Math.PI; g.add(sp2); }
    } else {
      const pl = new THREE.Mesh(new THREE.PlaneGeometry(5, 3.8), pm); pl.rotation.set(-Math.PI / 2, 0, -Math.PI / 2); pl.position.set(L * 0.3, 5.3, 0); g.add(pl);
      for (const sd of [1, -1]) { const sp2 = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 4), pm); sp2.position.set(-L * 0.3, 7.2, sd * 3.1); sp2.rotation.y = sd > 0 ? 0 : Math.PI; g.add(sp2); }
    }
    g.userData.wheels = wheels;
    g.userData.roll = 0;
    const sh = new THREE.Mesh(new THREE.SphereGeometry(L * 0.75, 16, 12), new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.25, depthWrite: false }));
    sh.position.y = 6; sh.visible = false; g.add(sh); g.userData.shield = sh;
    return g;
  }
  buildCars() {
    this.carMeshes = this.e.cars.map(c => { const m = this.carMesh(c); this.scene.add(m); return m; });
  }

  /* ---------- driver's cockpit (attached to the camera) ---------- */
  buildCockpit() {
    const p = this.e.player;
    const ck = this.cockpit = new THREE.Group();
    this.camera.add(ck);
    const paint = this.std(this.col(p.color), { roughness: 0.3, metalness: 0.35 });
    const team = this.std(this.col(p.team || p.color), { roughness: 0.3, metalness: 0.3 });
    const grip = this.std(0x161616, { roughness: 0.85 });
    const carbon = this.std(0x1c1d21, { roughness: 0.4, metalness: 0.3 });
    const wheel = this.wheel3 = new THREE.Group();
    if (this.kart) {
      wheel.add(new THREE.Mesh(new THREE.TorusGeometry(1, 0.11, 12, 40), grip));
      for (const a of [-Math.PI / 2, Math.PI / 6, Math.PI * 5 / 6]) {
        const s = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.12, 0.05), carbon);
        s.position.set(Math.cos(a) * 0.48, Math.sin(a) * 0.48, 0); s.rotation.z = a; wheel.add(s);
      }
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.12, 20), paint); hub.rotation.x = Math.PI / 2; wheel.add(hub);
      const mark = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.06), this.std(0xffd166, { roughness: 0.5 })); mark.position.set(0, 1, 0.02); wheel.add(mark);
      this.body3 = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), paint);
      ck.add(this.body3);
    } else {
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.75, 0.16), carbon); wheel.add(body);
      for (const s of [-1, 1]) { const gp = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.8, 14), grip); gp.position.set(s * 0.88, -0.02, 0.04); wheel.add(gp); }
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.26), new THREE.MeshBasicMaterial({ color: L3(0x1f8fb0) })); scr.position.set(0, 0.12, 0.09); wheel.add(scr);
      ['#e63946', '#ffd60a', '#4cc9f0', '#06d6a0'].forEach((c, i) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.04, 10), this.std(this.col(c), { roughness: 0.4 })); b.rotation.x = Math.PI / 2; b.position.set((i < 2 ? -1 : 1) * 0.45, -0.12 - (i % 2) * 0.15, 0.1); wheel.add(b); });
      this.nose3 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 1, 1, 4, 1), paint);
      ck.add(this.nose3);
      this.sides3 = [-1, 1].map(s => { const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), carbon); ck.add(m); return m; });
    }
    ck.add(wheel);
  }
  layoutCockpit() {
    const cam = this.camera, d = 10;
    const hh = Math.tan(cam.fov * Math.PI / 360) * d, hw = hh * cam.aspect;
    const r = Math.min(hw * 0.4, hh * 0.5);
    const w = this.wheel3;
    w.scale.setScalar(r);
    w.position.set(0, this.kart ? -hh - r * 0.12 : -hh * 0.97, -d);
    w.rotation.set(-0.3, 0, -this.e.steerVis * 1.4);
    if (this.kart) {
      const b = this.body3;
      b.scale.set(hw * 1.3, hh * 0.24, d * 0.5);
      b.position.set(0, -hh * 1.08, -d * 1.05);
      b.rotation.set(0.3, 0, 0);
    } else {
      const n = this.nose3;
      n.scale.set(hw * 0.55, d * 1.6, hh * 0.18);
      n.rotation.set(-Math.PI / 2 + 0.1, 0, Math.PI / 4);
      n.position.set(0, -hh * 1.12, -d * 1.6);
      this.sides3.forEach((m, i) => {
        const s = i ? 1 : -1;
        m.scale.set(hw * 0.3, hh * 0.3, d * 1.2);
        m.position.set(s * hw * 1.0, -hh * 1.0, -d * 1.0);
        m.rotation.set(0.1, 0, s * 0.25);
      });
    }
  }

  /* ---------- items, hazards, particles ---------- */
  buildDynamic() {
    this.boxMeshes = [];
    const hg = new THREE.CircleGeometry(15, 18); hg.rotateX(-Math.PI / 2);
    const hm = new THREE.MeshBasicMaterial({ color: 0x0b0b12 });
    this.hazMeshes = Array.from({ length: 16 }, () => { const m = new THREE.Mesh(hg, hm); m.visible = false; m.position.y = 0.5; this.scene.add(m); return m; });
    const sg = new THREE.SphereGeometry(6, 10, 8), sm = new THREE.MeshBasicMaterial({ color: 0xfff27a });
    this.shotMeshes = Array.from({ length: 12 }, () => { const m = new THREE.Mesh(sg, sm); m.visible = false; this.scene.add(m); return m; });
    const MAXP = 520;
    const pg = new THREE.BufferGeometry();
    this.pPos = new Float32Array(MAXP * 3); this.pCol = new Float32Array(MAXP * 3);
    pg.setAttribute('position', new THREE.BufferAttribute(this.pPos, 3));
    pg.setAttribute('color', new THREE.BufferAttribute(this.pCol, 3));
    const dot = this.tex(32, 32, (g, w, h) => { const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
    this.points = new THREE.Points(pg, new THREE.PointsMaterial({ size: 12, map: dot, vertexColors: true, transparent: true, opacity: 0.6, depthWrite: false }));
    this.points.frustumCulled = false;
    this.scene.add(this.points);
  }

  /* ---------- rain ---------- */
  buildRain() {
    const N = this.rainN = 1600;
    const g = new THREE.BufferGeometry();
    this.rainPos = new Float32Array(N * 6);
    this.rainSeed = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { this.rainSeed[i * 3] = (Math.random() - 0.5) * 520; this.rainSeed[i * 3 + 1] = Math.random() * 220; this.rainSeed[i * 3 + 2] = (Math.random() - 0.5) * 520; }
    g.setAttribute('position', new THREE.BufferAttribute(this.rainPos, 3));
    this.rainMat = new THREE.LineBasicMaterial({ color: L3(0xc8d2dc), transparent: true, opacity: 0, depthWrite: false });
    this.rainLines = new THREE.LineSegments(g, this.rainMat);
    this.rainLines.frustumCulled = false;
    this.scene.add(this.rainLines);
    this.rainT = 0;
  }
  updateRain(dt) {
    const e = this.e, rain = e.rain, cam = this.camera.position;
    this.rainLines.visible = rain > 0.03;
    if (!this.rainLines.visible) return;
    this.rainMat.opacity = 0.18 + 0.4 * rain;
    this.rainT += dt;
    const fall = 700, len = 16, wx = Math.cos(e.wx.windDir) * e.wx.wind * 120, wz = Math.sin(e.wx.windDir) * e.wx.wind * 120;
    const n = Math.floor(this.rainN * Math.min(1, rain * 1.2));
    const P = this.rainPos, S = this.rainSeed;
    for (let i = 0; i < this.rainN; i++) {
      const o = i * 6;
      if (i >= n) { P[o] = P[o + 3] = cam.x; P[o + 1] = P[o + 4] = -100; P[o + 2] = P[o + 5] = cam.z; continue; }
      let y = (S[i * 3 + 1] - this.rainT * fall) % 220; if (y < 0) y += 220;
      const x = cam.x + ((S[i * 3] + this.rainT * wx) % 520 + 780) % 520 - 260, z = cam.z + ((S[i * 3 + 2] + this.rainT * wz) % 520 + 780) % 520 - 260;
      P[o] = x; P[o + 1] = y; P[o + 2] = z;
      P[o + 3] = x - wx * 0.02; P[o + 4] = y + len; P[o + 5] = z - wz * 0.02;
    }
    this.rainLines.geometry.attributes.position.needsUpdate = true;
  }
  // sky, fog, light, wet asphalt
  applyWeather(force) {
    const e = this.e, r = clamp(e.rain, 0, 1), w = clamp(e.wet, 0, 1);
    if (!force && Math.abs(r - (this.lastR || 0)) < 0.01 && Math.abs(w - (this.lastW || 0)) < 0.01) return;
    this.lastR = r; this.lastW = w;
    this.skyTop.copy(this.skyDry.top).lerp(this.skyWet.top, r).convertSRGBToLinear();
    this.skyHor.copy(this.skyDry.hor).lerp(this.skyWet.hor, r).convertSRGBToLinear();
    this.scene.fog.color.copy(this.skyHor);
    this.scene.fog.near = 1400 - 950 * r; this.scene.fog.far = 5600 - 3300 * r;
    this.scene.background = this.skyHor;
    this.sun.intensity = 2.3 * (1 - 0.8 * r);
    this.hemi.intensity = 0.55 + 0.45 * r;
    this.sunSprite.material.opacity = 1 - r;
    this.mountainMat.opacity = 0.92 * (1 - 0.75 * r);
    for (const m of this.cloudMats) m.color.setScalar(1 - 0.45 * r);
    // wet track: darker, glossy asphalt and kerbs
    this.asphMat.roughness = 0.88 - 0.68 * w;
    if (this.pitLaneMat) { this.pitLaneMat.roughness = 0.85 - 0.65 * w; this.pitLaneMat.color.setScalar(1 - 0.38 * w); }
    if (this.tuftMat) this.tuftMat.color.setScalar(1 - 0.2 * w);
    this.asphMat.color.setScalar(1 - 0.38 * w);
    this.kerbMat.roughness = 0.55 - 0.4 * w;
    this.runMat.color.setScalar(1 - 0.3 * w);
    this.grassMat.color.setScalar(1 - 0.18 * w);
    this.rainNow = r;
    if (force || Math.abs(r - (this.envR == null ? -1 : this.envR)) > 0.2) { this.envR = r; this.makeEnv(); }
  }

  resize() {
    const w = this.e.w || 1, h = this.e.h || 1;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
  }
  setVisible(on) { this.canvas.style.display = on ? '' : 'none'; }

  render(dt) {
    const e = this.e, p = e.player, cam = this.camera;
    this.applyWeather(false);
    const rainLights = e.wet > 0.3 || e.rain > 0.2;
    e.cars.forEach((c, i) => {
      const m = this.carMeshes[i];
      m.position.set(c.x, 0, c.y);
      m.rotation.y = -c.h;
      m.visible = !c.isPlayer || !!c.pitSeq;
      m.position.y = c.isPlayer && this.lift ? this.lift : 0;
      m.userData.shield.visible = c.shield > 0;
      const sp = c.vx * Math.cos(c.h) + c.vy * Math.sin(c.h);
      m.userData.roll += sp * dt;
      for (const wh of m.userData.wheels) wh.g.rotation.z = -m.userData.roll / wh.r;
      if (m.userData.rainLight) m.userData.rainLight.visible = rainLights && Math.sin(e.clock * 12) > 0;
    });
    this.hazMeshes.forEach((m, i) => { const hz = e.hazards[i]; m.visible = !!hz; if (hz) m.position.set(hz.x, 0.5, hz.y); });
    this.shotMeshes.forEach((m, i) => { const s = e.shots[i]; m.visible = !!s; if (s) m.position.set(s.x, 8, s.y); });
    let k = 0;
    for (const pt of e.particles) {
      if (k >= 520) break;
      const ddx = pt.x - p.x, ddy = pt.y - p.y;
      if (ddx * ddx + ddy * ddy < 45 * 45) continue;
      const c = this.col(pt.color);
      this.pPos[k * 3] = pt.x; this.pPos[k * 3 + 1] = 3 + (1 - pt.life / pt.max) * 8; this.pPos[k * 3 + 2] = pt.y;
      this.pCol[k * 3] = c.r; this.pCol[k * 3 + 1] = c.g; this.pCol[k * 3 + 2] = c.b;
      k++;
    }
    this.points.geometry.setDrawRange(0, k);
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.geometry.attributes.color.needsUpdate = true;
    this.startLights.forEach((l, i) => l.material.color.setHex(e.state === 'countdown' && i < e.lights ? 0xff2020 : 0x220000));

    this.updateCrew(dt);
    for (const [i, f] of (this.flags || []).entries()) f.rotation.y = Math.sin(e.clock * 3 + i) * 0.35 + 0.2 * Math.sin(e.clock * 7.3 + i);
    if (this.lensflare) this.lensflare.visible = e.rain < 0.35;
    const cine = !!p.pitSeq && !!this.pit;
    this.cockpit.visible = !cine;
    if (cine !== this.wasCine) { this.wasCine = cine; const rs = document.getElementById('race-screen'); if (rs) rs.classList.toggle('race-cine', cine); }
    if (!cine) this.cineInit = false;

    // driver's-eye camera
    this.camH += angDiff(p.h, this.camH) * Math.min(1, dt * 16);
    const ch = Math.cos(this.camH), sh = Math.sin(this.camH);
    const eye = this.kart ? 13.5 : 9.5;
    const fwd = this.kart ? -1 : 1;
    const shk = e.shake * 2.5;
    const jx = (Math.random() - 0.5) * shk, jy = (Math.random() - 0.5) * shk;
    const spd = Math.hypot(p.vx, p.vy);
    const bump = spd > 30 ? Math.sin(e.clock * 38) * (p.offroad ? 0.6 : 0.12) : 0;
    if (cine) this.pitCamera(dt);
    else {
      cam.position.set(p.x + ch * fwd + jx, eye + jy + bump, p.y + sh * fwd);
      cam.up.set(0, 1, 0);
      cam.lookAt(cam.position.x + ch * 100, eye - 5 + bump, cam.position.z + sh * 100);
      const speedF = clamp(spd / e.tier.baseSpeed, 0, 1.4);
      const hfov = (88 + speedF * 10) * Math.PI / 180;
      cam.fov = clamp(2 * Math.atan(Math.tan(hfov / 2) / cam.aspect) * 180 / Math.PI, 48, 92);
      cam.updateProjectionMatrix();
      this.layoutCockpit();
    }
    this.updateRain(dt);

    this.sky.position.set(cam.position.x, 0, cam.position.z);
    this.clouds.rotation.y = e.clock * 0.002 * (e.wx.wind || 0.3);
    const fx = cine ? p.x : p.x + ch * 180, fz = cine ? p.y : p.y + sh * 180;
    this.sun.target.position.set(fx, 0, fz);
    this.sun.position.set(fx + this.sunDir.x * 800, this.sunDir.y * 800, fz + this.sunDir.z * 800);
    this.renderer.render(this.scene, cam);
  }

  labels(ctx, w, h) {
    const e = this.e, p = e.player, v = this.v;
    ctx.textAlign = 'center';
    for (const c of e.cars) {
      if (c.isPlayer || c.inPit || p.pitSeq) continue;
      const d = Math.hypot(c.x - p.x, c.y - p.y);
      if (d > 650) continue;
      v.set(c.x, this.kart ? 21 : 17, c.y).project(this.camera);
      if (v.z > 1 || v.x < -1.1 || v.x > 1.1 || v.y < -1.1 || v.y > 1.1) continue;
      const x = (v.x + 1) / 2 * w, y = (1 - v.y) / 2 * h;
      ctx.globalAlpha = clamp(1.2 - d / 650, 0.25, 1);
      ctx.font = `700 ${Math.round(clamp(2200 / Math.max(d, 60), 11, 20))}px Rajdhani, sans-serif`;
      ctx.fillStyle = c.isRival ? '#ff4d6d' : '#ffffff';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 3;
      const t = c.isRival ? 'RIVAL ' + c.code : c.code;
      ctx.strokeText(t, x, y); ctx.fillText(t, x, y);
    }
    ctx.globalAlpha = 1;
  }

  destroy() {
    this.scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map) m.map.dispose(); if (m.bumpMap) m.bumpMap.dispose(); m.dispose(); });
    });
    if (this.envRT) this.envRT.dispose();
    if (this.pmrem) this.pmrem.dispose();
    this.renderer.dispose();
    try { this.renderer.forceContextLoss(); } catch (err) { }
    this.canvas.remove();
  }
}
