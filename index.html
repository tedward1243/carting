function codeOf(name) { const parts = name.trim().split(/\s+/); return (parts[parts.length - 1] || 'DRV').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase().padEnd(3, 'X'); }
function xpNeeded(level) { return 200 + level * 60; }
function skillCost(v) { return v < 60 ? 1 : v < 80 ? 2 : 3; }
function tier() { return TIERS[S.tier]; }
function agentMult() { return 1 + 0.25 * (S.perks.agent || 0); }

// Up to 5 careers, one per save slot (slot 0 keeps the original key so old saves still load)
const MAX_SLOTS = 5;
const slotKey = i => i === 0 ? SAVE_KEY : SAVE_KEY + '.slot' + i;
let SLOT = 0;
function save() { if (S) { S.savedAt = Date.now(); Store.save(slotKey(SLOT), S); } }
function loadSave(i = SLOT) { const s = Store.load(slotKey(i)); if (s && s.v === 1 && s.driver) { S = s; SLOT = i; return true; } return false; }
function listSlots() {
  const out = [];
  for (let i = 0; i < MAX_SLOTS; i++) {
    const s = Store.load(slotKey(i));
    out.push(s && s.v === 1 && s.driver ? { i, name: s.driver.name, color: s.driver.color, tier: s.tier, season: s.season, level: s.driver.level, titles: (s.totals && s.totals.titles) || 0, wins: (s.totals && s.totals.wins) || 0, savedAt: s.savedAt || 0 } : null);
  }
  return out;
}
function freeSlot() { return listSlots().findIndex(x => !x); }
function deleteSlot(i) { Store.del(slotKey(i)); if (i === SLOT && S) S = null; }

function randomName(used) {
  for (let i = 0; i < 50; i++) {
    const n = pick(FIRST_NAMES) + ' ' + pick(LAST_NAMES);
    if (!used.has(n)) { used.add(n); return n; }
  }
  return 'Driver ' + randi(10, 99);
}
function statsAround(r, spread = 6) {
  const o = {};
  for (const k of STAT_KEYS) o[k] = clamp(Math.round(r + gauss() * spread), 20, 99);
  return o;
}

/* ---------------- new career ---------------- */
function newCareer(opt) {
  // everyone starts equal: every stat 35, no money, a basic kart
  const bg = { id: null, mods: {}, money: 0, fans: 0 };
  const used = new Set([opt.name]);
  const rivalName = randomName(used);
  S = {
    v: 1, created: Date.now(), id: Math.random().toString(36).slice(2),
    driver: {
      name: opt.name, number: opt.number, nation: opt.nation, color: opt.color, helmet: opt.helmet, bg: bg.id,
      age: 12, stats: opt.stats, xp: 0, level: 1, skillPts: 0, energy: 100, morale: bg.morale || 70, fans: bg.fans, rep: 10
    },
    money: bg.money,
    tier: 0, season: 1,
    kart: { eng: bg.kart || 0, chas: bg.kart || 0, tire: bg.kart || 0 },
    perks: { coach: 0, simrig: 0, trainer: 0, agent: 0 },
    team: null, teamRel: 50, sponsor: null,
    rival: { name: rivalName, code: codeOf(rivalName), nation: pick(NATIONS), color: '#ff4d6d', helmet: '#111111', number: randi(2, 99) },
    buffs: [], flags: {},
    week: null, seasonData: null, lastRace: null, offers: null,
    history: [], trophies: [],
    totals: { starts: 0, wins: 0, podiums: 0, fastest: 0, titles: 0, poles: 0, bestTier: 0 },
    news: [], recentEvents: [],
    settings: Object.assign({ difficulty: 'normal', chaos: false, sound: true }, opt.settings || {})
  };
  startSeason();
  addNews(`${opt.name}, age 12, enters the ${TIERS[0].name}. The road to the Apex starts today.`, 'story');
  addNews(`Meet your rival: ${rivalName}. Same age, same dream, zero friendship.`, 'rival');
  save();
}

function addNews(text, kind = 'info') {
  S.news.unshift({ text, kind, season: S.season, tier: S.tier });
  if (S.news.length > 40) S.news.length = 40;
}

/* ---------------- teams ---------------- */
function genTeams(tierId) {
  const T = TIERS[tierId];
  const n = T.field / 2;
  const teams = shuffle(FORMULA_TEAMS.slice()).slice(0, n);
  teams.forEach((t, i) => { t.car = clamp(0.95 - i * (0.62 / (n - 1)) + rand(-0.05, 0.05), 0.2, 1); });
  return teams.map(t => ({ name: t.name, color: t.color, car: +t.car.toFixed(2) }));
}

/* ---------------- seasons ---------------- */
function startSeason() {
  const T = tier();
  const used = new Set([S.driver.name, S.rival.name]);
  const grid = [];
  const isF = T.vehicle === 'formula';
  let teams = null;
  if (isF) {
    teams = S.nextTeams && S.nextTeams.tier === S.tier ? S.nextTeams.list : genTeams(S.tier);
    if (!S.team) { const sorted = teams.slice().sort((a, b) => a.car - b.car); S.team = Object.assign({}, sorted[0], { salary: T.salary * 0.6 }); }
    const i = teams.findIndex(t => t.name === S.team.name);
    if (i >= 0) teams[i] = { name: S.team.name, color: S.team.color, car: S.team.car };
    else { teams.sort((a, b) => a.car - b.car); teams[0] = { name: S.team.name, color: S.team.color, car: S.team.car }; }
  }
  S.nextTeams = null;

  // The field is built around YOU: a new series is never a walkover. If you arrive better than the
  // series' usual level, the best drivers there are still quicker than you, and the pack sits around you.
  const me = ovr(S.driver.stats);
  const promoted = S.lastTier != null && S.tier > S.lastTier;
  const lo = Math.max(T.ratingMin, me - 7), hi = clamp(Math.max(T.ratingMax, me + (promoted ? 7 : 5)), 20, 98);
  S.lastTier = S.tier;
  // a fresh set of parts and a fresh allowance every season
  S.parts = null; parts(); S.gridPen = 0;
  // rival: always near the top of whatever series you are in
  const rivalRating = clamp(hi - 2 + randi(-1, 2), 20, 98);
  grid.push({ id: 'rival', name: S.rival.name, code: S.rival.code, nation: S.rival.nation, rating: rivalRating, stats: statsAround(rivalRating, 4), color: S.rival.color, helmet: S.rival.helmet, isRival: true });
  for (let i = 0; i < T.field - 2; i++) {
    const name = randomName(used);
    // a few front-runners, a midfield, and some backmarkers
    const r = Math.round(i < 3 ? rand(hi - 4, hi) : rand(lo, hi - 2));
    grid.push({ id: 'ai' + i, name, code: codeOf(name), nation: pick(NATIONS), rating: r, stats: statsAround(r), color: pick(BODY_COLORS), helmet: pick(HELMET_COLORS) });
  }
  // machines / seats
  if (isF) {
    const seats = [];
    for (const t of teams) { if (t.name === S.team.name) seats.push(t); else { seats.push(t); seats.push(t); } }
    seats.sort((a, b) => b.car - a.car);
    const ais = grid.slice().sort((a, b) => (b.rating + gauss() * 6) - (a.rating + gauss() * 6));
    ais.forEach((d, i) => { const t = seats[i]; d.team = t.name; d.teamColor = t.color; d.color = t.color; d.machine = { eng: t.car, chas: t.car, tire: t.car }; });
  } else {
    for (const d of grid) { const m = rand(T.aiMachine[0], T.aiMachine[1]); d.machine = { eng: m, chas: m + rand(-0.05, 0.05), tire: m + rand(-0.05, 0.05) }; }
  }
  const points = { player: 0 };
  grid.forEach(d => points[d.id] = 0);
  const tracks = shuffle(T.tracks.slice());
  while (tracks.length < T.races) tracks.push(pick(T.tracks));
  S.seasonData = { tier: S.tier, tracks: tracks.slice(0, T.races), round: 0, grid, points, wins: {}, podiums: {}, results: [], teams };
  S.sponsor = null;
  S.offers = null;
  S.seasonOver = false;
  S.totals.bestTier = Math.max(S.totals.bestTier, S.tier);
  newWeek(true);
}

function newWeek(first) {
  if (!first) S.driver.energy = clamp(S.driver.energy + 30, 0, 100);
  let event = null;
  if (!first && Math.random() < 0.65) {
    const pool = EVENTS.filter(e => (!e.cond || e.cond(S)) && !S.recentEvents.includes(e.id));
    if (pool.length) { event = pick(pool); S.recentEvents.push(event.id); if (S.recentEvents.length > 6) S.recentEvents.shift(); }
  }
  let sponsorOffer = null;
  const T = tier();
  if (!S.sponsor && (first ? S.driver.fans > 60 : Math.random() < 0.35)) {
    const fansF = clamp(Math.log10(Math.max(10, S.driver.fans)) / 3, 0.5, 2.2);
    sponsorOffer = {
      name: pick(SPONSOR_NAMES),
      perRace: Math.round(T.prize * rand(0.12, 0.25) * fansF * agentMult() / 10) * 10,
      podiumBonus: Math.round(T.prize * rand(0.3, 0.6) / 10) * 10
    };
  }
  S.week = { used: [], event: event ? event.id : null, eventResult: null, sponsorOffer, log: [] };
}

/* ---------------- performance helpers ---------------- */
function playerMachine() {
  const T = tier();
  let m;
  if (T.vehicle === 'formula') { const c = S.team ? S.team.car : 0.3; m = { eng: c, chas: c, tire: c }; }
  else m = { eng: S.kart.eng / 5, chas: S.kart.chas / 5, tire: S.kart.tire / 5 };
  const b = S.buffs.filter(b => b.type === 'machine').reduce((a, b) => a + b.value, 0);
  for (const k in m) m[k] = clamp(m[k] + b, 0, 1.2);
  return m;
}
function playerPerf() {
  const d = S.driver;
  const pb = S.buffs.filter(b => b.type === 'perf').reduce((a, b) => a + b.value, 0);
  return (0.93 + 0.07 * d.energy / 100) * (0.98 + 0.02 * d.morale / 100) * (1 + pb);
}
// this season's parts: how many of each you've used and how many races the fitted one has done
function parts() {
  if (!S.parts) S.parts = { eng: { n: 1, age: 0 }, gbx: { n: 1, age: 0 }, brk: { n: 1, age: 0 } };
  return S.parts;
}
function seasonRaces() { return S.seasonData ? S.seasonData.tracks.length : tier().races; }
// fit a fresh part; returns the grid penalty it costs (0 while inside the allowance)
function fitPart(k) {
  const p = parts()[k];
  p.n++; p.age = 0;
  if (p.n > partAllowance(k, seasonRaces())) { S.gridPen = (S.gridPen || 0) + PARTS[k].pen; return PARTS[k].pen; }
  return 0;
}
// move the player back down a grid order by this race's penalty
function applyGridPen(list, isMe) {
  const n = S.gridPen || 0, i = list.findIndex(isMe);
  if (!n || i < 0) return list;
  const [me] = list.splice(i, 1);
  list.splice(Math.min(list.length, i + n), 0, me);
  return list;
}
function machineAvg(m) { return (m.eng + m.chas + m.tire) / 3; }

function buildRacers() {
  const sd = S.seasonData, T = tier(), d = S.driver;
  const pm = playerMachine();
  const racers = [{
    id: 'player', name: d.name, code: codeOf(d.name), isPlayer: true,
    color: T.vehicle === 'formula' ? S.team.color : d.color, helmet: d.helmet, team: T.vehicle === 'formula' ? S.team.color : null,
    stats: Object.assign({}, d.stats), machine: pm, perf: playerPerf(),
    risk: { eng: partRisk('eng', parts().eng.age), gbx: partRisk('gbx', parts().gbx.age), brk: partRisk('brk', parts().brk.age) }
  }];
  for (const g of sd.grid) {
    racers.push({
      id: g.id, name: g.name, code: g.code, isRival: !!g.isRival, color: g.color, helmet: g.helmet, team: g.teamColor || null,
      stats: g.stats, machine: g.machine, perf: 1,
      risk: { eng: PARTS.eng.base * rand(0.6, 1.6), gbx: PARTS.gbx.base * rand(0.6, 1.6), brk: PARTS.brk.base * rand(0.6, 1.6) }
    });
  }
  // qualifying
  for (const r of racers) r.q = ovr(r.stats) * r.perf + machineAvg(r.machine) * 18 + gauss() * 5 + (r.isPlayer ? 2 : 0);
  racers.sort((a, b) => b.q - a.q);
  return applyGridPen(racers, r => r.isPlayer);
}

function simulateRace(racers) {
  const fails = {};
  for (const r of racers) for (const k in PARTS) if (Math.random() < (r.risk && r.risk[k] != null ? r.risk[k] : PARTS[k].base)) (fails[r.id] = fails[r.id] || []).push(k);
  const scored = racers.map(r => {
    const f = fails[r.id] || [];
    return { r, out: f.includes('eng'), s: ovr(r.stats) * r.perf + machineAvg(r.machine) * 20 + gauss() * 9 - racers.indexOf(r) * 0.4 - (f.includes('gbx') ? 8 : 0) - (f.includes('brk') ? 5 : 0) };
  });
  scored.sort((a, b) => (a.out - b.out) || (b.s - a.s));
  const results = scored.map((x, i) => ({ id: x.r.id, pos: i + 1, finished: !x.out, time: 0, best: 0, grid: racers.indexOf(x.r) + 1, dnf: x.out, fail: x.out ? 'eng' : null }));
  const fl = results[Math.floor(Math.random() * Math.min(4, results.length))].id;
  return { results, fastestLap: fl, simulated: true, fails };
}

/* ---------------- after the race ---------------- */
function applyRaceResult(out) {
  const sd = S.seasonData, T = tier(), d = S.driver;
  const track = sd.tracks[sd.round];
  const field = out.results.length;
  const nameOf = id => id === 'player' ? d.name : (sd.grid.find(g => g.id === id) || {}).name || id;
  const rows = [];
  for (const r of out.results) {
    let pts = r.dnf ? 0 : (POINTS[r.pos - 1] || 0);
    const fl = out.fastestLap === r.id && r.pos <= 10 && !r.dnf;
    if (fl) pts += 1;
    sd.points[r.id] = (sd.points[r.id] || 0) + pts;
    if (r.pos === 1 && !r.dnf) sd.wins[r.id] = (sd.wins[r.id] || 0) + 1;
    if (r.pos <= 3 && !r.dnf) sd.podiums[r.id] = (sd.podiums[r.id] || 0) + 1;
    rows.push({ id: r.id, name: nameOf(r.id), pos: r.pos, pts, fl, time: r.time, best: r.best, grid: r.grid, dnf: r.dnf, pen: r.pen, fail: r.fail });
  }
  const me = out.results.find(r => r.id === 'player');
  const rv = out.results.find(r => r.id === 'rival');
  const pos = me.pos, dnf = !!me.dnf;
  const won = pos === 1 && !dnf, podium = pos <= 3 && !dnf;
  const beatRival = rv && me.pos < rv.pos;
  const gotFL = out.fastestLap === 'player';

  const rewards = [];
  // money
  let money = dnf ? 0 : Math.round(T.prize * (PRIZE_SHARE[pos - 1] || 0.05));
  rewards.push(['Prize money', fmtMoney(money)]);
  if (S.team && T.vehicle === 'formula') { money += S.team.salary; rewards.push(['Team salary', fmtMoney(S.team.salary)]); }
  if (S.sponsor) {
    money += S.sponsor.perRace; rewards.push([S.sponsor.name, fmtMoney(S.sponsor.perRace)]);
    if (podium) { money += S.sponsor.podiumBonus; rewards.push(['Podium bonus', fmtMoney(S.sponsor.podiumBonus)]); }
  }
  S.money += money;

  // xp
  let xp = 60 + (field - pos) * 18;
  if (won) xp += 120; else if (podium) xp += 50;
  if (beatRival) xp += 40;
  if (gotFL) xp += 30;
  if (dnf) xp = 30;
  if (out.simulated) xp = Math.round(xp * 0.75);
  d.xp += xp;
  let levels = 0;
  while (d.xp >= xpNeeded(d.level)) { d.xp -= xpNeeded(d.level); d.level++; d.skillPts += 3; levels++; }

  // fans, morale, rep
  let fans = Math.round(T.fansBase * (field - pos + 1) * (won ? 2 : 1) * agentMult());
  if (dnf) fans = 0;
  let morale = won ? 12 : podium ? 7 : pos > field / 2 ? -5 : 1;
  let rep = won ? 4 : podium ? 2 : 0;
  const notes = [];
  if (S.flags.scout && podium) { rep += 12; notes.push('The scout was impressed. Reputation +12.'); addNews(`Scouts are talking about ${d.name} after a podium at ${track}.`, 'story'); }
  if (S.flags.boldWin) {
    if (won) { fans *= 2; morale += 10; notes.push('You called the win — and delivered. Fans doubled!'); }
    else { morale -= 10; fans = Math.round(fans * 0.5); rep -= 3; notes.push('Your win prediction backfired. Morale hit.'); }
  }
  if (S.flags.rivalHeat) {
    if (beatRival) { morale += 10; fans += Math.round(T.fansBase * 6); notes.push(`You backed up the talk against ${S.rival.name}.`); }
    else { morale -= 6; notes.push(`${S.rival.name} got the last laugh this time.`); }
  }
  d.fans += fans;
  d.morale = clamp(d.morale + morale, 0, 100);
  d.rep = clamp(d.rep + rep, 0, 100);
  d.energy = clamp(d.energy - 15, 0, 100);
  rewards.push(['XP', '+' + xp], ['Fans', '+' + fmtNum(fans)]);

  // totals
  S.totals.starts++;
  if (won) S.totals.wins++;
  if (podium) S.totals.podiums++;
  if (gotFL) S.totals.fastest++;
  if (me.grid === 1) S.totals.poles++;

  // buffs/flags expire
  S.buffs.forEach(b => b.races--);
  S.buffs = S.buffs.filter(b => b.races > 0);
  S.flags = {};

  // headline
  let hl;
  if (dnf) hl = `${d.name} retires from the ${track} race. A weekend to forget.`;
  else if (won) hl = pick([`${d.name} storms to victory at ${track}!`, `Unstoppable! ${d.name} wins at ${track}.`, `${d.name} takes the chequered flag first at ${track}.`]);
  else if (podium) hl = `${d.name} grabs P${pos} and a podium at ${track}.`;
  else if (pos <= field / 2) hl = `Solid points for ${d.name}: P${pos} at ${track}.`;
  else hl = `Tough day for ${d.name}, P${pos} at ${track}.`;
  addNews(hl, won ? 'win' : podium ? 'podium' : 'race');
  if (rv) {
    if (beatRival) addNews(`${d.name} finishes ahead of rival ${S.rival.name} (P${rv.pos}).`, 'rival');
    else if (rv.pos === 1) addNews(`${S.rival.name} wins at ${track}. Your rival is not slowing down.`, 'rival');
  }

  sd.results.push({ track, rows });
  sd.round++;
  // the other drivers keep improving through the season too
  for (const g of sd.grid) {
    for (const k of STAT_KEYS) if (Math.random() < 0.35) g.stats[k] = clamp(g.stats[k] + 1, 20, 99);
    g.rating = ovr(g.stats);
  }
  if (S.team && T.vehicle === 'formula' && sd.teams) {
    // rival teams bring upgrades during the year
    for (const g of sd.grid) if (g.machine) { const up = Math.random() * 0.012; g.machine.eng += up; g.machine.chas += up; g.machine.tire += up; }
  }
  // parts: everything fitted did one more race; anything that broke is replaced (maybe over the allowance)
  S.gridPen = 0; // this race's penalty has been served
  for (const k in PARTS) parts()[k].age++;
  for (const k of ((out.fails && out.fails.player) || [])) {
    if (!PARTS[k]) { if (k === 'pun') notes.push('You had a puncture. Tyres past their life and running off the track make them likelier.'); continue; }
    const pen = fitPart(k);
    notes.push(`${PARTS[k].name} failed. A new one is fitted (${parts()[k].n} of ${partAllowance(k, seasonRaces())} this season)${pen ? ` - that's over the allowance: ${pen}-place grid penalty at the next race.` : '.'}`);
  }
  S.lastRace = { track, round: sd.round, rows, pos, rewards, notes, levels, beatRival, rivalPos: rv ? rv.pos : null, simulated: !!out.simulated, fastest: out.fastestLap, dnf };
  if (sd.round >= T.races) { S.seasonOver = true; prepareSeasonEnd(); }
  else newWeek(false);
  save();
}

function standings() {
  const sd = S.seasonData;
  const rows = [{ id: 'player', name: S.driver.name, code: codeOf(S.driver.name), team: S.team ? S.team.name : null, teamColor: S.team ? S.team.color : S.driver.color, isPlayer: true }]
    .concat(sd.grid.map(g => ({ id: g.id, name: g.name, code: g.code, team: g.team || null, teamColor: g.teamColor || g.color, isRival: g.isRival, rating: g.rating })));
  rows.forEach(r => { r.pts = sd.points[r.id] || 0; r.wins = sd.wins[r.id] || 0; r.podiums = sd.podiums[r.id] || 0; });
  rows.sort((a, b) => b.pts - a.pts || b.wins - a.wins || b.podiums - a.podiums);
  rows.forEach((r, i) => r.pos = i + 1);
  return rows;
}

/* ---------------- season end ---------------- */
function prepareSeasonEnd() {
  const T = tier();
  const st = standings();
  const me = st.find(r => r.isPlayer);
  const rv = st.find(r => r.isRival);
  const champ = me.pos === 1;
  S.history.push({ season: S.season, age: S.driver.age, tier: S.tier, tierName: T.name, pos: me.pos, pts: me.pts, wins: me.wins, podiums: me.podiums, team: S.team ? S.team.name : null, rivalPos: rv ? rv.pos : null });
  if (champ) {
    S.trophies.push({ name: T.name + ' Champion', season: S.season, tier: S.tier });
    S.totals.titles++;
    S.driver.fans += T.fansBase * 60;
    S.driver.rep = clamp(S.driver.rep + 15, 0, 100);
    addNews(`CHAMPION! ${S.driver.name} wins the ${T.name} title!`, 'win');
  } else addNews(`${S.driver.name} finishes the ${T.name} season P${me.pos}. ${rv && rv.pos < me.pos ? S.rival.name + ' ends up ahead (P' + rv.pos + ').' : ''}`, 'story');
  const bonus = Math.round(T.prize * [3, 2, 1.5, 1, 0.6][me.pos - 1] || 0);
  if (bonus) { S.money += bonus; }
  S.seasonEnd = { pos: me.pos, pts: me.pts, champ, bonus, standings: st.slice(0, 12), rivalPos: rv ? rv.pos : null, tierName: T.name };
  S.offers = makeOffers(me.pos);
}

function makeOffers(pos) {
  const t = S.tier, T = TIERS[t], d = S.driver;
  const next = t + 1 < TIERS.length ? t + 1 : null;
  const offers = [];
  const wildcard = pos <= 5 && (d.rep >= 45 || d.fans >= T.fansBase * 350);
  const promote = next !== null && (pos <= 3 || wildcard);
  if (promote) {
    const NT = TIERS[next];
    if (NT.vehicle === 'formula') {
      const teams = genTeams(next).sort((a, b) => b.car - a.car);
      S.pendingTeams = { [next]: teams };
      const range = pos === 1 ? [0, 2] : pos <= 3 ? [1, 4] : [3, 5];
      const cands = shuffle(teams.slice(range[0], range[1] + 1)).slice(0, pos <= 3 ? 2 : 1);
      for (const tm of cands) offers.push({ type: 'promote', tier: next, team: tm, salary: Math.round(NT.salary * (0.6 + tm.car * 0.8) / 100) * 100, label: `${tm.name} (${NT.name})`, wild: pos > 3 });
    } else {
      offers.push({ type: 'promote', tier: next, team: null, label: `Move up to the ${NT.name}`, wild: pos > 3 });
    }
  }
  // stay in current series
  if (T.vehicle === 'formula') {
    const teams = genTeams(t).sort((a, b) => b.car - a.car);
    S.pendingTeams = Object.assign(S.pendingTeams || {}, { [t]: teams });
    const cur = teams.find(x => x.name === S.team.name) || Object.assign({}, S.team);
    const idx = clamp(Math.floor((pos - 1) / 2), 0, teams.length - 1);
    const better = teams[clamp(idx - 1, 0, teams.length - 1)];
    const stay = [cur];
    if (better && better.name !== cur.name && better.car > cur.car) stay.push(better);
    for (const tm of stay) offers.push({ type: 'stay', tier: t, team: tm, salary: Math.round(T.salary * (0.6 + tm.car * 0.8) / 100) * 100, label: tm.name === S.team.name ? `Re-sign with ${tm.name}` : `Switch to ${tm.name}`, });
  } else {
    offers.push({ type: 'stay', tier: t, team: null, label: `Another season in the ${T.name}` });
  }
  if (d.age >= 34) offers.push({ type: 'retire', label: 'Retire and enter the Hall of Fame' });
  return offers;
}

function acceptOffer(i) {
  const o = S.offers[i];
  if (o.type === 'retire') return 'retire';
  const prevTier = S.tier;
  S.tier = o.tier;
  if (o.team) {
    S.team = { name: o.team.name, color: o.team.color, car: o.team.car, salary: o.salary };
    const list = (S.pendingTeams || {})[o.tier];
    if (list) S.nextTeams = { tier: o.tier, list };
  } else if (TIERS[o.tier].vehicle === 'kart') S.team = null;
  S.pendingTeams = null;
  S.season++;
  S.driver.age++;
  S.driver.energy = 100;
  S.driver.morale = clamp(S.driver.morale + 10, 0, 100);
  if (S.tier > prevTier) {
    addNews(`PROMOTED! ${S.driver.name} moves up to the ${TIERS[S.tier].name}${o.team ? ' with ' + o.team.name : ''}.`, 'win');
    addNews(`${S.rival.name} also steps up to the ${TIERS[S.tier].name}. The rivalry continues.`, 'rival');
  } else addNews(`${S.driver.name} commits to another season in the ${TIERS[S.tier].name}.`, 'story');
  S.seasonEnd = null;
  S.lastRace = null;
  startSeason();
  if (S.driver.age >= 40) { save(); return 'retire'; }
  save();
  return 'ok';
}

/* ---------------- week planner ---------------- */
function trainGain(v, perkLvl) {
  let base = v < 50 ? 2 : v < 70 ? 1.5 : v < 85 ? 1 : 0.55;
  base += perkLvl * 0.45;
  return Math.max(v >= 99 ? 0 : 0, Math.floor(base + Math.random()));
}

function doWeekAction(id) {
  const a = WEEK_ACTIONS.find(x => x.id === id);
  const d = S.driver, T = tier();
  if (S.week.used.length >= 3) return { ok: false, msg: 'No more time this week.' };
  if (a.energy > 0 && d.energy < a.energy) return { ok: false, msg: 'Too tired for that. Try a Rest Day.' };
  d.energy = clamp(d.energy - a.energy, 0, 100);
  let text = '';
  if (a.stats.length) {
    const k = pick(a.stats);
    const g = Math.min(99 - d.stats[k], trainGain(d.stats[k], S.perks[a.perk] || 0));
    d.stats[k] += g;
    d.xp += 10;
    text = g > 0 ? `${STAT_INFO[k].name} +${g}` : `${STAT_INFO[k].name} — no gain this time`;
  } else if (id === 'media') {
    const f = Math.round(T.fansBase * rand(3, 6) * agentMult());
    const m = Math.round(T.prize * 0.12 / 10) * 10;
    d.fans += f; S.money += m; d.morale = clamp(d.morale + 2, 0, 100);
    text = `+${fmtNum(f)} fans, +${fmtMoney(m)}`;
  } else if (id === 'rest') {
    d.morale = clamp(d.morale + 6, 0, 100);
    text = 'Energy restored, morale +6';
  }
  while (d.xp >= xpNeeded(d.level)) { d.xp -= xpNeeded(d.level); d.level++; d.skillPts += 3; text += ' • LEVEL UP!'; }
  S.week.used.push({ id, text });
  save();
  return { ok: true, msg: `${a.name}: ${text}` };
}

function fill(str) { return str.replace(/\{rival\}/g, S.rival.name).replace(/\{name\}/g, S.driver.name); }

function resolveEvent(choiceIdx) {
  const ev = EVENTS.find(e => e.id === S.week.event);
  if (!ev) return;
  const ch = ev.choices[choiceIdx];
  applyFx(ch.fx);
  S.week.eventResult = fill(ch.result);
  S.week.event = null;
  save();
  return S.week.eventResult;
}

function applyFx(fx) {
  const d = S.driver;
  if (fx.energy) d.energy = clamp(d.energy + fx.energy, 0, 100);
  if (fx.morale) d.morale = clamp(d.morale + fx.morale, 0, 100);
  if (fx.rep) d.rep = clamp(d.rep + fx.rep, 0, 100);
  if (fx.fans) d.fans += Math.round(fx.fans * Math.max(1, tier().fansBase / 8) * agentMult());
  if (fx.money) S.money = Math.max(0, S.money + fx.money * (fx.money > 0 ? Math.max(1, tier().prize / 700) : 1));
  if (fx.moneyPct) S.money = Math.max(0, S.money - Math.max(fx.moneyMin || 0, S.money * -fx.moneyPct));
  if (fx.stats) for (const k in fx.stats) d.stats[k] = clamp(d.stats[k] + fx.stats[k], 1, 99);
  if (fx.buff) S.buffs.push(Object.assign({}, fx.buff));
  if (fx.flag) S.flags[fx.flag] = true;
  if (fx.teamRel) S.teamRel = clamp(S.teamRel + fx.teamRel, 0, 100);
  if (fx.kartUp) { const parts = ['eng', 'chas', 'tire'].filter(p => S.kart[p] < 5); if (parts.length) S.kart[pick(parts)]++; }
}

function acceptSponsor(yes) {
  const o = S.week.sponsorOffer;
  if (!o) return;
  if (yes) { S.sponsor = o; addNews(`${S.driver.name} signs a sponsorship deal with ${o.name}.`, 'story'); }
  S.week.sponsorOffer = null;
  save();
}

/* ---------------- shop ---------------- */
function kartUpgradeCost(part) {
  const lvl = S.kart[part];
  if (lvl >= 5) return null;
  return Math.round(200 * Math.pow(1.85, lvl) * (tier().upgradeMult || 1) / 10) * 10;
}
function buyKartUpgrade(part) {
  const c = kartUpgradeCost(part);
  if (c === null || S.money < c) return false;
  S.money -= c; S.kart[part]++; save(); return true;
}
function perkCost(id) { const p = PERKS.find(x => x.id === id); const l = S.perks[id] || 0; return l >= 3 ? null : p.cost[l]; }
function buyPerk(id) {
  const c = perkCost(id);
  if (c === null || S.money < c) return false;
  S.money -= c; S.perks[id] = (S.perks[id] || 0) + 1; save(); return true;
}
function spendSkill(k) {
  const d = S.driver;
  const c = skillCost(d.stats[k]);
  if (d.skillPts < c || d.stats[k] >= 99) return false;
  d.skillPts -= c; d.stats[k]++; save(); return true;
}

/* ---------------- retirement ---------------- */
function legacyScore() {
  const t = S.totals;
  return t.titles * 120 + t.wins * 12 + t.podiums * 4 + t.fastest * 2 + S.totals.bestTier * 60 + Math.round(Math.log10(Math.max(10, S.driver.fans)) * 20);
}
function retire() {
  const hof = Store.load(HOF_KEY) || [];
  const apexTitles = S.trophies.filter(t => t.tier === 6).length;
  hof.push({
    name: S.driver.name, number: S.driver.number, nation: S.driver.nation, color: S.driver.color,
    seasons: S.history.length, titles: S.totals.titles, apexTitles, wins: S.totals.wins, podiums: S.totals.podiums,
    bestTier: S.totals.bestTier, score: legacyScore(), date: Date.now()
  });
  hof.sort((a, b) => b.score - a.score);
  Store.save(HOF_KEY, hof.slice(0, 20));
  const summary = { name: S.driver.name, totals: Object.assign({}, S.totals), trophies: S.trophies.slice(), score: legacyScore(), history: S.history.slice(), apexTitles };
  Store.del(slotKey(SLOT));
  S = null;
  return summary;
}

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const g = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.08)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const isKart = vehicle === 'kart';
  const car = { x: 0, y: 0, h: -Math.PI / 2, len: isKart ? 28 : 40, wid: 18, color, helmet: helmetCol, team: teamColor, shield: 0, slow: 0 };
  ctx.save();
  ctx.translate(w / 2, h / 2);
  const sc = Math.min(w, h) / (isKart ? 40 : 52);
  ctx.scale(sc, sc);
  RaceEngine.prototype.drawCar.call({ isKart, clock: 0 }, ctx, car);

}

/* ---------- action dispatcher ---------- */

document.addEventListener('click', e => {

ACTIONS['c-color'] = a => { UI.create.color = a; renderCreate(); };
ACTIONS['c-helmet'] = a => { UI.create.helmet = a; renderCreate(); };
ACTIONS['c-diff'] = a => { UI.create.difficulty = a; renderCreate(); };

// dominant hand: decides which side the gas / brake slider sits on
function getHand() { if (typeof S !== 'undefined' && S && S.settings && S.settings.hand) return S.settings.hand; try { return localStorage.getItem('k2c.hand') || 'right'; } catch (e) { return 'right'; } }
function setHand(h) { try { localStorage.setItem('k2c.hand', h); } catch (e) { } }
function applyHand() { const tc = $('#touch-controls'), h = getHand(); tc.classList.toggle('hand-left', h === 'left'); tc.classList.toggle('hand-right', h !== 'left'); return h; }

/* ============================================================
   Hub
   ============================================================ */
const TAB_LIST = [['home', 'Home'], ['driver', 'Driver'], ['garage', 'Garage'], ['standings', 'Standings'], ['career', 'Career'], ['settings', 'Settings']];
function renderHub() {
  hideRace();
  const fns = { home: tabHome, driver: tabDriver, garage: tabGarage, standings: tabStandings, career: tabCareer, settings: tabSettings };
  appEl.innerHTML = topbar() + `<main class="page">${fns[UI.tab]()}</main>`;
  drawPreviews();
  const kp = $('#garage-preview');
  if (kp) { const T = tier(); drawKartPreview(kp, T.vehicle === 'formula' ? S.team.color : S.driver.color, S.driver.helmet, T.vehicle, T.vehicle === 'formula' ? S.team.color : null); }
}
ACTIONS['tab'] = t => { UI.tab = t; renderHub(); window.scrollTo(0, 0); };

function topbar() {
  const d = S.driver, T = tier();
  const dots = { home: !!(S.week && (S.week.event || S.week.sponsorOffer)) || S.seasonOver, driver: d.skillPts > 0 };
  return `
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand" data-act="menu" title="Main menu">K<span>2</span>C</div>
      <div class="driver-chip">
        ${helmet(d.helmet, d.number)}
        <div><div class="nm">${esc(d.name)}</div><div class="sub">Age ${d.age} • Lvl ${d.level} • OVR ${ovr(d.stats)} • ${esc(d.nation)}</div></div>
      </div>
      <div class="top-stats">
        <div class="tstat"><b>${tierBadge(S.tier)}</b><small>S${S.season}</small></div>
        <div class="tstat"><b>${fmtMoney(S.money)}</b><small>Money</small></div>
        <div class="tstat"><b>${fmtNum(d.fans)}</b><small>Fans</small></div>
        <div class="tstat"><b>${Math.round(d.energy)}</b><small>Energy</small>${meter(d.energy, energyColor(d.energy))}</div>
        <div class="tstat"><b>${Math.round(d.morale)}</b><small>Morale</small>${meter(d.morale, 'var(--blue)')}</div>
      </div>
    </div>
    <nav class="tabs">${TAB_LIST.map(([id, nm]) => `<button class="tab ${UI.tab === id ? 'active' : ''}" data-act="tab" data-arg="${id}">${nm}${dots[id] ? '<span class="dot"></span>' : ''}</button>`).join('')}</nav>
  </div>`;
}

/* ---------- Home ---------- */
function tabHome() {
  const sd = S.seasonData, T = tier();
  if (S.seasonOver) {
    return `<div class="card result-hero">
      <div class="trophy">${S.seasonEnd && S.seasonEnd.champ ? '🏆' : '🏁'}</div>
      <h2 style="font-size:34px">Season ${S.season} complete</h2>
      <p class="muted">You finished <b style="color:#fff">P${S.seasonEnd ? S.seasonEnd.pos : '?'}</b> in the ${T.name}. Teams are calling.</p>
      <button class="btn primary big" data-act="season-end">Season review & offers</button></div>`;
  }
  const track = sd.tracks[sd.round];
  const ev = S.week.event ? EVENTS.find(e => e.id === S.week.event) : null;
  const items = T.items || S.settings.chaos;
  const perf = Math.round(playerPerf() * 100);
  const st = standings();
  const me = st.find(r => r.isPlayer);
  const buffs = S.buffs.map(b => `${b.type === 'machine' ? 'Machine' : 'Performance'} ${b.value > 0 ? '+' : ''}${Math.round(b.value * 100)}%`);
  const flags = Object.keys(S.flags).map(f => ({ scout: '👀 Scout watching', boldWin: '🎤 Promised a win', rivalHeat: '🔥 Rivalry heated' }[f])).filter(Boolean);

  const left = `
    <div class="card next-race">
      <div class="round">ROUND ${sd.round + 1} OF ${T.races} &nbsp;${tierBadge(S.tier)}</div>
      <h2>${esc(track)}</h2>
      <div class="next-race-body">
        <div>
          <div class="race-meta"><span><b>${raceLaps(track, T)}</b> laps (~10 min)</span><span><b>${T.field}</b> drivers</span><span>${raceStops(track) === 2 ? "<b>2</b> pit stops" : "<b>1</b> pit stop"}</span><span>${T.cls}</span><span>Slipstream racing</span></div>
          <div class="race-meta"><span>Race-day form <b class="${perf >= 98 ? 'good' : perf < 95 ? 'bad' : ''}">${perf}%</b></span></div>
          ${buffs.concat(flags).length ? `<div class="race-meta">${buffs.concat(flags).map(x => `<span>${x}</span>`).join('')}</div>` : ''}
          ${S.gridPen ? `<p class="bad small" style="margin:0 0 10px"><b>Grid penalty: ${S.gridPen} places</b> at this race (parts over the season allowance).</p>` : ''}
          ${ev ? `<p class="gold small" style="margin:0 0 10px">Make a decision on this week's event before you race.</p>` : ''}
          <div class="btn-row">
            <button class="btn primary big" data-act="race" ${ev ? 'disabled' : ''}>🏁 Race</button>
          </div>
        </div>
        <canvas class="track-preview" data-track="${esc(track)}" data-tier="${S.tier}"></canvas>
      </div>
    </div>
    ${ev ? eventCard(ev) : ''}
    ${S.week.eventResult ? `<div class="card"><span class="muted small">THIS WEEK</span><p style="margin:4px 0 0">${esc(S.week.eventResult)}</p></div>` : ''}
    ${S.week.sponsorOffer ? sponsorCard(S.week.sponsorOffer) : ''}
    ${plannerCard()}`;

  const right = `
    ${rivalCard()}
    <div class="card">
      <h3>Paddock news</h3>
      <ul class="news">${S.news.slice(0, 7).map(n => `<li class="${n.kind}">${esc(n.text)}</li>`).join('')}</ul>
    </div>`;
  return `<div class="grid2"><div class="stack">${left}</div><div class="stack">${right}</div></div>`;
}

function eventCard(ev) {
  return `<div class="card event-card">
    <div class="tagline-s">DECISION</div>
    <h3>${esc(ev.title)}</h3>
    <p>${esc(fill(ev.text))}</p>
    <div class="choices">${ev.choices.map((c, i) => `<button class="btn" data-act="event" data-arg="${i}">${esc(fill(c.label))}</button>`).join('')}</div>
  </div>`;
}
ACTIONS['event'] = i => { const r = resolveEvent(+i); toast(r); renderHub(); };

function sponsorCard(o) {
  return `<div class="card" style="border-color:rgba(76,201,240,0.4)">
    <div class="tagline-s" style="font-family:var(--head);font-weight:700;color:var(--blue);letter-spacing:.1em;font-size:13px">SPONSOR OFFER</div>
    <h3>${esc(o.name)}</h3>
    <p class="muted" style="margin:4px 0 12px">${fmtMoney(o.perRace)} every race + ${fmtMoney(o.podiumBonus)} for each podium, until the end of the season.</p>
    <div class="btn-row"><button class="btn primary" data-act="sponsor" data-arg="1">Sign deal</button><button class="btn" data-act="sponsor" data-arg="0">Decline</button></div>
  </div>`;
}
ACTIONS['sponsor'] = a => { acceptSponsor(a === '1'); toast(a === '1' ? 'Deal signed!' : 'Offer declined.', a === '1' ? 'good' : ''); renderHub(); };

function plannerCard() {
  const used = S.week.used;
  const d = S.driver;
  const slots = [0, 1, 2].map(i => {
    const u = used[i];
    if (!u) return `<div class="slot">Free slot</div>`;
    const a = WEEK_ACTIONS.find(x => x.id === u.id);
    return `<div class="slot filled"><span class="s-name">${a.icon} ${a.name}</span><span class="small">${esc(u.text)}</span></div>`;
  }).join('');
  const full = used.length >= 3;
  return `<div class="card">
    <div class="card-title"><h3>Week planner</h3><span class="muted small">Energy <b style="color:${energyColor(d.energy)}">${Math.round(d.energy)}</b>/100</span></div>
    <div class="slots">${slots}</div>
    <div class="actions">${WEEK_ACTIONS.map(a => {
      const cant = full || (a.energy > 0 && d.energy < a.energy);
      const perk = a.perk && S.perks[a.perk] ? ` • Perk Lv${S.perks[a.perk]}` : '';
      return `<button class="action" data-act="week" data-arg="${a.id}" ${cant ? 'disabled' : ''}>
        <div class="a-top"><span>${a.icon} ${a.name}</span><span class="energy-cost ${a.energy < 0 ? 'gain' : ''}">${a.energy < 0 ? '+' + (-a.energy) : '−' + a.energy}⚡</span></div>
        <div class="a-desc">${a.desc}${perk}</div></button>`;
    }).join('')}</div>
    <p class="muted small" style="margin:10px 0 0">Up to 3 activities per week. Low energy hurts race-day pace, so balance training and rest.</p>
  </div>`;
}
ACTIONS['week'] = id => { const r = doWeekAction(id); toast(r.msg, r.ok ? 'good' : 'bad'); renderHub(); };

function rivalCard() {
  const sd = S.seasonData;
  const rv = sd.grid.find(g => g.isRival);
  let me = 0, them = 0;
  for (const r of sd.results) {
    const a = r.rows.find(x => x.id === 'player'), b = r.rows.find(x => x.id === 'rival');
    if (a && b) a.pos < b.pos ? me++ : them++;
  }
  return `<div class="card" style="border-color:rgba(255,77,109,0.35)">
    <div class="card-title"><h3>Rival</h3><span class="tag rival">NEMESIS</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      ${helmet(S.rival.helmet, S.rival.number, 46)}
      <div style="flex:1"><div style="font-family:var(--head);font-weight:700;font-size:20px">${esc(S.rival.name)}</div>
      <div class="muted small">${esc(S.rival.nation)} • OVR ${rv ? ovr(rv.stats) : '?'}${rv && rv.team ? ' • ' + esc(rv.team) : ''}</div></div>
      <div style="text-align:right"><div style="font-family:var(--head);font-weight:700;font-size:26px">${me}–${them}</div><div class="muted small">head-to-head</div></div>
    </div>
  </div>`;
}

function miniStandings(st) {
  const top = st.slice(0, 6);
  const me = st.find(r => r.isPlayer);
  if (!top.includes(me)) top.push(me);
  return `<table><tbody>${top.map(r => `<tr class="${r.isPlayer ? 'me' : r.isRival ? 'rival' : ''}">
    <td class="pos">${r.pos}</td><td><span class="swatch" style="background:${r.teamColor}"></span>${esc(r.name)}${r.isRival ? '<span class="tag rival">RIVAL</span>' : ''}</td><td style="text-align:right"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table>`;
}

/* ---------- Driver ---------- */
function tabDriver() {
  const d = S.driver;
  const need = xpNeeded(d.level);
  const bg = BACKGROUNDS.find(b => b.id === d.bg);
  return `<div class="grid2">
    <div class="card">
      <div class="card-title"><h3>Skills</h3><span class="${d.skillPts ? 'gold' : 'muted'}"><b>${d.skillPts}</b> skill points</span></div>
      ${STAT_KEYS.map(k => {
        const v = d.stats[k], c = skillCost(v);
        return `<div class="stat-row">
          <div class="nm">${STAT_INFO[k].name}<small>${STAT_INFO[k].desc}</small></div>
          <div class="bar"><i style="width:${v}%"></i></div>
          <div class="stat-val">${v}</div>
          <button class="btn sm plus" data-act="skill" data-arg="${k}" ${d.skillPts < c || v >= 99 ? 'disabled' : ''} title="Costs ${c} point${c > 1 ? 's' : ''}">+${c > 1 ? '<small style="font-size:10px">' + c + '</small>' : ''}</button>
        </div>`;
      }).join('')}
      <p class="muted small" style="margin:12px 0 0">Earn XP from races and training. Each level gives 3 skill points. Higher skills cost more points (1 under 60, 2 under 80, 3 above).</p>
    </div>
    <div class="stack">
      <div class="card" style="text-align:center">
        ${helmet(d.helmet, d.number, 72).replace('class="helmet"', 'class="helmet" style="margin:0 auto"')}
        <h2 style="margin-top:10px">${esc(d.name)}</h2>
        <div class="muted">${esc(d.nation)} • Age ${d.age} • ${bg ? bg.name : ''}</div>
        <div class="ovr-big" style="margin-top:12px">${ovr(d.stats)}</div><div class="muted small">OVERALL</div>
        <div style="margin-top:14px;text-align:left"><div class="muted small">Level ${d.level} — ${d.xp}/${need} XP</div><div class="bar" style="margin-top:4px"><i style="width:${d.xp / need * 100}%;background:linear-gradient(90deg,#ffd166,#ff7a3b)"></i></div></div>
      </div>
      <div class="card"><div class="kv">
        <div><small>Fans</small><b>${fmtNum(d.fans)}</b></div>
        <div><small>Reputation</small><b>${Math.round(d.rep)}</b></div>
        <div><small>Morale</small><b>${Math.round(d.morale)}</b></div>
        <div><small>Energy</small><b>${Math.round(d.energy)}</b></div>
      </div></div>
    </div>
  </div>`;
}
ACTIONS['skill'] = k => { if (spendSkill(k)) renderHub(); };

/* ---------- Garage ---------- */
function tabGarage() {
  const T = tier();
  let machine = '';
  if (T.vehicle === 'kart') {
    machine = `<div class="card">
      <div class="card-title"><h3>Your kart</h3><span class="muted small">${T.cls}</span></div>
      <canvas id="garage-preview" style="width:100%;height:160px;display:block"></canvas>
      ${KART_PARTS.map(p => {
        const lvl = S.kart[p.id], cost = kartUpgradeCost(p.id);
        return `<div class="part"><div><b>${p.name}</b> <span class="muted small">— ${p.desc}</span>
          <div class="pips">${[0, 1, 2, 3, 4].map(i => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</div></div>
          ${cost === null ? '<span class="good small"><b>MAXED</b></span>' : `<button class="btn sm ${S.money >= cost ? 'gold' : ''}" data-act="kart-up" data-arg="${p.id}" ${S.money < cost ? 'disabled' : ''}>${fmtMoney(cost)}</button>`}
        </div>`;
      }).join('')}
      <p class="muted small" style="margin:10px 0 0">Kart upgrades carry through the karting tiers. Once you reach formula cars, your team provides the car.</p>
    </div>`;
  } else {
    const sd = S.seasonData;
    const mate = sd.grid.find(g => g.team === S.team.name);
    machine = `<div class="card">
      <div class="card-title"><h3>${esc(S.team.name)}</h3><span class="swatch" style="background:${S.team.color};width:30px"></span></div>
      <canvas id="garage-preview" style="width:100%;height:160px;display:block"></canvas>
      <div class="kv" style="margin-top:10px">
        <div><small>Car rating</small><b>${Math.round(S.team.car * 100)}</b></div>
        <div><small>Salary / race</small><b>${fmtMoney(S.team.salary)}</b></div>
        <div><small>Teammate</small><b style="font-size:16px">${mate ? esc(mate.name) : '—'}</b></div>
        <div><small>Team relationship</small><b>${S.teamRel}</b></div>
      </div>
      <p class="muted small" style="margin:10px 0 0">Better results earn offers from faster teams at the end of the season.</p>
    </div>`;
  }
  const pcard = `<div class="card">
    <div class="card-title"><h3>Parts</h3>${S.gridPen ? `<span class="bad small"><b>${S.gridPen}-place grid penalty next race</b></span>` : ''}</div>
    ${Object.keys(PARTS).map(k => {
      const P = PARTS[k], p = parts()[k], allow = partAllowance(k, seasonRaces()), risk = partRisk(k, p.age), over = p.n >= allow;
      return `<div class="part"><div><b>${P.name}</b> <span class="muted small">— ${p.n} of ${allow} used this season • ${p.age} race${p.age === 1 ? '' : 's'} on it (lasts about ${P.life})</span>
        <div class="small ${risk > P.base * 2 ? 'bad' : risk > P.base * 1.3 ? 'gold' : 'good'}">Failure risk next race: ${(risk * 100).toFixed(1)}%</div></div>
        <button class="btn sm ${over ? '' : 'gold'}" data-act="part-new" data-arg="${k}" ${p.age === 0 ? 'disabled' : ''}>${over ? `New (+${P.pen} grid)` : 'Fit new'}</button></div>`;
    }).join('')}
    <p class="muted small" style="margin:10px 0 0">Parts wear out race by race and get likelier to fail past their life. You get a small allowance each season: going over it, by choice or because one broke, costs grid places at the next race. Tyres can also puncture, mostly when worn out or after running off the track.</p>
  </div>`;
  const perks = `<div class="card">
    <h3>Support staff & perks</h3>
    ${PERKS.map(p => {
      const lvl = S.perks[p.id] || 0, cost = perkCost(p.id);
      return `<div class="part"><div><b>${p.name}</b> <span class="muted small">— ${p.desc}</span>
        <div class="pips">${[0, 1, 2].map(i => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</div></div>
        ${cost === null ? '<span class="good small"><b>MAXED</b></span>' : `<button class="btn sm ${S.money >= cost ? 'gold' : ''}" data-act="perk" data-arg="${p.id}" ${S.money < cost ? 'disabled' : ''}>${fmtMoney(cost)}</button>`}
      </div>`;
    }).join('')}
  </div>`;
  const sp = S.sponsor ? `<div class="card"><h3>Sponsor</h3><p style="margin:0"><b>${esc(S.sponsor.name)}</b> — ${fmtMoney(S.sponsor.perRace)} per race, ${fmtMoney(S.sponsor.podiumBonus)} podium bonus.</p></div>`
    : `<div class="card"><h3>Sponsor</h3><p class="muted" style="margin:0">No sponsor yet. More fans means more (and bigger) offers.</p></div>`;
  return `<div class="grid2"><div class="stack">${machine}${pcard}</div><div class="stack">${perks}${sp}</div></div>`;
}
ACTIONS['part-new'] = k => {
  if (!PARTS[k]) return;
  const P = PARTS[k], over = parts()[k].n >= partAllowance(k, seasonRaces());
  const go = () => { const pen = fitPart(k); save(); toast(pen ? `New ${P.name.toLowerCase()} fitted: ${pen}-place grid penalty next race` : `New ${P.name.toLowerCase()} fitted`, pen ? 'bad' : 'good'); renderHub(); };
  if (over) confirmModal(`Fit a new ${P.name.toLowerCase()}?`, `You've used your allowance this season. A new one costs a ${P.pen}-place grid penalty at the next race.`, 'Fit it', go, true);
  else go();
};
ACTIONS['kart-up'] = p => { if (buyKartUpgrade(p)) { toast('Upgrade installed!', 'good'); renderHub(); } };
ACTIONS['perk'] = p => { if (buyPerk(p)) { toast('Hired!', 'good'); renderHub(); } };

/* ---------- Standings ---------- */
function tabStandings() {
  const st = standings(), T = tier(), sd = S.seasonData;
  const isF = T.vehicle === 'formula';
  const rounds = sd.tracks.map((t, i) => {
    const r = sd.results[i];
    if (!r) return `<tr><td class="pos">${i + 1}</td><td>${esc(t)}</td><td class="muted">—</td><td class="muted">—</td></tr>`;
    const w = r.rows.find(x => x.pos === 1), me = r.rows.find(x => x.id === 'player');
    return `<tr><td class="pos">${i + 1}</td><td>${esc(t)}</td><td>${esc(w.name)}</td><td><b>${me.dnf ? 'DNF' : 'P' + me.pos}</b></td></tr>`;
  }).join('');
  return `<div class="grid2">
    <div class="card"><div class="card-title"><h3>${T.name} — Season ${S.season}</h3>${tierBadge(S.tier)}</div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Driver</th>${isF ? '<th>Team</th>' : ''}<th>Wins</th><th>Pod</th><th style="text-align:right">Pts</th></tr></thead><tbody>
      ${st.map(r => `<tr class="${r.isPlayer ? 'me' : r.isRival ? 'rival' : ''}"><td class="pos">${r.pos}</td>
        <td><span class="swatch" style="background:${r.teamColor}"></span>${esc(r.name)}${r.isPlayer ? '<span class="tag you">YOU</span>' : ''}${r.isRival ? '<span class="tag rival">RIVAL</span>' : ''}</td>
        ${isF ? `<td class="muted small">${esc(r.team || '')}</td>` : ''}<td>${r.wins}</td><td>${r.podiums}</td><td style="text-align:right"><b>${r.pts}</b></td></tr>`).join('')}
      </tbody></table></div>
      <p class="muted small" style="margin:10px 0 0">Points: 25-18-15-12-10-8-6-4-2-1, +1 for fastest lap in the top 10. Top 3 earns promotion. P4–5 can get a wildcard with enough reputation or fans.</p>
    </div>
    <div class="card"><h3>Calendar</h3><div class="table-wrap"><table><thead><tr><th>Rd</th><th>Circuit</th><th>Winner</th><th>You</th></tr></thead><tbody>${rounds}</tbody></table></div></div>
  </div>`;
}

/* ---------- Career ---------- */
function tabCareer() {
  const t = S.totals;
  const ladder = TIERS.map((T, i) => {
    const done = S.history.some(h => h.tier === i) && i < S.tier;
    const cur = i === S.tier;
    const titles = S.trophies.filter(x => x.tier === i).length;
    return `<div class="rung ${cur ? 'current' : done ? 'done' : i > S.tier ? 'locked' : ''}">
      <span class="lvl">${i + 1}</span>
      <div><div class="rn" style="color:${T.color}">${T.name}</div><div class="rd">${T.cls} • ${T.desc}</div></div>
      <span class="st">${titles ? '🏆'.repeat(Math.min(titles, 5)) : cur ? 'YOU ARE HERE' : done ? '✓' : '🔒'}</span>
    </div>`;
  }).join('');
  return `<div class="grid2">
    <div class="card"><h3>Road to the Apex</h3><div class="ladder">${ladder}</div></div>
    <div class="stack">
      <div class="card"><h3>Career totals</h3><div class="kv">
        <div><small>Starts</small><b>${t.starts}</b></div><div><small>Wins</small><b>${t.wins}</b></div>
        <div><small>Podiums</small><b>${t.podiums}</b></div><div><small>Poles</small><b>${t.poles}</b></div>
        <div><small>Fastest laps</small><b>${t.fastest}</b></div><div><small>Titles</small><b>${t.titles}</b></div>
        <div><small>Legacy</small><b>${legacyScore()}</b></div>
      </div></div>
      <div class="card"><h3>Trophy cabinet</h3>${S.trophies.length ? S.trophies.map(x => `<div style="padding:6px 0">🏆 <b>${esc(x.name)}</b> <span class="muted small">Season ${x.season}</span></div>`).join('') : '<p class="muted" style="margin:0">Empty… for now.</p>'}</div>
      <div class="card"><h3>Season history</h3>${S.history.length ? `<div class="table-wrap"><table><thead><tr><th>S</th><th>Series</th><th>Pos</th><th>Wins</th><th>Pts</th></tr></thead><tbody>
        ${S.history.map(h => `<tr><td>${h.season}</td><td>${esc(h.tierName)}${h.team ? '<div class="muted small">' + esc(h.team) + '</div>' : ''}</td><td class="pos">P${h.pos}</td><td>${h.wins}</td><td>${h.pts}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted" style="margin:0">Your first season is under way.</p>'}</div>
    </div>
  </div>`;
}

/* ---------- Settings ---------- */
function tabSettings() {

/* ---------- tilt steering (phone gyro) ---------- */
// On phones, tilt is THE steering. Arrow buttons only appear if the sensor can't be used.
const IS_TOUCH = !!(window.matchMedia && (window.matchMedia('(hover: none) and (pointer: coarse)').matches
  || (window.matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0)))
  || (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 900 && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent));
if (IS_TOUCH) document.documentElement.classList.add('touch');
const TILT = { on: false, steer: 0, zero: 0, raw: 0, listening: false, got: false, asking: false, told: false };
const TILT_RANGE = 26;  // degrees of tilt for full lock
const TILT_DEAD = 2;    // dead zone in degrees
// How far the screen's left-right axis is tipped from level, in degrees (+ = right side down).
// Works whether the phone is held flat, upright like a wheel, portrait or landscape.
function tiltAngle(e) {
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  const D = Math.PI / 180, b = (e.beta || 0) * D, g = (e.gamma || 0) * D;
  let s;
  if (ang === 90) s = Math.sin(b);                       // landscape, top of phone to the left
  else if (ang === -90 || ang === 270) s = -Math.sin(b); // landscape, top to the right
  else if (ang === 180) s = -Math.sin(g) * Math.cos(b);
  else s = Math.sin(g) * Math.cos(b);                     // portrait
  return Math.asin(clamp(s, -1, 1)) / D;
}
function onOrientation(e) {
  if (e.beta == null && e.gamma == null) return;
  if (!TILT.got) {
    TILT.got = true; TILT.zero = tiltAngle(e) || 0;
    if (TILT.wanted && !TILT.on) { TILT.on = true; setTiltUI(); toast('Tilt steering is on.', 'good'); }
  }
  TILT.raw = tiltAngle(e) || 0;
  let d = TILT.raw - TILT.zero;
  if (Math.abs(d) < TILT_DEAD) d = 0; else d -= Math.sign(d) * TILT_DEAD;
  TILT.steer = clamp(d / (TILT_RANGE - TILT_DEAD), -1, 1);
  document.querySelectorAll('.tc-tilt-meter i').forEach(dot => { dot.style.left = (50 + TILT.steer * 45) + '%'; });
}
function setTiltUI() { const tc = $('#touch-controls'); if (tc) tc.classList.toggle('tilt-on', TILT.on); }
// Must be called straight from a tap (iPhone only shows the motion prompt for a tap).
function enableTilt(quiet) {
  if (TILT.listening) return Promise.resolve(true);
  if (!window.DeviceOrientationEvent) { if (!quiet) toast('This phone has no tilt sensor - using arrow buttons.', 'bad'); return Promise.resolve(false); }
  if (!window.isSecureContext) { if (!quiet) toast('Tilt needs the game opened from an https:// link.', 'bad'); return Promise.resolve(false); }
  const listen = () => { if (!TILT.listening) { window.addEventListener('deviceorientation', onOrientation); TILT.listening = true; } return true; };
  if (typeof DeviceOrientationEvent.requestPermission === 'function') { // iPhone
    if (TILT.pending) return TILT.pending;
    TILT.pending = DeviceOrientationEvent.requestPermission().then(r => {
      TILT.pending = null;
      if (r !== 'granted') { toast('Motion access was denied. Close the tab, reopen the game and tap Allow.', 'bad'); return false; }
      return listen();
    }).catch(() => { TILT.pending = null; return false; });
    return TILT.pending;
  }
  return Promise.resolve(listen());
}
// Turn tilt on for a race (phones only). Falls back to arrow buttons if no readings arrive.
function startTilt() {
  if (!IS_TOUCH) { TILT.on = false; TILT.wanted = false; setTiltUI(); return; }
  TILT.on = true; TILT.wanted = true; setTiltUI();
  enableTilt().then(ok => {
    if (!ok) { TILT.on = false; setTiltUI(); toast('Tilt is off - tap CENTER to turn it on.', 'bad'); return; }
    setTimeout(() => { if (TILT.got) TILT.zero = TILT.raw; }, 350); // however you hold it at the start = straight
    setTimeout(() => {
      if (!TILT.got) { TILT.on = false; setTiltUI(); toast('No tilt readings yet - using arrow buttons. Tap CENTER to try again.', 'bad'); }
      else if (!TILT.told) { TILT.told = true; toast('Tilt the phone to steer. Tap CENTER to re-level.', 'good'); }
    }, 1800);
  });
}
ACTIONS['tilt-center'] = () => {
  if (!TILT.listening || !TILT.got) { startTilt(); return; }
  TILT.on = true; setTiltUI();
  TILT.zero = TILT.raw; TILT.steer = 0;

};
// Ask for motion access on the first tap anywhere, so the iPhone prompt shows in the menus, not mid-race.
function tiltOnTap() {
  if (TILT.listening) { document.removeEventListener('click', tiltOnTap, true); document.removeEventListener('touchend', tiltOnTap, true); return; }
  enableTilt(true);
}

// gas / brake slider: the bottom zone is brake, anything above it is gas (more the higher you go), let go to coast
function bindPedal(pad, onValue) {
  const knob = pad.querySelector('.tc-knob');
  const BRAKE_ZONE = 0.28; // bottom share of the slider that brakes
  let id = null;
  const setY = y => { // y: 0 = bottom, 1 = top, null = released
    const r = pad.clientHeight, travel = r - 76;
    const ky = y == null ? BRAKE_ZONE : y;
    knob.style.transform = `translateY(${(0.5 - ky) * travel}px)`;
    pad.style.setProperty('--line', (100 - (38 + BRAKE_ZONE * travel) / r * 100).toFixed(1) + '%');
    let pd = 0;
    if (y != null && y < BRAKE_ZONE) pd = -(0.08 + 0.8 * (0.6 + 0.4 * (1 - y / BRAKE_ZONE)));
    else if (y != null) pd = 0.08 + 0.8 * clamp(0.55 + 0.45 * (y - BRAKE_ZONE) / 0.45, 0, 1);
    pad.classList.toggle('gas', pd > 0); pad.classList.toggle('brk', pd < 0);
    onValue(pd);
  };
  const fromEvent = e => { const r = pad.getBoundingClientRect(); return clamp((r.bottom - 38 - e.clientY) / (r.height - 76), 0, 1); };
  const reset = () => { id = null; pad.classList.remove('active'); setY(null); };
  window.addEventListener('resize', () => { if (id == null) setY(null); });
  requestAnimationFrame(() => setY(null));
  pad.addEventListener('pointerdown', e => { e.preventDefault(); id = e.pointerId; try { pad.setPointerCapture(id); } catch (x) { } pad.classList.add('active'); setY(fromEvent(e)); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === id) { e.preventDefault(); setY(fromEvent(e)); } });
  const end = e => { if (e.pointerId !== id) return; id = null; pad.classList.remove('active'); setY(null); };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  return reset;
}
UI.resetPedal = bindPedal($('#tc-pedal'), pd => { if (UI.engine) UI.engine.setPedal(pd); });
// touch controls
document.querySelectorAll('[data-touch]').forEach(b => {

  const off = e => { e.preventDefault(); b.classList.remove('active'); if (UI.engine) UI.engine.setTouch(key, false); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
});

</script>
  <script>
/* ============================================================
   Phone as a controller: race on the computer, drive with the phone.
   The computer shows a QR code; the phone connects peer-to-peer (WebRTC via PeerJS)
   and sends tilt steering, the gas/brake slider and button presses. The computer
   sends back the buttons on its current screen so the phone can press any of them,
   plus a little race info and vibration cues.
   ============================================================ */
const REMOTE = { peer: null, conn: null, code: null, role: null, buttons: [], lastUI: '', hudTimer: 0, sendTimer: 0, steerBtn: 0, pedal: 0, wake: null };
const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const QRJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
const REMOTE_ACTS = ['race-pause', 'race-resume', 'race-view', 'pit-open', 'race-reset'];
function loadScriptOnce(src) {
  loadScriptOnce.p = loadScriptOnce.p || {};
  return loadScriptOnce.p[src] = loadScriptOnce.p[src] || new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { loadScriptOnce.p[src] = null; rej(new Error('Could not load ' + src)); };
    document.head.appendChild(s);
  });
}
const padPeerId = code => 'kart2crown-pad-' + String(code).toLowerCase();
const padURL = code => location.origin + location.pathname + '?pad=' + code;
function remoteSend(m) { try { if (REMOTE.conn && REMOTE.conn.open) REMOTE.conn.send(m); } catch (e) { } }
function remoteConnected() { return !!(REMOTE.conn && REMOTE.conn.open); }

/* ---------------- computer side ---------------- */
function newPadCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
function remoteBadge() {
  let b = document.getElementById('remote-badge');
  if (!b) { b = document.createElement('button'); b.id = 'remote-badge'; b.className = 'remote-badge'; b.dataset.act = 'remote-host'; document.body.appendChild(b); }
  b.classList.toggle('hidden', REMOTE.role !== 'host');
  b.classList.toggle('on', remoteConnected());
  b.textContent = remoteConnected() ? '📱 Phone connected' : '📱 Waiting for phone…';
}
function remoteStatus(text, good) {
  const el = document.getElementById('remote-status');
  if (el) { el.textContent = text; el.classList.toggle('good', !!good); }
  remoteBadge();
}
ACTIONS['remote-host'] = () => {
  openModal(`<div class="remote-modal">
    <h2>Use your phone as the controller</h2>
    <p class="muted">The race shows on this screen. Your phone becomes the wheel: tilt to steer, thumb slider for gas and brake, and every button in the game.</p>
    <div class="remote-qr-wrap"><div id="remote-qr" class="remote-qr"></div></div>
    <p>Scan the code with your phone's camera, or open the game on your phone, tap <b>Control a computer</b> and enter</p>
    <div id="remote-code" class="remote-code">…</div>
    <div id="remote-status" class="remote-status">Starting…</div>
    <div class="btn-row" style="justify-content:center;margin-top:14px">
      <button class="btn primary" data-act="modal-close">Done</button>
      <button class="btn ghost" data-act="remote-stop">Disconnect</button>
    </div></div>`);
  hostRemote();
};
ACTIONS['remote-stop'] = () => {
  try { if (REMOTE.conn) REMOTE.conn.close(); if (REMOTE.peer) REMOTE.peer.destroy(); } catch (e) { }
  REMOTE.peer = REMOTE.conn = null; REMOTE.role = null; REMOTE.code = null;
  remoteBadge(); closeModal(); toast('Phone controller off');
};
function showRemoteCode() {
  const c = REMOTE.code, el = document.getElementById('remote-code'), qr = document.getElementById('remote-qr');
  if (el) el.textContent = c;
  if (qr && qr.dataset.code !== c) {
    qr.innerHTML = ''; qr.dataset.code = c;
    loadScriptOnce(QRJS_URL).then(() => { new QRCode(qr, { text: padURL(c), width: 200, height: 200, colorDark: '#0b0f1a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); })
      .catch(() => { qr.innerHTML = `<div class="muted small" style="padding:20px">QR code unavailable. Use the code below.</div>`; });
  }
}
async function hostRemote() {
  REMOTE.role = 'host';
  if (REMOTE.peer && !REMOTE.peer.destroyed && REMOTE.code) {
    showRemoteCode();
    remoteStatus(remoteConnected() ? 'Phone connected ✓' : 'Waiting for your phone…', remoteConnected());
    return;
  }
  try { await loadScriptOnce(PEERJS_URL); } catch (e) { remoteStatus('Could not load the connection library. Check your internet connection.'); return; }
  REMOTE.code = newPadCode();
  showRemoteCode();
  remoteStatus('Connecting…');
  const peer = new Peer(padPeerId(REMOTE.code));
  REMOTE.peer = peer;
  peer.on('open', () => remoteStatus('Waiting for your phone…'));
  peer.on('error', err => {
    if (err && err.type === 'unavailable-id') { try { peer.destroy(); } catch (e) { } REMOTE.peer = null; hostRemote(); return; }
    remoteStatus('Connection problem: ' + (err && err.type || 'unknown') + '. Close this and try again.');
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) { } });
  peer.on('connection', conn => {
    if (REMOTE.conn && REMOTE.conn.open) { try { REMOTE.conn.close(); } catch (e) { } }
    REMOTE.conn = conn;
    conn.on('open', () => {
      remoteStatus('Phone connected ✓', true); toast('Phone connected - it controls the game now', 'good');
      REMOTE.lastUI = ''; remoteSendUI();
      if (document.getElementById('remote-status')) setTimeout(() => { if (remoteConnected()) closeModal(); }, 900);
    });
    conn.on('data', onHostData);
    conn.on('close', () => { if (REMOTE.conn === conn) { REMOTE.conn = null; remoteStatus('Phone disconnected. Waiting for your phone…'); toast('Phone disconnected', 'bad'); if (UI.engine) { UI.engine.remoteSteer = 0; UI.engine.setPedal(0); } } });
  });
}
function onHostData(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'in') {
    const e = UI.engine; if (!e) return;
    e.remoteSteer = clamp(+m.s || 0, -1, 1);
    e.remoteAt = performance.now();
    e.setPedal(clamp(+m.p || 0, -1, 1));
  } else if (m.t === 'act' && REMOTE_ACTS.includes(m.a)) {
    if (m.a === 'race-pause' && UI.engine && UI.engine.paused) ACTIONS['race-resume'] && ACTIONS['race-resume']();
    else if (ACTIONS[m.a]) ACTIONS[m.a]();
  } else if (m.t === 'click') {
    const b = REMOTE.buttons[m.i | 0];
    if (b && b.isConnected && !b.disabled) b.click();
  } else if (m.t === 'hello') { REMOTE.lastUI = ''; remoteSendUI(); }
}
// visible buttons on the computer's current screen, so the phone can press them
function visibleButtons(root) {
  return [...root.querySelectorAll('[data-act]')].filter(b => {
    if (b.disabled || b.id === 'remote-badge') return false;
    if (b.closest('.touch-controls')) return false;
    const r = b.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return false;
    const cs = getComputedStyle(b); return cs.visibility !== 'hidden' && cs.opacity !== '0';
  });
}
function remoteSendUI() {
  if (!remoteConnected()) return;
  const raceOn = !$('#race-screen').classList.contains('hidden');
  const modalOn = !$('#modal').classList.contains('hidden');
  let roots;
  if (modalOn) roots = [$('#modal')];
  else if (raceOn) roots = [$('#pit-menu'), $('#pause-menu')].filter(r => !r.classList.contains('hidden'));
  else roots = [appEl];
  const btns = roots.flatMap(r => visibleButtons(r)).slice(0, 80);

/* ----- the race on the host ----- */
function mpStartMsg(p) {
  const e = MP.engine;
  return { t: 'start', cfg: Object.assign({}, MP.raceCfg, { you: p.id }), late: e ? e.state === 'race' : false };
}
ACTIONS['mp-go'] = () => {
  MP.players = MP.players.filter(p => !p.gone && p.conn && p.conn.open);
  if (!MP.players.length && !MP.hostPlays) { toast('Nobody has joined yet', 'bad'); return; }
  const T = TIERS[MP.tier], track = buildTrack(MP.track, T), laps = raceLaps(track, T);
  const weather = genWeather(Math.floor(Math.random() * 1e9));
  const used = new Set();
  const codeFor = name => { let c = codeOf(name), i = 2; while (used.has(c)) c = codeOf(name).slice(0, 2) + i++; used.add(c); return c; };
  const even = { spd: 70, acc: 70, hnd: 70, foc: 70, rc: 70, fit: 70 }, mach = { eng: 0.6, chas: 0.6, tire: 0.6 };
  const humans = MP.players.slice();
  if (MP.hostPlays) humans.unshift({ id: 'host', name: MP.hostName || 'Host', color: '#ffffff', tyre: MP.hostTyre, host: true });
  const racers = humans.map((p, i) => ({ id: p.id, name: p.name, code: codeFor(p.name), color: p.color, helmet: p.host ? '#e63946' : '#ffffff', team: T.vehicle === 'formula' ? p.color : null, stats: Object.assign({}, even), machine: Object.assign({}, mach), perf: 1, compound: p.tyre, human: true, isPlayer: !!p.host, number: i + 1 }));
  if (MP.ai) {
    const n = Math.max(0, Math.max(T.field, racers.length) - racers.length), names = new Set(racers.map(r => r.name));
    for (let i = 0; i < n; i++) {
      const name = randomName(names), col = BODY_COLORS[i % BODY_COLORS.length];
      racers.push({ id: 'ai' + i, name, code: codeFor(name), color: col, helmet: pick(HELMET_COLORS), team: T.vehicle === 'formula' ? col : null, stats: statsAround(64, 5), machine: Object.assign({}, mach), perf: 1, compound: aiCompound(null, weather) });
    }
  }
  shuffle(racers);
  MP.raceCfg = { tier: MP.tier, track: MP.track, laps, weather, racers: racers.map(r => ({ id: r.id, name: r.name, code: r.code, color: r.color, helmet: r.helmet, team: r.team, stats: r.stats, machine: r.machine, compound: r.compound, human: !!r.human })) };
  for (const p of MP.players) { try { p.conn.send(mpStartMsg(p)); } catch (e) { } }
  MP.log = []; MP.results = null; MP.prevPits = {};
  const onCarEvent = (c, ev) => {
    const p = MP.players.find(x => x.id === c.id);
    if (p && p.conn && p.conn.open) { try { p.conn.send(Object.assign({ t: 'ev', t2: ev.t }, ev, { t: 'ev' })); } catch (e) { } }
  };
  if (MP.hostPlays) { mpHostPlayRace(T, track, laps, racers, weather, onCarEvent); return; }
  // the host engine runs headless; the overview below draws it
